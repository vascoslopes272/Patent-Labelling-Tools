'use strict';
// ─── state ───────────────────────────────────────────────────────────────────
var FILES = {};          // basename -> File (from the folder pick)
var BATCH = null;        // "Batch_01"
var WB = null;           // the identity workbook (kept so other sheets survive export)
var HEADER = [];         // Identity column order
var ROWS = [];           // Identity rows as objects
var IMAGES = {};         // patent_id -> [{path, fname, approved}]
var VIEW = [];           // indices into ROWS currently navigable
var CUR = 0;
var ELEC_OPTS = ['Yes','Hybrid','No'];
var HUMAN = ['aircraft_name_human','aircraft_name_human_variants',
             'is_electric_human','is_electric_human_variants',
             'takeoff_human','takeoff_human_variants',
             'uav_human','uav_human_variants',
             'electric_similar_human','electric_similar_human_variants',
             'name_uncertain','electric_uncertain','takeoff_uncertain','uav_uncertain',
             'review_status','reviewed_by','reviewed_at','notes'];

function skey(){ return 'idreview_' + BATCH; }
function loadDecisions(){ try { return JSON.parse(localStorage.getItem(skey()) || '{}'); } catch(e){ return {}; } }
function saveDecision(pid, patch){
  var d = loadDecisions(); d[pid] = Object.assign(d[pid] || {}, patch, {_t: Date.now()});
  try { localStorage.setItem(skey(), JSON.stringify(d)); } catch(e){ console.warn(e); }
  var row = rowById(pid); if (row) Object.assign(row, patch);
}
function rowById(pid){ for (var i=0;i<ROWS.length;i++) if (ROWS[i].patent_id === pid) return ROWS[i]; return null; }
function blank(v){ return v === null || v === undefined || String(v).trim() === '' || String(v) === 'nan'; }
function pathToFileURL(p){
  if (!p || String(p).trim() === '') return null;
  p = String(p); if (/^(https?|file):\/\//i.test(p)) return p;
  var c = p.replace(/\\/g,'/'); if (/^[a-zA-Z]:/.test(c)) return 'file:///' + c;
  return 'file://' + (c.startsWith('/') ? '' : '/') + c;
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }

// ─── folder pick ─────────────────────────────────────────────────────────────
document.getElementById('folder').addEventListener('change', function(ev){
  FILES = {};
  var batches = {};
  Array.prototype.forEach.call(ev.target.files, function(f){
    var rel = f.webkitRelativePath || f.name;
    if (rel.indexOf('/_backups/') >= 0 || /BACKUP_|PRE_/.test(f.name)) return;
    FILES[f.name] = f;
    var m = f.name.match(/^aircraft_identity_(Batch_\d+)\.xlsx$/); if (m) batches[m[1]] = true;
  });
  var sel = document.getElementById('batch'); sel.innerHTML = '';
  Object.keys(batches).sort().forEach(function(b){ var o = document.createElement('option'); o.value = b; o.textContent = b; sel.appendChild(o); });
  sel.disabled = !Object.keys(batches).length;
  if (!Object.keys(batches).length) { alert('No aircraft_identity_Batch_NN.xlsx found. Pick 1639_LABELLED/labels.'); return; }
  loadBatch(sel.value);
});
document.getElementById('batch').addEventListener('change', function(){ loadBatch(this.value); });
document.getElementById('view').addEventListener('change', function(){ CUR = 0; buildView(); render(); });
document.getElementById('reviewer').addEventListener('change', function(){ try { localStorage.setItem('idreview_reviewer', this.value); } catch(e){} });
try { document.getElementById('reviewer').value = localStorage.getItem('idreview_reviewer') || ''; } catch(e){}

function readWorkbook(file, cb){
  var r = new FileReader();
  r.onload = function(e){ cb(XLSX.read(new Uint8Array(e.target.result), {type:'array'})); };
  r.readAsArrayBuffer(file);
}

function loadBatch(batch){
  BATCH = batch;
  var idf = FILES['aircraft_identity_' + batch + '.xlsx'];
  document.getElementById('empty').textContent = 'Loading ' + batch + '…';
  readWorkbook(idf, function(wb){
    WB = wb;
    var ws = wb.Sheets['Identity'];
    HEADER = XLSX.utils.sheet_to_json(ws, {header:1})[0].map(String);
    ROWS = XLSX.utils.sheet_to_json(ws, {defval:null}).map(function(r){
      // normalise NaN-ish text from pandas
      HEADER.forEach(function(h){ if (r[h] === 'nan' || r[h] === 'None') r[h] = null; });
      return r;
    });
    // decisions saved in this browser win over what the xlsx holds
    var d = loadDecisions();
    ROWS.forEach(function(r){ var p = d[r.patent_id]; if (p) HUMAN.forEach(function(h){ if (p[h] !== undefined) r[h] = p[h]; }); });
    loadImages(batch, function(){ fillViewMenu(); buildView(); CUR = firstOpen(); render(); document.getElementById('export').disabled = false; });
  });
}

// images: the feed has every crop; the reviewed export says which you approved
function loadImages(batch, cb){
  IMAGES = {};
  var feed = FILES['ml_predict_labels_' + batch + '.xlsx'];
  var rev  = FILES['reviewed_patents_' + batch + '.xlsx'];
  function addRows(rows, approvedMap){
    rows.forEach(function(r){
      var p = r.Image_Path; if (blank(p)) return;
      var pid = String(r.Patent_ID || '').replace(/_arch\d+$/, '');
      var fname = String(p).split('/').pop();
      IMAGES[pid] = IMAGES[pid] || {};
      if (!IMAGES[pid][fname]) IMAGES[pid][fname] = {path:String(p), fname:fname, approved:false};
    });
  }
  function finish(){
    Object.keys(IMAGES).forEach(function(pid){
      IMAGES[pid] = Object.keys(IMAGES[pid]).map(function(k){ return IMAGES[pid][k]; })
        .sort(function(a,b){ return (b.approved - a.approved) || a.fname.localeCompare(b.fname); });
    });
    cb();
  }
  var pending = 0;
  if (feed) { pending++; readWorkbook(feed, function(wb){ addRows(XLSX.utils.sheet_to_json(wb.Sheets['Review'], {defval:null})); if (!--pending) finish(); }); }
  if (rev)  { pending++; readWorkbook(rev, function(wb){
    var rows = XLSX.utils.sheet_to_json(wb.Sheets['Review'], {defval:null});
    addRows(rows);
    rows.forEach(function(r){
      if (r.Section === 'T2' && r.Field === 'status' && String(r.Value) === 'approved' && !blank(r.Image_Path)) {
        var pid = String(r.Patent_ID || '').replace(/_arch\d+$/, ''); var fname = String(r.Image_Path).split('/').pop();
        if (IMAGES[pid] && IMAGES[pid][fname]) IMAGES[pid][fname].approved = true;
      }
    });
    if (!--pending) finish();
  }); }
  if (!pending) finish();
}

// ─── navigation ──────────────────────────────────────────────────────────────
function inQueue(r){ return !blank(r.review_queue); }

// The sets worth walking through. "queue" is what still needs a decision;
// "named" is every patent the machine proposed a REAL aircraft name for — those
// are mostly gazetteer guesses from company + filing year, so they are worth
// confirming even when nothing else about the row is open.
var VIEWS = [
  {id:'queue',  label:'review queue',             test:function(r){ return inQueue(r); }},
  {id:'named',  label:'has a real aircraft name', test:function(r){ return !blank(r.aircraft_name); }, focus:['name']},
  {id:'name',   label:'name still open',          test:function(r){ return isFlag(r.name_review); }, focus:['name']},
  {id:'todo',   label:'queue, not yet done',      test:function(r){ return inQueue(r) && !isDone(r); }},
  {id:'all',    label:'every patent',             test:function(){ return true; }}
];
function currentView(){
  var v = document.getElementById('view').value || 'queue';
  for (var i=0;i<VIEWS.length;i++) if (VIEWS[i].id === v) return VIEWS[i];
  return VIEWS[0];
}
function fillViewMenu(){
  var sel = document.getElementById('view'), keep = sel.value || 'queue';
  sel.innerHTML = VIEWS.map(function(v){
    var n = 0; for (var i=0;i<ROWS.length;i++) if (v.test(ROWS[i])) n++;
    return '<option value="' + v.id + '">' + v.label + ' (' + n + ')</option>';
  }).join('');
  sel.value = keep;
}
function isDone(r){ var s = String(r.review_status || '').toLowerCase(); return s === 'done' || s === 'skip'; }
function buildView(){
  var v = currentView();
  VIEW = []; ROWS.forEach(function(r,i){ if (v.test(r)) VIEW.push(i); });
  if (CUR >= VIEW.length) CUR = Math.max(0, VIEW.length - 1);
}
function firstOpen(){ for (var i=0;i<VIEW.length;i++) if (!isDone(ROWS[VIEW[i]])) return i; return 0; }
function go(n){ if (!VIEW.length) return; CUR = Math.min(Math.max(0,n), VIEW.length-1); render(); window.scrollTo(0,0); }
document.getElementById('prev').onclick = function(){ go(CUR-1); };
document.getElementById('next').onclick = function(){ go(CUR+1); };
document.addEventListener('keydown', function(e){
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') go(CUR+1);
  else if (e.key === 'ArrowLeft') go(CUR-1);
  else if (e.key === 'Enter') markAndNext('done');
  else if (e.key.toLowerCase() === 's') markAndNext('skip');
});
function markAndNext(status){
  var r = ROWS[VIEW[CUR]]; if (!r) return;
  saveDecision(r.patent_id, {review_status:status, reviewed_by: document.getElementById('reviewer').value || null,
                             reviewed_at: new Date().toISOString().slice(0,10)});
  var nxt = -1; for (var i=CUR+1;i<VIEW.length;i++) if (!isDone(ROWS[VIEW[i]])) { nxt = i; break; }
  go(nxt >= 0 ? nxt : CUR+1);
}

// ─── render ──────────────────────────────────────────────────────────────────
function pill(txt, cls){ return '<span class="pill ' + (cls||'') + '">' + esc(txt) + '</span>'; }
function quote(section, text){
  if (blank(text) && blank(section)) return '<div class="muted small">no sentence to quote</div>';
  return '<div class="quote"><small>' + esc(section || '') + '</small>' + esc(text || '') + '</div>';
}
function choice(r, col, options){
  return '<div class="choices">' + options.map(function(o){
    return '<button data-col="' + col + '" data-val="' + esc(o) + '" class="' + (String(r[col]||'') === o ? 'on' : '') + '">' + esc(o) + '</button>';
  }).join('') + '<button data-col="' + col + '" data-val="" class="small">clear</button></div>';
}
// The wizard's own humanUncertain convention: you looked, and the sources
// cannot answer it. That IS an answer — the field leaves the queue — but the
// flag travels with the data instead of a guess.
function isFlag(v){ return v === true || ['true','1','yes','y'].indexOf(String(v).trim().toLowerCase()) > -1; }
function uncertain(r, col){
  var on = isFlag(r[col]);
  return '<div class="choices" style="margin-top:6px"><button data-col="' + col + '" data-val="' + (on ? '' : 'TRUE') + '" class="' + (on ? 'on' : 'small') + '" title="the patent and its figures do not answer this">'
       + (on ? '\u2713 marked: not answerable from the sources' : '? cannot tell from the patent') + '</button></div>';
}
// A card is open when the view is about it, or (with no focus) when it still
// needs a decision. Everything else collapses to its title line — you asked for
// a patent where "only the name changed" not to cost four readings.
var EXPAND = {}, EXPAND_PID = null;
function cardOpen(r, id, needs){
  if (EXPAND_PID !== r.patent_id) { EXPAND = {}; EXPAND_PID = r.patent_id; }
  if (EXPAND[id]) return true;
  var f = currentView().focus;
  return f ? f.indexOf(id) > -1 : !!needs;
}
function cardHead(r, id, title, needs, summary){
  var open = cardOpen(r, id, needs);
  return {open: open,
          cls: 'card' + (needs ? ' queued' : '') + (open ? '' : ' collapsed'),
          h3: '<h3 data-card="' + id + '" title="click to ' + (open ? 'collapse' : 'open') + '">'
              + (open ? '' : '\u25b8 ') + esc(title)
              + '<span class="state">' + esc(summary) + '</span></h3>'};
}
function state(r, flag, col){ return r[flag] && blank(r[col]) ? 'still yours' : (!blank(r[col]) ? 'answered by you' : 'settled'); }

// How many aircraft this patent describes (your wizard _archN records).
function nVariants(r){ var n = parseInt(r.wizard_arch_count, 10); return (n && n > 1) ? n : 1; }
function variantLabels(r){
  var types = String(r.wizard_variant_types || '').split('|').map(function(t){ return t.trim(); });
  var out = [];
  for (var i = 0; i < nVariants(r); i++)
    out.push(String.fromCharCode(97 + i) + (types[i] && types[i] !== '?' ? ' \u00b7 ' + types[i] : ''));
  return out;
}
function nthVariant(joined, i){
  if (blank(joined)) return '';
  var parts = String(joined).split(';').map(function(x){ return x.trim(); });
  return parts[i] || '';
}
function setVariant(r, col, i, val){
  var n = nVariants(r), parts = [], any = false;
  for (var k = 0; k < n; k++) { parts.push(k === i ? (val || '') : nthVariant(r[col], k)); if (parts[k]) any = true; }
  var patch = {}; patch[col] = any ? parts.join('; ') : null;
  saveDecision(r.patent_id, patch);
}
// One button row per aircraft, shown only when the patent describes more than one.
function variantChoice(r, col, options, patentCol){
  if (nVariants(r) < 2) return '';
  var labels = variantLabels(r);
  var patentVal = String(r[patentCol] == null ? '' : r[patentCol]).trim();
  var html = '<div class="small muted" style="margin-top:8px">per aircraft — the answer above applies to all of them; change one only if it differs:</div>';
  for (var i = 0; i < labels.length; i++) {
    var own = nthVariant(r[col], i);            // explicitly set on this aircraft
    var eff = own || patentVal;                 // what this aircraft actually is
    html += '<div class="choices" style="margin:4px 0"><span class="pill">' + esc(labels[i]) + '</span>'
         + options.map(function(o){
             var cls = eff === o ? (own ? 'on' : 'on inherited') : '';
             return '<button data-vcol="' + col + '" data-vi="' + i + '" data-val="' + esc(o) + '" class="' + cls + '" title="' + (eff === o && !own ? 'from the answer above' : '') + '">' + esc(o) + '</button>';
           }).join('')
         + (own ? '<button data-vcol="' + col + '" data-vi="' + i + '" data-val="" class="small">reset</button>' : '')
         + '</div>';
  }
  return html;
}
// A duplicate's figures live on the original — it was never re-labelled.
function imagesFor(r){
  var own = IMAGES[r.patent_id] || [];
  if (own.length || blank(r.wizard_duplicate_of)) return {list: own, from: null};
  var orig = IMAGES[String(r.wizard_duplicate_of).trim()] || [];
  return {list: orig, from: orig.length ? String(r.wizard_duplicate_of).trim() : null};
}

function render(){
  var main = document.getElementById('main');
  fillViewMenu();
  document.getElementById('progress').textContent = ROWS.length ? (ROWS.filter(isDone).length + ' done · ' + ROWS.filter(function(r){ return inQueue(r) && !isDone(r); }).length + ' still open · ' + ROWS.length + ' patents') : '';
  if (!VIEW.length) { main.innerHTML = '<div id="empty">Nothing in <b>' + esc(currentView().label) + '</b> for this batch — pick another view above.</div>'; document.getElementById('pos').textContent=''; return; }
  var r = ROWS[VIEW[CUR]];
  document.getElementById('pos').textContent = (CUR+1) + ' / ' + VIEW.length;
  var pack = imagesFor(r), imgs = pack.list;
  var q = String(r.review_queue || '');
  var dup = '';
  if (!blank(r.wizard_duplicate_type) || !blank(r.wizard_duplicate_of)) {
    var d3 = String(r.wizard_duplicate_type) === '3';
    dup = '<div class="card" style="border-left:6px solid #6a8caf"><h3>Duplicate</h3>'
        + '<div class="kv"><b>type</b><span>D' + esc(r.wizard_duplicate_type)
        + (d3 ? ' — same invention with VISIBLE DIFFERENCES: a different aircraft, own name'
              : ' — the SAME aircraft as the original, so it carries the original name') + '</span>'
        + '<b>original</b><span><b>' + esc(r.wizard_duplicate_of) + '</b></span></div>'
        + (blank(r.duplicate_root_note) ? '' : '<div class="kv"><b>answers</b><span>' + esc(r.duplicate_root_note) + '</span></div>')
        + (blank(r.duplicate_root_aircraft) ? '' : '<div class="kv"><b>note</b><span>the original describes ' + esc(r.duplicate_root_aircraft) + ' aircraft; the link names the patent, not one of them</span></div>')
        + '<div class="small muted" style="margin-top:6px">'
        + (d3 ? 'A D3 is a different aircraft, so it is reviewed on its own.'
              : 'Nothing to review here: this IS the original aircraft, so its electric / take-off / UAV / name answers are inherited. It is not in the queue.')
        + '</div></div>';
  }
  var left = '<div class="card">'
    + '<p class="title">' + esc(r.patent_id) + ' <span class="muted" style="font-weight:400">· ' + esc(r.company_canonical) + ' · ' + esc(r.app_year) + '</span></p>'
    + '<div class="small" style="margin-bottom:6px">' + esc(r.title) + '</div>'
    + '<div class="choices" style="margin:2px 0 8px">'
    + (blank(r.pdf_link) ? '' : '<a href="' + esc(r.pdf_link) + '" target="_blank" rel="noopener"><button>\ud83d\udcc4 Source PDF</button></a>')
    + '<a href="https://patents.google.com/patent/' + encodeURIComponent(String(r.patent_id)) + '/en" target="_blank" rel="noopener"><button>\ud83d\udd0e Google Patents</button></a>'
    + '</div>'
    + (r.wizard_approved === true ? pill('approved in wizard','teal') : pill('DISAPPROVED: ' + (r.wizard_disapprove_reason||''),'teal'))
    + (blank(q) ? pill('nothing open','settled') : q.split('+').map(function(x){ return pill(x,'open'); }).join(''))
    + (isDone(r) ? pill(r.review_status,'violet') : '')
    + '<div class="small muted" style="margin-top:6px">' + esc(r.review_reason || '') + '</div>'
    + '</div>'
    + dup
    + '<div class="card"><h3>Figures <span class="state">' + (imgs.filter(function(i){return i.approved;}).length) + ' approved · ' + imgs.length + ' total — click to enlarge</span></h3>'
    + (pack.from ? '<div class="small muted" style="margin-bottom:6px">this patent has no crops of its own — showing the figures of its original, ' + esc(pack.from) + '</div>' : '')
    + (imgs.length ? '<div class="gallery">' + imgs.slice(0,12).map(function(i){
        return '<figure class="' + (i.approved ? 'approved' : 'dim') + '" data-src="' + esc(pathToFileURL(i.path)) + '"><img src="' + esc(pathToFileURL(i.path)) + '" onerror="this.parentNode.style.display=\'none\'" alt=""><figcaption>' + esc(i.fname) + '</figcaption></figure>';
      }).join('') + '</div>' : '<div class="muted small">no figures on disk for this patent</div>')
    + '</div>';

  var cards = '';
  // NAME
  var variants = !blank(r.aircraft_group_variants);
  var hd = cardHead(r, 'name', 'Real aircraft name', r.name_review,
                    (blank(r.aircraft_name_human) ? String(r.aircraft_group || '') : String(r.aircraft_name_human)) + ' · ' + state(r,'name_review','aircraft_name_human'));
  cards += '<div class="' + hd.cls + '">' + hd.h3
    + '<div class="kv"><b>working name</b><span class="big">' + esc(r.aircraft_group) + '</span>'
    + '<b>from</b><span>' + esc(r.aircraft_group_source) + (blank(r.aircraft_group_note) ? '' : ' — ' + esc(r.aircraft_group_note)) + '</span>'
    + (variants ? '<b>aircraft</b><span><b>' + esc(nVariants(r)) + '</b> in this patent: ' + esc(r.aircraft_group_variants) + ' <span class="muted">(' + esc(r.wizard_variant_types) + ')</span></span>' : '')
    + '<b>proposal</b><span>' + (blank(r.aircraft_name) ? '<span class="muted">none</span>' : '<b>' + esc(r.aircraft_name) + '</b> <span class="muted small">' + esc(r.aircraft_name_source) + ' · in text: ' + esc(r.aircraft_name_in_text || '—') + '</span>') + '</span>'
    + (blank(r.aircraft_name_alternatives) ? '' : '<b>alternatives</b><span>' + esc(r.aircraft_name_alternatives) + '</span>')
    + '</div>'
    + (blank(r.aircraft_name_quote) ? '' : quote(r.aircraft_name_section, r.aircraft_name_quote))
    + '<div style="margin-top:8px"><label class="small muted">Real name (leave empty to keep the working name)</label>'
    + '<input type="text" data-col="aircraft_name_human" list="names" value="' + esc(r.aircraft_name_human || '') + '">'
    + '<datalist id="names">' + [r.aircraft_name].concat(String(r.aircraft_name_alternatives||'').split(';')).filter(function(x){return !blank(x);}).map(function(x){ return '<option value="' + esc(String(x).trim()) + '">'; }).join('') + '</datalist></div>'
    + (blank(r.aircraft_name_variant_proposals) ? '' :
       '<div style="margin-top:8px"><label class="small muted">One real name per variant, in order, separated by ; — candidates: <b>' + esc(r.aircraft_name_variant_proposals) + '</b></label>'
       + '<input type="text" data-col="aircraft_name_human_variants" value="' + esc(r.aircraft_name_human_variants || '') + '" placeholder="e.g. ' + esc(String(r.aircraft_name_variant_proposals).split(';').slice(0,2).join(';')) + '"></div>')
    + uncertain(r, 'name_uncertain')
    + '</div>';
  // ELECTRIC
  hd = cardHead(r, 'electric', 'Electric?', r.electric_review,
                String(r.is_electric_final || r.is_electric || '—') + ' · ' + state(r,'electric_review','is_electric_human'));
  cards += '<div class="' + hd.cls + '">' + hd.h3
    + '<div class="kv"><b>machine</b><span><span class="big">' + esc(r.is_electric || 'Unknown') + '</span> <span class="muted small">' + (blank(r.is_electric_source) ? 'nobody answered' : 'by ' + esc(r.is_electric_source)) + '</span></span>'
    + '<b>powertrain</b><span>' + esc(r.powertrain || '—') + ' <span class="muted small">' + esc(r.powertrain_source || '') + (blank(r.powertrain_confidence) ? '' : ' · conf ' + Number(r.powertrain_confidence).toFixed(2)) + '</span></span></div>'
    + quote(r.powertrain_section, r.powertrain_quote)
    + (blank(r.powertrain_other) ? '' : '<div class="small muted" style="margin-top:6px">the text also states <b>' + esc(r.powertrain_other) + '</b>:</div>' + quote('', r.powertrain_other_quote))
    + (String(r.is_electric_source) === 'presumed' ? '<div class="small muted">no propulsion stated — presumed electric, nothing to read</div>' : '')
    + choice(r, 'is_electric_human', ELEC_OPTS)
    + variantChoice(r, 'is_electric_human_variants', ELEC_OPTS, 'is_electric_final')
    + uncertain(r, 'electric_uncertain')
    // Not electric, but architecturally equivalent — its own field, seeded from
    // the wizard's ElectricSimilar edge tag, so "is it electric" and "keep it
    // anyway" never collapse into one column.
    + '<div class="small muted" style="margin-top:10px">Not electric, but the configuration belongs in the design space anyway?'
    + (String(r.wizard_edge_tags || '').indexOf('ElectricSimilar') > -1 ? ' <b>you already tagged this ElectricSimilar in the wizard</b>' : '') + '</div>'
    + choice(r, 'electric_similar_human', ['ElectricSimilar','No'])
    + variantChoice(r, 'electric_similar_human_variants', ['ElectricSimilar','No'], 'electric_similar_final')
    + '</div>';
  // TAKEOFF
  hd = cardHead(r, 'takeoff', 'VTOL or STOL?', r.takeoff_review,
                String(r.takeoff_final || r.takeoff_mode || '—') + ' · ' + state(r,'takeoff_review','takeoff_human'));
  cards += '<div class="' + hd.cls + '">' + hd.h3
    + '<div class="kv"><b>machine</b><span><span class="big">' + esc(r.takeoff_mode || 'unknown') + '</span> <span class="muted small">' + esc(r.takeoff_source || '') + '</span></span></div>'
    + quote(r.takeoff_section, r.takeoff_quote)
    + choice(r, 'takeoff_human', ['VTOL','STOL','CTOL'])
    + variantChoice(r, 'takeoff_human_variants', ['VTOL','STOL','CTOL'], 'takeoff_final')
    + uncertain(r, 'takeoff_uncertain') + '</div>';
  // UAV
  hd = cardHead(r, 'uav', 'UAV tag?', r.uav_review,
                String(r.uav_final || r.uav_hint || '—') + ' · ' + state(r,'uav_review','uav_human'));
  cards += '<div class="' + hd.cls + '">' + hd.h3
    + '<div class="kv"><b>text says</b><span><span class="big">' + esc(r.uav_hint || 'no UAV vocabulary') + '</span></span>'
    + '<b>your wizard tags</b><span>' + esc(r.wizard_edge_tags || '—') + '</span></div>'
    + (blank(r.uav_quote) ? '' : quote(r.uav_section, r.uav_quote))
    + choice(r, 'uav_human', ['UAVSimilar','No','Pure'])
    + variantChoice(r, 'uav_human_variants', ['UAVSimilar','No','Pure'], 'uav_final')
    + uncertain(r, 'uav_uncertain') + '</div>';
  // NOTES + actions
  cards += '<div class="card"><label class="small muted">Notes</label><textarea data-col="notes">' + esc(r.notes || '') + '</textarea>'
    + '<div class="choices" style="margin-top:10px"><button class="primary" onclick="markAndNext(\'done\')">✔ Done → next (Enter)</button>'
    + '<button onclick="markAndNext(\'skip\')">Skip → next (S)</button>'
    + '<span class="muted small" style="align-self:center">' + (isDone(r) ? 'marked ' + esc(r.review_status) + (blank(r.reviewed_at) ? '' : ' on ' + esc(r.reviewed_at)) : 'not marked yet') + '</span></div></div>';

  main.innerHTML = '<div>' + left + '</div><div>' + cards + '</div>';

  main.querySelectorAll('button[data-col]').forEach(function(b){
    b.onclick = function(){
      var patch = {}; patch[b.dataset.col] = b.dataset.val || null;
      // The answer above settles every aircraft: drop any per-aircraft override
      // so all of them follow it again. Change one afterwards if it differs.
      var twin = {is_electric_human: 'is_electric_human_variants',
                  takeoff_human: 'takeoff_human_variants',
                  uav_human: 'uav_human_variants',
                  aircraft_name_human: 'aircraft_name_human_variants',
                  electric_similar_human: 'electric_similar_human_variants'}[b.dataset.col];
      if (twin) patch[twin] = null;
      saveDecision(r.patent_id, patch); render();
    };
  });
  main.querySelectorAll('button[data-vcol]').forEach(function(b){
    b.onclick = function(){ setVariant(r, b.dataset.vcol, parseInt(b.dataset.vi, 10), b.dataset.val); render(); };
  });
  main.querySelectorAll('input[data-col], textarea[data-col]').forEach(function(inp){
    inp.onchange = function(){ var patch = {}; patch[inp.dataset.col] = inp.value.trim() || null; saveDecision(r.patent_id, patch); };
  });
  main.querySelectorAll('h3[data-card]').forEach(function(h){
    h.onclick = function(){ var id = h.dataset.card; EXPAND[id] = !cardOpen(r, id, false); render(); };
  });
  main.querySelectorAll('.gallery figure').forEach(function(f){
    f.onclick = function(){ document.getElementById('bigimg').src = f.dataset.src; document.getElementById('big').style.display = 'flex'; };
  });
}

// ─── export ──────────────────────────────────────────────────────────────────
document.getElementById('export').onclick = function(){
  var ws = XLSX.utils.json_to_sheet(ROWS, {header: HEADER});
  WB.Sheets['Identity'] = ws;
  var fname = 'aircraft_identity_' + BATCH + '.xlsx';
  XLSX.writeFile(WB, fname);
  var done = ROWS.filter(isDone).length;
  alert(fname + ' written to your Downloads with ' + done + ' patents marked.\n\nMove it over labels/' + BATCH + '/' + fname + ' (the notebook backs up the old one), then re-run notebook cells 4–9 to refresh the queue and the colours.');
};
</script>
</body>
</html>
