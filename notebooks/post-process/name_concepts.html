#clist{overflow:auto;flex:1}
.c{padding:6px 10px;border-bottom:1px solid #eee;cursor:pointer}

.c .t{font-weight:600}.c .s{font-size:12px;color:#555}

#right{flex:1;display:flex;flex-direction:column;min-width:0}

.p{background:#fff;border:2px solid #ccc;border-radius:6px;padding:4px;cursor:pointer;position:relative}

.p .m{font-size:11.5px;line-height:1.35;color:#333;margin-top:3px}
.p .m b{color:#000}
.p.named{opacity:.5;cursor:not-allowed}
#warn{display:none;background:#fff3cd;border-bottom:2px solid #c79100;padding:8px 12px;max-height:45vh;overflow:auto}
#warn .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#warn .w{width:170px;background:#fff;border:1px solid #ccc;border-radius:4px;padding:3px;font-size:11px}
#warn .w img{width:100%;height:110px;object-fit:contain}
#warn .w.new{border:2px solid #2e7d32}
#warn button{margin-left:8px}
#rep{font-size:12px;padding:6px 10px;border-top:1px solid #ddd;background:#fff8e1;max-height:22vh;overflow:auto}
.p.mine{border-color:#2e7d32;box-shadow:0 0 0 3px #a5d6a7}
.p.none{border-style:dashed}
.p .tag{position:absolute;top:6px;left:6px;font-size:11px;padding:1px 6px;border-radius:8px;background:#1f2d3d;color:#fff;max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p .tag.mine{background:#2e7d32}.p .tag.none{background:#9e9e9e}

#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;z-index:9;padding:12px;overflow:auto}
#zoom .imgs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#zoom img{max-height:80vh;max-width:95vw;background:#fff}
#zoom .cap{color:#fff;margin-bottom:8px}
.hint{font-size:12px;color:#cfd8dc}
#done{max-height:30vh;overflow:auto;font-size:12px;padding:6px 10px;border-top:1px solid #ddd;background:#fafafa}

function holders(name, except) {           // every aircraft that has (or is being given) this base name
  const b = base(name), out = [];
  PLANES.forEach(p => { if (p.aid !== except && p.name && base(p.name) === b) out.push({p, how: 'already named ' + p.name}); });
  Object.entries(st).forEach(([aid, d]) => { if (aid !== except && base(d.name) === b) out.push({p: BYAID[aid], how: 'assigned here'}); });
  return out;
}
let st = {};                       // aid -> {name, url, page, note, at}
try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
let cur = null;                    // selected concept
let mode = 'company', q = '', hideNamed = true, hideNone = false;

function concepts() {
  const s = document.getElementById('csearch').value.toLowerCase(), v = document.getElementById('cview').value;
  const used = new Set(Object.values(st).map(d => d.url));
  return CONCEPTS.filter(c => (v === 'all' || (v === 'open' && c.open > 0) || (v === 'used' && used.has(c.url)))
    && (!s || (c.title + ' ' + c.type).toLowerCase().includes(s)));
}
function renderConcepts() {
  const used = {};
  Object.values(st).forEach(d => used[d.url] = (used[d.url] || 0) + 1);
  const L = concepts();
  document.getElementById('clist').innerHTML = L.slice(0, 600).map(c => `
    <div class="c ${cur && cur.i === c.i ? 'on' : ''}" data-i="${c.i}">
      <div class="t">${esc(c.title)}${c.open ? `<span class="pill g">${c.open} unnamed</span>` : ''}${used[c.url] ? `<span class="pill b">${used[c.url]} assigned</span>` : ''}</div>
      <div class="s">${esc(c.type)}${c.archs.length ? ' · ' + c.archs.join('/') : ''}</div></div>`).join('')
    + (L.length > 600 ? `<div class="c s">… ${L.length - 600} more — search to narrow</div>` : '');
  const D = Object.entries(st);
  document.getElementById('done').innerHTML = D.length ? '<b>Assigned here (' + D.length + ')</b>' + D.map(([aid, d]) =>
    `<div><span>${esc(aid)} → <b>${esc(d.name)}</b></span><a data-del="${esc(aid)}">remove</a></div>`).join('') : '';
  renderRepeats();
  document.getElementById('count').textContent =
    `${D.length} assigned on this page · ${PLANES.filter(p => !p.name).length} of ${PLANES.length} aircraft still unnamed`;
}

function renderBar() {
  const b = document.getElementById('bar');
  if (!cur) { b.innerHTML = '<i>← pick a directory aircraft</i>'; return; }
  b.innerHTML = `
    <span class="title">${esc(cur.title)}</span>
    <a href="${esc(cur.url)}" target="evtolnews">open on evtol.news ↗</a>
    <span>${esc(cur.type)}${cur.archs.length ? ' · looks like <b>' + cur.archs.join('/') + '</b>' : ''}</span>
    <label>name <input type="text" id="cname" value="${esc(cur.name)}" size="18"></label>
    <label>note <input type="text" id="cnote" placeholder="optional" size="22"></label>
    <span>show
      <select id="mode">
        <option value="company" ${mode === 'company' ? 'selected' : ''}>same company (${cur.aids.length})</option>
        <option value="arch" ${mode === 'arch' ? 'selected' : ''}>same architecture</option>
        <option value="all" ${mode === 'all' ? 'selected' : ''}>all aircraft</option>
      </select></span>
    <input type="text" id="q" placeholder="filter: company, patent, year…" value="${esc(q)}" size="22">
    <label><input type="checkbox" id="hidenamed" ${hideNamed ? 'checked' : ''}> hide already named (🔒 they are never renamed)</label>
    <label><input type="checkbox" id="hidenone" ${hideNone ? 'checked' : ''}> hide “none” from the list page</label>`;
}

function planes() {
  if (!cur) return [];
  let L = mode === 'company' ? cur.aids.map(a => BYAID[a]) : mode === 'arch' ? PLANES.filter(p => cur.archs.includes(p.arch)) : PLANES;
  const s = q.toLowerCase();
  return L.filter(p => (!hideNamed || !p.name || st[p.aid]) && (!hideNone || !p.none)
      && (!s || (p.asg + ' ' + p.pid + ' ' + p.year + ' ' + p.arch + ' ' + p.name).toLowerCase().includes(s)))
    .sort((a, b) => (a.year || '').localeCompare(b.year || '') || a.aid.localeCompare(b.aid));
}
function renderGrid() {
  const L = planes();
  document.getElementById('grid').innerHTML = L.length ? L.map(p => {
    const d = st[p.aid];
    const tag = d ? `<span class="tag mine">→ ${esc(d.name)}</span>` : p.name ? `<span class="tag">🔒 ${esc(p.name)}</span>`
      : p.none ? '<span class="tag none">said none</span>' : '';
    return `<div class="p ${d ? 'mine' : ''} ${p.name && !d ? 'named' : ''} ${p.none ? 'none' : ''}" data-aid="${p.aid}">
      ${tag}<button class="zoom" title="all figures">🔍 ${p.figs.length}</button>
      ${p.figs.length ? `<img loading="lazy" src="${esc(p.figs[0])}">` : '<div style="height:170px">no figure</div>'}
      <div class="m"><b>${esc(p.pid)}${p.letter ? ' ' + p.letter : ''}</b> · ${esc(p.year)} · <b>${esc(p.arch)}</b>${p.copies ? ` · +${p.copies} copies` : ''}<br>
      ${esc(p.asg.slice(0, 40))}</div></div>`;
  }).join('') : '<p>No aircraft in this view — try “same architecture” or “all aircraft”.</p>';
}
function card(p, how, isNew) {
  return `<div class="w ${isNew ? 'new' : ''}">${p.figs.length ? `<img src="${esc(p.figs[0])}">` : ''}
    <b>${esc(p.pid)}${p.letter ? ' ' + p.letter : ''}</b> · ${esc(p.year)} · ${esc(p.arch)}<br>${esc(p.asg.slice(0, 30))}<br><i>${esc(how)}</i></div>`;
}
function showWarn(p, name, h) {
  const w = document.getElementById('warn');
  w.innerHTML = `⚠ <b>“${esc(name)}” is now on ${h.length + 1} aircraft.</b>
    If two drawings are the SAME aircraft → flag the later patent as a duplicate (D1/D2) in the wizard.
    If they are different versions → keep both: they become ${esc(name)} v1, v2… by priority date.
    <button id="warnok">OK, keep</button><button id="warnundo">undo this one</button>
    <div class="row">${card(p, 'just assigned', true)}${h.map(x => card(x.p, x.how)).join('')}</div>`;
  w.style.display = 'block';
  w.dataset.aid = p.aid;
}
function hideWarn() { document.getElementById('warn').style.display = 'none'; }
document.getElementById('warn').addEventListener('click', e => {
  if (e.target.id === 'warnok') hideWarn();
  if (e.target.id === 'warnundo') { delete st[e.currentTarget.dataset.aid]; save(); hideWarn(); renderConcepts(); renderGrid(); }
});
function renderRepeats() {
  const groups = {};
  Object.entries(st).forEach(([aid, d]) => (groups[base(d.name)] = groups[base(d.name)] || []).push(aid));
  const rows = Object.entries(groups).map(([b, aids]) => {
    const others = PLANES.filter(p => p.name && base(p.name) === b && !aids.includes(p.aid));
    const n = aids.length + others.length;
    return n > 1 ? `<div><b>${esc(st[aids[0]].name)}</b> on ${n} aircraft: ${aids.map(esc).join(', ')}${others.length ? ' + already named ' + others.map(p => esc(p.pid)).join(', ') : ''}</div>` : '';
  }).join('');
  document.getElementById('rep').innerHTML = rows ? '<b>⚠ Names on more than one aircraft — same aircraft? flag duplicates</b>' + rows : '';
  document.getElementById('rep').style.display = rows ? 'block' : 'none';
}
function renderAll() { renderConcepts(); renderBar(); renderGrid(); }

document.getElementById('clist').addEventListener('click', e => {
  const c = e.target.closest('.c[data-i]'); if (!c) return;
  cur = CONCEPTS.find(x => x.i === +c.dataset.i);
  mode = cur.aids.length ? 'company' : 'arch'; q = '';
  window.open(cur.url, 'evtolnews');
  renderAll();
});
document.getElementById('done').addEventListener('click', e => {
  if (e.target.dataset.del) { delete st[e.target.dataset.del]; save(); renderAll(); }
});
document.getElementById('bar').addEventListener('input', e => {
  if (e.target.id === 'q') { q = e.target.value; renderGrid(); }
  if (e.target.id === 'cname') cur.name = e.target.value;
});
document.getElementById('bar').addEventListener('change', e => {
  if (e.target.id === 'mode') { mode = e.target.value; renderGrid(); }
  if (e.target.id === 'hidenamed') { hideNamed = e.target.checked; renderGrid(); }
  if (e.target.id === 'hidenone') { hideNone = e.target.checked; renderGrid(); }
});
document.getElementById('grid').addEventListener('click', e => {
  const el = e.target.closest('.p'); if (!el) return;
  const p = BYAID[el.dataset.aid];
  if (e.target.closest('.zoom')) {
    const z = document.getElementById('zoom');
    z.querySelector('.cap').textContent = `${p.pid}${p.letter ? ' aircraft ' + p.letter : ''} · ${p.asg} · ${p.year} · ${p.arch} — ${p.title}  (click to close)`;
    z.querySelector('.imgs').innerHTML = p.figs.map(f => `<img src="${esc(f)}">`).join('');
    z.style.display = 'flex'; return;
  }
  if (p.name && !st[p.aid]) return;          // already named: never renamed here
  if (st[p.aid]) { delete st[p.aid]; hideWarn(); }
  else {
    const name = (document.getElementById('cname').value || '').trim();
    if (!name) { alert('Type a name first'); return; }
    st[p.aid] = {name, url: cur.url, page: cur.title, note: (document.getElementById('cnote').value || '').trim(), at: now()};
    const h = holders(name, p.aid);
    if (h.length) showWarn(p, name, h); else hideWarn();
  }
  save(); renderConcepts(); renderGrid();
});
document.getElementById('zoom').onclick = e => e.currentTarget.style.display = 'none';
document.getElementById('csearch').oninput = renderConcepts;
document.getElementById('cview').onchange = renderConcepts;
document.getElementById('export').onclick = () => {
  const qq = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const head = ['patent_id', 'aircraft', 'aircraft_id', 'action', 'name', 'url', 'page_title', 'note', 'decided_at'];
  const rows = Object.entries(st).map(([aid, d]) => {
    const p = BYAID[aid];
    return [p.pid, p.letter, aid, 'assign', d.name, d.url, d.page, 'concept board' + (d.note ? ': ' + d.note : ''), d.at].map(qq).join(',');
  });
  const blob = new Blob([head.map(qq).join(',') + '\n' + rows.join('\n') + '\n'], {type: 'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'NAME_EVTOLNEWS.csv'; a.click();
};
renderAll();
</script></body></html>
