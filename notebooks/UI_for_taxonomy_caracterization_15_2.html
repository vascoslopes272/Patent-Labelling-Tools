  // Prefer the calibrated viewer area; otherwise sit beside the wizard, using
  // THIS window's actual location/size (not window.screen, which on multi-
  // monitor Linux often reports the whole virtual desktop).
  var geo = getViewerGeo(), left, top, w, h;
  if (geo) {
    left = geo.left; top = geo.top; w = geo.width; h = geo.height;
  } else {
    left = (window.screenX || window.screenLeft || 0) + (window.outerWidth || 800);
    top  = window.screenY || window.screenTop || 0;
    w = window.outerWidth || 800;
    h = window.outerHeight || window.screen.availHeight;
  }
  // Offset the PDF window so it isn't dropped exactly on top of the EPO one.
  if (slot === 'pdf') { left += 48; top += 48; }
  win = window.open(url, PATENT_WINDOW_NAMES[slot],
    'left=' + left + ',top=' + top + ',width=' + w + ',height=' + h);
  // Some Linux WMs ignore the features string but honor an explicit
  // moveTo/resizeTo once the window exists.
  if (win) {
    try { win.moveTo(left, top); win.resizeTo(w, h); } catch (e) {}
  }
  patentWindows[slot] = win;
}

// Header "Set viewer area" → open a SAME-ORIGIN placeholder window we can read
// the geometry of (cross-origin patent windows hide theirs). You drag/size it to
// the exact spot on display 2 where you want the EPO record and the PDF, press
// the button inside, and that geometry is remembered for every viewer window
// from then on — re-runnable on ANY patent, not just the first.
function calibrateViewerArea() {
  var sx = (window.screenX || window.screenLeft || 0) + (window.outerWidth || 800);
  var sy = window.screenY || window.screenTop || 0;
  var ph = window.open('', 'evtolViewerCalibrator',
    'left=' + sx + ',top=' + sy + ',width=760,height=820');
  if (!ph) { alert('Allow pop-ups for this page, then click "Set viewer area" again.'); return; }
  ph.document.write(
    '<!doctype html><html><head><meta charset="utf-8"><title>Set patent-viewer area</title></head>' +
    '<body style="margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;' +
    'justify-content:center;gap:18px;padding:28px;box-sizing:border-box;text-align:center;' +
    'font-family:system-ui,sans-serif;background:#10243e;color:#fff;">' +
    '<h2 style="margin:0;font-size:19px;">Drag &amp; resize THIS window</h2>' +
    '<p style="max-width:440px;line-height:1.5;opacity:.85;margin:0;">Move it to exactly where you want ' +
    'the EPO record and the source PDF to open on display 2, at the size you want — then press the button.</p>' +
    '<button id="useit" style="font-size:15px;padding:11px 24px;border:0;border-radius:9px;' +
    'background:#2f80ed;color:#fff;cursor:pointer;font-weight:600;">Use this spot</button>' +
    '<p id="msg" style="opacity:.6;font-size:13px;margin:0;"></p></body></html>');
  ph.document.close();
  var btn = ph.document.getElementById('useit');
  if (btn) btn.addEventListener('click', function() {
    var geo = { left: ph.screenX, top: ph.screenY, width: ph.outerWidth, height: ph.outerHeight };
    try { localStorage.setItem(VIEWER_GEO_KEY, JSON.stringify(geo)); } catch (e) {}
    try { ph.document.getElementById('msg').textContent = 'Saved ✓ you can close this.'; } catch (e) {}
    setTimeout(function(){ try { ph.close(); } catch (e) {} }, 400);
  });
}

function realFigImage(fNum) {
  return FIG_ATTACHED_URL[fNum] || pathToFileURL(FIG_IMAGE_PATH[fNum]);
}

// Reviewed rows accumulated across the whole batch, in the same flat
// Patent_ID/Section/Sub_Dimension/Field/.../Image_Path schema as
// src/excel_schema.py's COLUMNS — written out as one xlsx per batch via
// exportReviewedBatch() instead of one JSON download per patent.
var REVIEWED_ROWS = [];
// Definition/Options/Confidence dropped from the wizard's OWN export — they
// were always blank/null here (the only real values for those columns live
// in the upstream ml_predict_labels_<batch>.xlsx, written by the Python
// pipeline's excel_schema.py, which this file is NOT). Confirmed nothing
// downstream reads them back: the only Python consumer of a reviewed file
// (01_review.ipynb's "Copy approved files" cell) looks up columns by name
// (Section/Field/Value/Patent_ID) and never touches these three.
var EXCEL_COLUMNS = ["Patent_ID","Section","Sub_Dimension","Field","Value","Source","Image_Path"];

// Make coded taxonomy values ("CVT", "LE", "1"...) readable in the exported
// Excel WITHOUT losing the machine-readable code: write "<id> — <name>" and,
// on re-load, strip everything from " — " onward to recover the bare id.
// stripLabel() is a no-op for plain ids/free text that never contained
// " — " in the first place, so older reviewed_patents_*.xlsx files (written
// before this change) keep loading exactly as before.
function withLabel(rawId, optsArray) {
  if (rawId == null || rawId === '' || !optsArray) return rawId;
  var o = optsArray.find(function(x){ return x.id === rawId; });
  if (!o) return rawId;
  return rawId + ' — ' + (o.n || o.name);
}
function stripLabel(v) {
  if (typeof v !== 'string') return v;
  var i = v.indexOf(' — ');
  return i > -1 ? v.slice(0, i).trim() : v;
}

function reviewRow(pid, section, subDim, field, value, confidence, source, imagePath) {
  return {
    Patent_ID: pid, Section: section, Sub_Dimension: subDim, Field: field,
    Value: value != null ? value : null,
    Source: source != null ? source : null,
    Image_Path: imagePath != null ? imagePath : null,
  };
}

// Inverse of build_patent_rows() (src/excel_schema.py) — flattens one
// buildExport() record (the human-reviewed wizard state) back into rows of
// that same schema, so the per-batch reviewed xlsx can be reloaded into this
// wizard's batch loader just like ml_predict_labels_<batch>.xlsx can.
function recordToRows(record, pid) {
  var rows = [];

  // Codebook version (rule 3) — present on every exported record, including a
  // disapproved patent's truncated row set (see the early returns below).
  rows.push(reviewRow(pid, "META", "Review Metadata", "codebook_version", record.codebook_version || CODEBOOK_VERSION));

  // ── T1 ── title/abstract/description_of_drawings come from T1_META since
  // buildExport() doesn't carry them (they're not editable in the wizard).
  // Disapproved patents were never actually reviewed by the human past the
  // triage step, so only the disapproval verdict + reason are worth keeping —
  // everything else below would just be unreviewed ML/placeholder noise.
  rows.push(reviewRow(pid, "T1", "T1 — Approval Status", "isApproved", record.isApproved));
  if (record.isApproved === false) {
    rows.push(reviewRow(pid, "T1", "T1 — Disapproval Reason", "t1DisapproveReason", withLabel(record.disapproveReason, T1_DISAPPROVE_REASONS)));
    if (record.disapproveReason === 'Other') {
      // Categorical "Other" pattern (rule 2): sibling field named {field}_otherNote.
      // Renamed from the legacy "disapproveOther" — rowsToAIData() still accepts
      // the old name on import.
      rows.push(reviewRow(pid, "META", "Review Metadata", "t1DisapproveReason_otherNote", record.disapproveOther));
    }
  } else {
    rows.push(reviewRow(pid, "T1", "Patent Title", "title", T1_META.title));
    rows.push(reviewRow(pid, "T1", "Aircraft / Prototype Name", "aircraftName", record.aircraftName));
    rows.push(reviewRow(pid, "T1", "Abstract", "abstract", T1_META.abstract));
    rows.push(reviewRow(pid, "T1", "Assignee", "assignee", record.assignee));
    rows.push(reviewRow(pid, "T1", "Publication Year", "pub_year", record.pubYear));
    rows.push(reviewRow(pid, "T1", "Application Year", "app_year", record.appYear));
    rows.push(reviewRow(pid, "T1", "Description of Drawings", "description_of_drawings", T1_META.descriptionOfDrawings));
    if (T1_META.pdfLinkRaw) rows.push(reviewRow(pid, "T1", "PDF Link", "pdf_link", T1_META.pdfLinkRaw, null, "patseer"));
    rows.push(reviewRow(pid, "T1", "scope", "scope", record.scope));
    rows.push(reviewRow(pid, "T1", "t1Field", "t1Field", record.techField));
    rows.push(reviewRow(pid, "T1", "t1Target", "t1Target", record.innovTarget));
    rows.push(reviewRow(pid, "T1", "T1 — Distinct Architectures", "archCount", record.archCount));
    rows.push(reviewRow(pid, "T1", "T1 — Duplicate Flag", "isDuplicate", record.isDuplicate));
    rows.push(reviewRow(pid, "T1", "T1 — Duplicate Of (Patent ID)", "duplicateId", record.duplicateOf));
    // Extra fields buildExport() carries with no build_patent_rows() slot —
    // harmless additions, ignored by rowsToAIData() on reload.
    rows.push(reviewRow(pid, "META", "Review Metadata", "familyId", record.familyId));
    rows.push(reviewRow(pid, "META", "Review Metadata", "duplicateType", withLabel(record.duplicateType, DUP_TYPES)));
    rows.push(reviewRow(pid, "META", "Review Metadata", "mainFigure", record.mainFigure));
    rows.push(reviewRow(pid, "META", "Review Metadata", "comments", record.comments));
    // T1 edge-case toggle tags — one META row, ids joined with "|" (read back in loadBatchPatent).
    rows.push(reviewRow(pid, "META", "Review Metadata", "t1EdgeTags", (record.t1EdgeTags && record.t1EdgeTags.length) ? record.t1EdgeTags.join("|") : null));
    rows.push(reviewRow(pid, "META", "Review Metadata", "imgNotReflect", record.imgNotReflect));
    // imgApparentArch row retired v15.3 along with APPARENT_ARCH — see that
    // array's comment. This is the ONLY column that disappears from the export.
    rows.push(reviewRow(pid, "META", "Review Metadata", "patentImageComments", record.patentImageComments));
    // Quick Count Override (v13, rule 4e) — T1 is patent-level, not per-architecture.
    rows.push(reviewRow(pid, "META", "Review Metadata", "t1_quickOverride", !!record.t1_quickOverride));
    rows.push(reviewRow(pid, "META", "Review Metadata", "t1_quickNote", record.t1_quickNote || null));
    // Human-uncertainty flag (v13) — T1 is patent-level.
    rows.push(reviewRow(pid, "META", "Review Metadata", "t1_humanUncertain", !!record.t1_humanUncertain));
    rows.push(reviewRow(pid, "META", "Review Metadata", "t1_uncertainNote", record.t1_uncertainNote || null));
    rows.push(reviewRow(pid, "META", "Review Metadata", "labelToken", record.labelToken));
  }
  rows.push(reviewRow(pid, "META", "Review Metadata", "timestamp", record.timestamp));

  // Disapproved patent: STOP here. Per the rule "when I disapprove a patent,
  // only the reason appears", we emit nothing else — no T2 image classification,
  // no G1/M1/M2/M3 morphology (none of it was human-reviewed for a rejected
  // patent; it would just be unreviewed ML noise). Patent_ID is already on every
  // row above, so the rejected patent stays identifiable. (All rows emitted so
  // far — isApproved/reason/timestamp — are non-empty, so skipping the trailing
  // empty-trim below is harmless.)
  if (record.isApproved === false) return rows;

  // Exact Duplicate (type '2'): the patent is a literal copy of another patent —
  // all taxonomy labels are identical to the original. The isDuplicate/duplicateId/
  // duplicateType rows above already record the reference. No G1/M1/M2/M3 rows are
  // emitted; the pipeline resolves the full labels by looking up the original patent.
  if (record.isDuplicate && record.duplicateType === '2') return rows;

  // ── T2 — per-figure rows, keyed back to filenames via FIG_FILENAMES ──────
  var fNums = Object.keys(record.figures || {});
  if (!fNums.length) {
    rows.push(reviewRow(pid, "T2", "Image: (none available)", "match_status", null));
  }
  fNums.forEach(function(fNum) {
    var fd      = record.figures[fNum] || {};
    var fname   = FIG_FILENAMES[fNum] || "";
    var imgPath = FIG_IMAGE_PATH[fNum] || null;
    var subDim  = fname ? ("Image: " + fname) : ("Image: (fig " + fNum + ")");
    // figKey carries the TRUE fig number explicitly, independent of the
    // filename. figNumFromFilename() only recovers fNum correctly when the
    // filename follows the pipeline's own "_F<N>"/"_Fu<N>" convention — an
    // arbitrarily-named manually-attached image (see the "📎 Attach Image"
    // button) falls through to using the whole filename as a fake fNum,
    // silently forking the figure into a new orphan entry on reload instead
    // of staying "FIG. <fNum>". Reading figKey back (rowsToAIData) takes
    // priority over the filename guess, so this can never happen again.
    rows.push(reviewRow(pid, "T2", subDim, "figKey", fNum, null, "human", imgPath));
    // Discarded (disapproved) image: per the rule "a disapproved image only says
    // it's disapproved", we emit ONLY the status row — no architecture tag, no
    // duplicate-of info, and certainly no ML classification fields. The Image_Path
    // still rides on this row so the figure stays anchored to its file.
    if (fd.status === 'disapproved') {
      rows.push(reviewRow(pid, "T2", subDim, "status", "disapproved", null, "human", imgPath));
      return;
    }
    ["per","acSty","acCol","bgSty","bgCol"].forEach(function(f) {
      rows.push(reviewRow(pid, "T2", subDim, f, fd[f] != null ? fd[f] : null, null, "human", imgPath));
    });
    // v15.2: categorical "Other" pattern — sibling free-text note, only
    // meaningful (and only required) when the paired field is "Other", but
    // always exported like stateNote if present.
    ["acStyOtherNote","acColOtherNote","bgStyOtherNote","bgColOtherNote"].forEach(function(f) {
      rows.push(reviewRow(pid, "T2", subDim, f, fd[f] != null ? fd[f] : null, null, "human", imgPath));
    });
    rows.push(reviewRow(pid, "T2", subDim, "parts", Array.isArray(fd.parts) ? fd.parts.join("|") : (fd.parts || null), null, "human", imgPath));
    rows.push(reviewRow(pid, "T2", subDim, "status", fd.status != null ? fd.status : null, null, "human", imgPath));
    rows.push(reviewRow(pid, "T2", subDim, "rotation_deg", fd.rotation_deg != null ? fd.rotation_deg : null, null, "human", imgPath));
    // Duplicate reference on ONE row: "<patent> FIG. <fig>" (e.g.
    // "US2024051687A1 FIG. 1a"), instead of separate dupOfPatent/dupOfFig rows
    // stacked on two lines. rowsToAIData() splits it back into dupOfPatent +
    // dupOfFig on reload, and still accepts the old two-field form (ML files /
    // older reviewed exports). Handles all cases: patent-only, fig-only (same
    // patent), or both.
    // Only RECORD an image duplicate once the reviewer committed it via a Copy
    // (dupConfirmed is set true only when labels were actually copied from the
    // source figure). A figure flagged but never copied exports as NOT a duplicate.
    var _dp = fd.dupConfirmed ? (fd.dupOfPatent || '').trim() : '';
    var _df = fd.dupConfirmed ? (fd.dupOfFig || '').trim() : '';
    var _dupOf = _df ? ((_dp ? _dp + ' ' : '') + 'FIG. ' + _df) : _dp;
    rows.push(reviewRow(pid, "T2", subDim, "dupOf", _dupOf || null, null, "human", imgPath));
    // Persistence fix (C1-C5): these per-figure human labels used to be captured
    // in buildExport() but never serialised here, so they were silently lost on
    // save. edgeTags is an array → joined with "|" like parts (split back on load).
    // qualityFlag's "Clean" default is now resolved once in buildExport()'s
    // figures reduce, so fd.qualityFlag is always populated here already.
    rows.push(reviewRow(pid, "T2", subDim, "qualityFlag", withLabel(fd.qualityFlag != null ? fd.qualityFlag : null, QUALITY_FLAGS), null, "human", imgPath));
    rows.push(reviewRow(pid, "T2", subDim, "hasLegends", fd.hasLegends != null ? fd.hasLegends : null, null, "human", imgPath));
    rows.push(reviewRow(pid, "T2", subDim, "comment", fd.comment != null ? fd.comment : null, null, "human", imgPath));
    rows.push(reviewRow(pid, "T2", subDim, "edgeTags", Array.isArray(fd.edgeTags) ? fd.edgeTags.join("|") : (fd.edgeTags || null), null, "human", imgPath));
    // arch's "1" default is now resolved once in buildExport()'s figures
    // reduce (same fix as qualityFlag above), so fd.arch is always populated.
    rows.push(reviewRow(pid, "T2", subDim, "arch", fd.arch != null ? fd.arch : null, null, "human", imgPath));
    // Per-architecture main-figure flag (replaces the single patent-level mainFigure).
    rows.push(reviewRow(pid, "T2", subDim, "isMain", fd.isMain != null ? fd.isMain : null, null, "human", imgPath));
    // partsMulti: persists whether the reviewer opted this figure into multi-select
    // so the single-select collapse-on-load (ingestAI) doesn't undo a deliberate >1 pick.
    rows.push(reviewRow(pid, "T2", subDim, "partsMulti", fd.partsMulti != null ? fd.partsMulti : null, null, "human", imgPath));
    // Per-figure aircraft state in this view (config + free note). tiltedInView
    // retired v14 (C1) — no longer exported; see the AC_STATE array comment.
    rows.push(reviewRow(pid, "T2", subDim, "acState", withLabel(fd.acState != null ? fd.acState : null, AC_STATE), null, "human", imgPath));
    rows.push(reviewRow(pid, "T2", subDim, "stateNote", fd.stateNote != null ? fd.stateNote : null, null, "human", imgPath));
  });

  // ── G1/M1/M2/M3 — emitted once PER ARCHITECTURE ─────────────────────────
  // Multi-architecture patents carry several morphologies. Each is keyed with a
  // "_arch{N}" suffix on the Patent_ID so (Patent_ID, Field) stays unique; a
  // single-architecture patent keeps the BARE Patent_ID (no suffix), exactly as
  // before — so existing exports/downstream tools are unchanged for that case.
  var archs = record.architectures && record.architectures.length ? record.architectures : [record];
  archs.forEach(function(m, ai) {
    var apid = archs.length > 1 ? (pid + "_arch" + (ai + 1)) : pid;

    // ── G1 ──
    rows.push(reviewRow(apid, "G1", "Topology Type", "topType", withLabel(m.topologyClass, TOP)));
    rows.push(reviewRow(apid, "G1", "Architecture Purity", "notPureArch", !!m.notPureArch));
    // Quick Count Override (v13, rule 4e).
    rows.push(reviewRow(apid, "G1", "G1 — Quick Override", "g1_quickOverride", !!m.g1_quickOverride));
    rows.push(reviewRow(apid, "G1", "G1 — Quick Note", "g1_quickNote", m.g1_quickNote || null));
    // Human-uncertainty flag (v13).
    rows.push(reviewRow(apid, "G1", "G1 — Uncertain", "g1_humanUncertain", !!m.g1_humanUncertain));
    rows.push(reviewRow(apid, "G1", "G1 — Uncertain Why", "g1_uncertainNote", m.g1_uncertainNote || null));

    // ── M1 ──
    rows.push(reviewRow(apid, "M1", "fusShape", "fusShape", withLabel(m.fusShape, FUS_SHAPE)));
    // Shared categorical-"Other" note (v15.3) — free text, so no withLabel and
    // no stripLabel on the way back in (a note can contain " — " legitimately).
    rows.push(reviewRow(apid, "M1", "fusShape", "fusShapeOtherNote", m.fusShapeOtherNote || null));
    rows.push(reviewRow(apid, "M1", "fusKin", "fusKin", withLabel(m.fusKin, FUS_KIN)));
    rows.push(reviewRow(apid, "M1", "gearArch", "gearArch", withLabel(m.gearArch, GEAR_ARCH)));
    rows.push(reviewRow(apid, "M1", "latSym", "latSym", m.latSym));
    rows.push(reviewRow(apid, "M1", "M1 — Footprint Length (m)", "footLen", m.footLen));
    rows.push(reviewRow(apid, "M1", "M1 — Footprint Width (m)", "footWid", m.footWid));
    rows.push(reviewRow(apid, "M1", "M1 — Footprint Height (m)", "footHgt", m.footHgt));
    rows.push(reviewRow(apid, "M1", "M1 — Footprint Ambiguous", "footAmbiguous", m.footAmbiguous));
    // v15.3: the longSym row is removed — the field was dropped from the M1
    // interface in v13, so the export claimed a value the labeller can no longer
    // set. The state key + its ingest read path stay (old files still load).
    // Every OTHER symmetry field is untouched: the whole-airframe latSym above,
    // the per-boom-group sym/circSym, and the per-propulsor sym/symLong/symCirc
    // are separate live fields, not duplicates of this one.
    // Quick Count Override (v13, rule 4e).
    rows.push(reviewRow(apid, "M1", "M1 — Quick Override", "m1_quickOverride", !!m.m1_quickOverride));
    rows.push(reviewRow(apid, "M1", "M1 — Quick Note", "m1_quickNote", m.m1_quickNote || null));
    // Human-uncertainty flag (v13).
    rows.push(reviewRow(apid, "M1", "M1 — Uncertain", "m1_humanUncertain", !!m.m1_humanUncertain));
    rows.push(reviewRow(apid, "M1", "M1 — Uncertain Why", "m1_uncertainNote", m.m1_uncertainNote || null));
    rows.push(reviewRow(apid, "M1", "wingNotes", "wingNotes", m.wingNotes));
    rows.push(reviewRow(apid, "M1", "empNotes", "empNotes", m.empNotes));
    rows.push(reviewRow(apid, "M1", "fusNotes", "fusNotes", m.fusNotes));
    rows.push(reviewRow(apid, "M1", "gearNotes", "gearNotes", m.gearNotes));
    // Structural booms / outriggers — one set of rows per boom group, plus the
    // present gate. Geometry (attach/spanwise/longitudinal/orientation/count/
    // symmetric) and the propulsor link (cards, pipe-joined m3 component keys)
    // live on the group. See m1BoomsCard() + buildMorphologyObj().
    rows.push(reviewRow(apid, "M1", "M1 — Booms Present", "boomsPresent", m.boomsPresent));
    var _boomNT = (function(){ var bc = (m.propulsionCards||[]).filter(function(c){ return c.component==='boom'; })[0]; return bc ? (parseInt(bc.ntypes,10)||1) : 1; })();
    (m.boomsPresent ? (m.boomGroups || []) : []).forEach(function(g, gi) {
      var gn = gi + 1;
      var sub = (_boomNT > 1 && gn <= _boomNT) ? "Boom Group " + gn + " → M3 Type " + gn : "Boom Group " + gn;
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_attach", withLabel(g.attach, BOOM_ATTACH)));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_wingSpan", withLabel(g.wingSpan, BOOM_WING_SPAN)));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_span",   withLabel(g.span,   BOOM_POS_SPAN)));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_long",   withLabel(g.long,   BOOM_POS_LONG)));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_orient", withLabel(g.orient, BOOM_ORIENT)));
      // Shared categorical-"Other" notes (v15.3) — free text, no withLabel.
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_attachOth", isOtherVal(g.attach) ? (g.attachOth || null) : null));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_spanOth",   isOtherVal(g.span)   ? (g.spanOth   || null) : null));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_longOth",   isOtherVal(g.long)   ? (g.longOth   || null) : null));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_orientOth", isOtherVal(g.orient) ? (g.orientOth || null) : null));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_count",    g.count != null ? g.count : null));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_sym",      !!g.symmetric));
        rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_circSym", !!g.circSymmetric));

      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_hasProps", g.hasProps != null ? !!g.hasProps : null));
      rows.push(reviewRow(apid, "M1", sub, "boom" + gn + "_cards",    (g.cards && g.cards.length) ? g.cards.join("|") : null));
    });
    // Section-level boom edge-case notes (one per architecture, not per group).
    if (m.boomsPresent && m.boomNotes) rows.push(reviewRow(apid, "M1", "Booms — Notes", "boomNotes", m.boomNotes));
    // boomXFormat retired v14 (C5) — no longer exported; see BOOM_ORIENT='X'.
    // Reviewer's projection of how usable THIS ARCHITECTURE's figures will be
    // as DINOv2 shape cues — one value per architecture, not per image/patent.
    rows.push(reviewRow(apid, "M1", "dinoUnderstanding", "dinoUnderstanding", withLabel(m.dinoUnderstanding, DINO_UNDERSTANDING)));

    // ── M2 — wingConf/wCount/empType/empKin + per-wing rows ──
    // Quick Count Override (v13, rule 4e).
    rows.push(reviewRow(apid, "M2", "M2 — Quick Override", "m2_quickOverride", !!m.m2_quickOverride));
    rows.push(reviewRow(apid, "M2", "M2 — Quick Note", "m2_quickNote", m.m2_quickNote || null));
    // Human-uncertainty flag (v13).
    rows.push(reviewRow(apid, "M2", "M2 — Uncertain", "m2_humanUncertain", !!m.m2_humanUncertain));
    rows.push(reviewRow(apid, "M2", "M2 — Uncertain Why", "m2_uncertainNote", m.m2_uncertainNote || null));
    rows.push(reviewRow(apid, "M2", "wingConf", "wingConf", withLabel(m.wingConf, WING_CONFIG)));
    rows.push(reviewRow(apid, "M2", "wingConf", "wingConfOtherNote", m.wingConfOtherNote || null));
    rows.push(reviewRow(apid, "M2", "wCount", "wCount", m.wCount));
    rows.push(reviewRow(apid, "M2", "empType", "empType", withLabel(m.empType, EMP_TYPE)));
    rows.push(reviewRow(apid, "M2", "empType", "empTypeOtherNote", m.empTypeOtherNote || null));
    // v14 (C4): empKin retired — no legacy EMP_KIN column in new exports.
    // empTilts is a plain boolean + its mandatory-when-ticked note.
    rows.push(reviewRow(apid, "M2", "empTilts", "empTilts", !!m.empTilts));
    rows.push(reviewRow(apid, "M2", "empTilts", "empTiltsNote", m.empTilts ? (m.empTiltsNote || null) : null));
    (m.wings || []).forEach(function(w, i) {
      var wi = i + 1;
      [["tilt","Tilt",W_TILT],["posV","Vertical Position",W_POS_V],["posL","Longitudinal Position",W_POS_L],
       ["plan","Planform",W_PLAN],["role","Role",W_ROLE]].forEach(function(pair) {
        var field = pair[0], label = pair[1], opts = pair[2];
        rows.push(reviewRow(apid, "M2", "Wing " + wi + " — " + label, "wing" + wi + "_" + field, withLabel(w[field] != null ? w[field] : null, opts)));
      });
      // Categorical "Other" pattern: plan keeps the option id ('Oth' included);
      // the free text rides in this sibling field, never substituted into plan.
      rows.push(reviewRow(apid, "M2", "Wing " + wi + " — Planform Other Detail", "wing" + wi + "_plan_otherNote", w.planOtherNote || null));
      // Same pattern for Wing Role's 'Other' (v15.3, see otherNoteInput()).
      rows.push(reviewRow(apid, "M2", "Wing " + wi + " — Role Other Detail", "wing" + wi + "_role_otherNote", w.roleOtherNote || null));
    });

    // ── M3 — one set of rows per propulsion-card component ──
    // Human-uncertainty flag (v13) — section-level, not tied to any one card.
    rows.push(reviewRow(apid, "M3", "M3 — Uncertain", "m3_humanUncertain", !!m.m3_humanUncertain));
    rows.push(reviewRow(apid, "M3", "M3 — Uncertain Why", "m3_uncertainNote", m.m3_uncertainNote || null));
    (m.propulsionCards || []).forEach(function(card) {
      var subDim = "Propulsion: " + card.component;
      // "zone" options depend on WHICH card this is (m3ZoneOptions(bp)), so look
      // up its blueprint once; the rest are static option sets shared by every
      // card. "orient" is deliberately left unlabelled — Horizontal/Vertical/
      // Mixed are already plain English, unlike the short codes (LE, CVT, Cent...)
      // everything else here uses.
      var _bp = m3Blueprints().find(function(b){ return b.key === card.component; });
      var M3_FIELD_OPTS = {
        zone: _bp ? m3ZoneOptions(_bp) : null, zoneChord: m3ZoneChordOptions(), zoneSpan: m3ZoneSpanOptions(),
        chord: CHORD, bmech: BLADE_MECH, rmech: RETRACT_MECH, propKin: PROP_KIN,
      };
      // Persistence fix (C6/C7): propKin + sym were captured by buildMorphologyObj()
      // but omitted from this emit list, so they were lost on save (propKin only
      // re-derivable for TP via the physics lock; sym not at all). The reader
      // (rowsToAIData byComponent + ingestAI) already handles both once emitted.
      // Card-level (shared) fields. `count` is the card total; `ntypes` says how
      // many distinct propeller types this card holds. quickOverride/quickCount
      // are the v13 Quick Count Override (rule 4b) — plain values, no option list.
      ["count","sym","symLong","symCirc","zone","zoneChord","zoneSpan","notes","ntypes","quickOverride","quickCount"].forEach(function(field) {
        if (card[field] === undefined) return;
        // zone is now MULTI-select (array) — emit as "id — name" values joined by "|".
        var _v = (field === 'zone' && Array.isArray(card.zone))
          ? card.zone.map(function(z){ return withLabel(z, M3_FIELD_OPTS.zone); }).join('|')
          : withLabel(card[field] != null ? card[field] : null, M3_FIELD_OPTS[field]);
        rows.push(reviewRow(apid, "M3", subDim, card.component + "_" + field, _v));
      });
      if (card.types && card.types.length) {
        // Multi-type: one labelled sub-dimension per propeller type, fields
        // suffixed t<n>_<field> so rowsToAIData can regroup them.
        card.types.forEach(function(ty) {
          var tDim = subDim + " — Type " + ty.idx;
          // propKinOth (v15.3) is free text — no entry in M3_FIELD_OPTS, so
          // withLabel passes it through unlabelled and it reads back verbatim.
          ["count","chord","orient","bmech","rmech","propKin","propKinOth","zone","zoneChord","zoneSpan"].forEach(function(field) {
            if (ty[field] === undefined) return;
            var _tv = (field === 'zone' && Array.isArray(ty.zone))
              ? ty.zone.map(function(z){ return withLabel(z, M3_FIELD_OPTS.zone); }).join('|')
              : withLabel(ty[field] != null ? ty[field] : null, M3_FIELD_OPTS[field]);
            rows.push(reviewRow(apid, "M3", tDim, card.component + "_t" + ty.idx + "_" + field, _tv));
          });
        });
      } else if (card.count > 0 || m.topologyClass === 'RC') {
        // Legacy single-type: flat per-attribute fields under the bare component.
        // Mirrors the UI's own gate (m3Card(): count>0 is what reveals this
        // section, EXCEPT for RC, whose single/coaxial hub attrs are always
        // shown with no count stepper at all) — with 0 propulsors here the
        // attribute fields were never shown to the reviewer, so stale
        // ML/default values must not be saved.
        ["chord","orient","bmech","rmech","propKin","propKinOth"].forEach(function(field) {
          if (card[field] === undefined) return;
          rows.push(reviewRow(apid, "M3", subDim, card.component + "_" + field, withLabel(card[field] != null ? card[field] : null, M3_FIELD_OPTS[field])));
        });
      }
    });
  });

  // ── Trim empties ─────────────────────────────────────────────────────────
  // Drop rows whose Value is null/undefined/'' so the export only carries what
  // was actually set — no more one-row-per-unset-field bloat. IMPORTANT: keep
  // boolean false and numeric 0 (those ARE meaningful answers), and always keep
  // each figure's T2 "status" row so a figure stays anchored (its Image_Path
  // rides on it) even when nothing else was recorded for it.
  function _emptyVal(v){ return v === null || v === undefined || v === ''; }
  rows = rows.filter(function(r){
    if (r.Section === 'T2' && r.Field === 'status') return true;   // figure anchor
    return !_emptyVal(r.Value);
  });

  // ── Verbatim pass-through of deprecated M3 boom geometry ──────────────────
  // Patents labelled in the OLD scheme stored boom attachment/position on the
  // M3 boom card (boom_boomAttach / boom_boomPos / boom_tN_boomPosLong / ...).
  // Boom geometry now lives in M1 boom groups, so recordToRows() no longer
  // emits these and the wizard has no field for them — WITHOUT this they'd be
  // silently dropped on the first re-export. Per the reviewer's choice
  // (pass-through verbatim), copy those exact rows straight from the original
  // upload (BATCH.byId, keyed by base id; each row keeps its own _archN
  // Patent_ID) onto the export untouched. recordToRows emits none of these, so
  // there's no duplication; they simply survive round-trips unedited.
  if (BATCH && BATCH.byId && BATCH.byId[pid]) {
    var _isOrphanBoomGeo = function(r){
      return r && r.Section === 'M3' && /^boom_(t\d+_)?boom(Attach|Pos(Long|Span)?)$/.test(String(r.Field || ''));
    };
    BATCH.byId[pid].forEach(function(r){
      if (_isOrphanBoomGeo(r) && !_emptyVal(r.Value)) rows.push(Object.assign({}, r));
    });
  }

  return rows;
}

// Builds one xlsx (SheetJS, client-side) from REVIEWED_ROWS accumulated so
// far and downloads it — named after the batch label so it never collides
// with another batch's output, mirroring ml_predict_labels_<batch>.xlsx.
// Any "Image: <real filename>" row (i.e. not the "(none available)"/"(fig N)"
// no-file placeholders) that still has a blank Image_Path came from the 📎
// Attach Image button — the browser can never fill in a real disk path for a
// picked file, so it needs scripts/resolve_image_paths.py run on the export
// afterward, or the image will keep showing "no image on disk" forever.
function _pendingAttachedImages() {
  var seen = {};
  REVIEWED_ROWS.forEach(function(r) {
    if (r.Section !== 'T2') return;
    var sub = String(r.Sub_Dimension || '');
    if (sub.indexOf('Image: ') !== 0) return;
    var fname = sub.slice('Image: '.length);
    if (!fname || fname === '(none available)' || /^\(fig .+\)$/.test(fname)) return;
    var hasPath = r.Image_Path && String(r.Image_Path).trim() !== '' && r.Image_Path !== 'null';
    if (hasPath) seen[fname] = false;
    else if (!(fname in seen)) seen[fname] = true;
  });
  return Object.keys(seen).filter(function(f){ return seen[f]; });
}

function exportReviewedBatch() {
  if (!REVIEWED_ROWS.length) {
    document.getElementById('batch-load-status').textContent = ' Nothing reviewed yet — nothing to export.';
    return;
  }
  var label = (BATCH && BATCH.label) || "batch";
  var ws = XLSX.utils.json_to_sheet(REVIEWED_ROWS, { header: EXCEL_COLUMNS });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Review");
  var fname = "reviewed_patents_" + label + ".xlsx";
  XLSX.writeFile(wb, fname);
  var pending = _pendingAttachedImages();
  if (pending.length) {
    alert('Exported ' + fname + '.\n\n'
      + pending.length + ' attached image(s) still need their real path resolved — run:\n\n'
      + '  python3 scripts/resolve_image_paths.py <path to ' + fname + '>\n\n'
      + 'before this export is truly done, or those images will keep showing "no image on disk".');
  }
}

// ─── Durable auto-save to a real file (File System Access API) ──────────────
// persistSession()/IndexedDB is NOT crash-safe: a hard power-off can lose IDB
// writes still sitting in the OS page cache (exactly how a batch of reviews was
// lost once). This module mirrors every durable session write out to a real
// .xlsx the user picks once, via the File System Access API — each write does
// createWritable()/write()/close(), and close() flushes to disk, so a power-off
// costs at most the last debounced commit. Where the API is unavailable
// (non-Chrome, or file:// with it disabled) it degrades to periodically
// re-downloading reviewed_patents_<batch>.xlsx every few reviewed patents.
var AUTOSAVE = { handle: null, enabled: false, mode: null, lastSig: '', lastErr: null, dlCount: 0 };
var _AUTOSAVE_HANDLE_KEY = 'autosaveFileHandle';
var _AUTOSAVE_DL_EVERY = 5;   // fallback: force a download every N newly-reviewed patents

function _fsaSupported() { return (typeof window !== 'undefined') && ('showSaveFilePicker' in window); }

// Generic keyed IDB helpers (the FileSystemFileHandle is structured-cloneable,
// so it round-trips through the same evtolTaxonomyDB store as the session).
function _idbPutKey(key, value) {
  return _idbOpen().then(function(db){ return new Promise(function(resolve, reject){
    var tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = function(){ resolve(true); };
    tx.onerror    = function(){ reject(tx.error); };
    tx.onabort    = function(){ reject(tx.error); };
  }); });
}
function _idbGetKey(key) {
  return _idbOpen().then(function(db){ return new Promise(function(resolve, reject){
    var tx = db.transaction(IDB_STORE, 'readonly');
    var rq = tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess = function(){ resolve(rq.result || null); };
    rq.onerror   = function(){ reject(rq.error); };
  }); });
}

// Same rows/columns as exportReviewedBatch(), returned as an ArrayBuffer instead
// of being auto-downloaded.
function _buildReviewedXlsxBuffer() {
  var ws = XLSX.utils.json_to_sheet(REVIEWED_ROWS, { header: EXCEL_COLUMNS });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Review");
  return XLSX.write(wb, { type: "array", bookType: "xlsx" });
}

// Cheap full-content signature so we only rewrite the file when a review
// actually changed (a commit / re-edit), not on every keystroke render. djb2
// over the reviewed rows catches inserts AND in-place re-edits of earlier rows.
function _reviewedSig() {
  var s = JSON.stringify(REVIEWED_ROWS), h = 5381, i = s.length;
  while (i) { h = (h * 33) ^ s.charCodeAt(--i); }
  return (h >>> 0) + ":" + REVIEWED_ROWS.length;
}

function updateAutosaveIndicator() {
  var btn = document.getElementById('batch-autosave');
  if (!btn) return;
  if (AUTOSAVE.enabled && AUTOSAVE.mode === 'fsa') {
    btn.innerHTML = '&#128190; Auto-save: ON';
    btn.title = 'Every commit is written straight to your chosen .xlsx on disk (crash-safe). Click to pick a different file.';
  } else if (AUTOSAVE.mode === 'relink') {
    btn.innerHTML = '&#9888;&#65039; Re-link auto-save';
    btn.title = 'A save file was linked before but the browser needs you to re-grant write access after a reload. Click to re-enable crash-safe auto-save.';
  } else if (AUTOSAVE.enabled && AUTOSAVE.mode === 'download') {
    btn.innerHTML = '&#128190; Auto-save: downloads';
    btn.title = 'This browser can\'t write files directly, so reviewed_patents_*.xlsx is auto-downloaded every few patents. Click to try linking a file again.';
  } else {
    btn.innerHTML = '&#128190; Auto-save: OFF';
    btn.title = 'Click to pick a .xlsx that your progress is written to on every change (crash-safe).';
  }
}

function _verifyPermission(handle, request) {
  var opts = { mode: 'readwrite' };
  return Promise.resolve().then(function(){ return handle.queryPermission(opts); })
    .then(function(p){
      if (p === 'granted') return true;
      if (request) return handle.requestPermission(opts).then(function(r){ return r === 'granted'; });
      return false;
    }).catch(function(){ return false; });
}

// Write the current reviewed rows to the linked file (or fallback-download).
// Fire-and-forget from _writeSessionNow(); self-guards on enabled/empty/no-change.
function _writeAutosaveNow() {
  if (!AUTOSAVE.enabled || !REVIEWED_ROWS.length) return Promise.resolve();
  var sig = _reviewedSig();
  if (sig === AUTOSAVE.lastSig) return Promise.resolve();   // nothing new since last write
  if (AUTOSAVE.mode === 'fsa' && AUTOSAVE.handle) {
    return _verifyPermission(AUTOSAVE.handle, false).then(function(ok){
      if (!ok) { AUTOSAVE.enabled = false; AUTOSAVE.mode = 'relink'; updateAutosaveIndicator(); return; }
      var buf = _buildReviewedXlsxBuffer();
      return AUTOSAVE.handle.createWritable().then(function(w){
        return w.write(buf).then(function(){ return w.close(); });
      }).then(function(){ AUTOSAVE.lastSig = sig; AUTOSAVE.lastErr = null; });
    }).catch(function(e){
      AUTOSAVE.lastErr = e; AUTOSAVE.enabled = false; AUTOSAVE.mode = 'relink'; updateAutosaveIndicator();
    });
  }
  if (AUTOSAVE.mode === 'download') {
    if (REVIEWED_ROWS.length - AUTOSAVE.dlCount >= _AUTOSAVE_DL_EVERY) {
      AUTOSAVE.dlCount = REVIEWED_ROWS.length; AUTOSAVE.lastSig = sig;
      try { exportReviewedBatch(); } catch (e) {}
    }
  }
  return Promise.resolve();
}

// Toolbar-button handler (a user gesture — required both for the save-file
// picker and for requestPermission()).
function linkAutosaveFile() {
  // Re-grant path: a handle survived the reload but its permission reset to
  // 'prompt' — one click restores crash-safe writing to the same file.
  if (AUTOSAVE.mode === 'relink' && AUTOSAVE.handle) {
    return _verifyPermission(AUTOSAVE.handle, true).then(function(ok){
      if (ok) { AUTOSAVE.enabled = true; AUTOSAVE.mode = 'fsa'; AUTOSAVE.lastSig = ''; updateAutosaveIndicator(); return _writeAutosaveNow(); }
    });
  }
  if (!_fsaSupported()) {
    AUTOSAVE.mode = 'download'; AUTOSAVE.enabled = true; AUTOSAVE.dlCount = 0; AUTOSAVE.lastSig = '';
    updateAutosaveIndicator(); return _writeAutosaveNow();
  }
  var label = (BATCH && BATCH.label) || 'batch';
  return window.showSaveFilePicker({
    suggestedName: 'reviewed_patents_' + label + '.xlsx',
    types: [{ description: 'Excel workbook', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
  }).then(function(handle){
    return _verifyPermission(handle, true).then(function(ok){
      if (!ok) return;
      AUTOSAVE.handle = handle; AUTOSAVE.enabled = true; AUTOSAVE.mode = 'fsa'; AUTOSAVE.lastSig = '';
      _idbPutKey(_AUTOSAVE_HANDLE_KEY, handle).catch(function(){});
      updateAutosaveIndicator();
      return _writeAutosaveNow();
    });
  }).catch(function(e){
    if (e && e.name === 'AbortError') return;   // user dismissed the picker — leave state unchanged
    AUTOSAVE.mode = 'download'; AUTOSAVE.enabled = true; AUTOSAVE.dlCount = 0; updateAutosaveIndicator();
  });
}

// On load: reload a previously-linked handle. Chrome resets its permission to
// 'prompt' across reloads, so we can't silently re-grant without a click —
// surface the "Re-link" button in that case, or auto-enable if still granted.
function initAutosave() {
  updateAutosaveIndicator();
  if (!_fsaSupported()) return;
  _idbGetKey(_AUTOSAVE_HANDLE_KEY).then(function(handle){
    if (!handle) return;
    AUTOSAVE.handle = handle;
    return _verifyPermission(handle, false).then(function(ok){
      if (ok) { AUTOSAVE.enabled = true; AUTOSAVE.mode = 'fsa'; AUTOSAVE.lastSig = ''; }
      else    { AUTOSAVE.mode = 'relink'; }
      updateAutosaveIndicator();
    });
  }).catch(function(){});
}

// Mirrors src/ai_labeler.py's fig_number extraction so figure keys here match
// what AI Pre-Label JSON files already use: "_Fu(\d+).png" -> "Fu{n}",
// "_F(\w+).png" -> the captured label (this also matches plain "_Fu.png"
// with no digit, captured as "u" — an existing quirk in ai_labeler.py, kept
// here for consistency rather than "fixed" independently in two places).
function figNumFromFilename(fname) {
  fname = fname || '';
  // Invert recordToRows()'s placeholder Sub_Dimension for a figure that has no
  // real on-disk filename: it writes "Image: (fig <fNum>)", so here the fname is
  // "(fig <fNum>)" and the figure number is whatever's inside. Without this the
  // round-trip keyed the figure's labels under the literal string "(fig 1)"
  // instead of "1", so every per-figure T2 label silently vanished on reload
  // (e.g. after Export & Next → F5 → Prev) for any figure lacking a filename.
  var placeholder = /^\(fig (.+)\)$/.exec(fname);
  if (placeholder) return placeholder[1];
  var fu = /_Fu(\d+)\.png$/.exec(fname);
  if (fu) return 'Fu' + fu[1];
  // Bare "_Fu.png" (no digit suffix) marks a genuinely unmapped crop — the
  // pipeline couldn't read a FIG. number off the page, so every unmapped
  // crop in a patent can share this exact suffix. Without a unique key
  // they'd all collapse onto the same fNum "u" and silently overwrite each
  // other in T2[fNum]/FIG_FILENAMES[fNum]/FIG_IMAGE_PATH[fNum] (only the
  // last one survived — this is why patents with 2+ unmapped crops only
  // ever showed one image). The D-number earlier in the filename (the
  // drawing/page index, e.g. "D00002") is unique per crop, so use that.
  if (/_Fu\.png$/.test(fname)) {
    var dnum = /_D(\d+)_/.exec(fname);
    return dnum ? ('Fu_D' + dnum[1]) : fname.replace(/\.png$/i, '');
  }
  var f = /_F(\w+)\.png$/.exec(fname);
  if (f) return f[1];
  return fname.replace(/\.png$/i, '');
}

// Excel/SheetJS hands booleans back as JS booleans, but the reviewed-export
// round-trip and hand-edited files can store them as the strings "true"/"false"
// (or 1/0). Coerce all of those to a real boolean so isApproved/isDuplicate/
// latSym/m3 sym map consistently regardless of how the cell was written.
function xlBool(v) {
  if (typeof v === 'boolean') return v;
  if (v == null) return null;
  var s = String(v).trim().toLowerCase();
  if (s === 'true'  || s === '1' || s === 'yes') return true;
  if (s === 'false' || s === '0' || s === 'no' || s === '') return false;
  return null;
}

// Normalizes a count-typed field (archCount, wCount, boomCount, boom{N}_count,
// every M3 per-station *_count field) to a real integer, for both the export
// layer and on import (legacy files can carry a boolean "presence" flag in a
// count cell instead of a number). Rule: presence-true with no explicit number
// → 1; absent/false → 0; explicit number (or numeric string) → that number.
function xlCount(v) {
  if (v == null || v === '') return 0;
  if (v === true) return 1;
  if (v === false) return 0;
  if (typeof v === 'string') {
    var s = v.trim().toLowerCase();
    if (s === '') return 0;
    if (s === 'true' || s === 'yes') return 1;
    if (s === 'false' || s === 'no') return 0;
  }
  var n = parseInt(v, 10);
  return isNaN(n) ? 0 : n;
}

// Source tags written by the ML pipelines (01a_wizard_feed.ipynb / 01_review.ipynb
// run_stage01()) for pre-label SUGGESTIONS — never by a human save (recordToRows()
// leaves Source null/unset for every row it writes). Used to gate any state that
// must only ever reflect an actual reviewer decision (isHumanReviewed,
// dupConfirmed, duplicateCopiedId) so an ML pre-label file can never masquerade
// as a saved/committed review just because it happens to carry the same field
// names a reviewed file would.
var MACHINE_SOURCES = { sbert:1, siglip:1, auto_heuristic:1, patseer_family:1, auto:1 };

// Converts one patent's flat rows (Patent_ID/Section/Sub_Dimension/Field/
// Value/...) into the same nested {T1,G1,M1,T2,wings,propulsionCards} shape
// ingestAI() already knows how to apply — so the batch loader and the
// per-patent AI Pre-Label JSON share one ingestion path.
function rowsToAIData(rows) {
  var byField = {};
  rows.forEach(function(r) { byField[r.Field] = r; });
  function val(field) {
    var r = byField[field];
    return (r && r.Value !== undefined && r.Value !== '') ? r.Value : null;
  }

  var T1 = {}, G1 = {}, M1 = {};
  if (val('scope')    != null) T1.scope    = val('scope');
  if (val('t1Field')  != null) T1.t1Field  = val('t1Field');
  if (val('t1Target') != null) T1.t1Target = val('t1Target');

  // T1 triage state — Excel stores these as the manual rows isApproved /
  // t1DisapproveReason / archCount / isDuplicate / duplicateId (excel_schema.py
  // _T1_MANUAL) plus the META row duplicateType. They were being dropped on
  // load, so the wizard never echoed back the approval/duplicate choices that
  // were already recorded in the file.
  if (val('isApproved')         != null) T1.approved          = xlBool(val('isApproved'));
  if (val('t1DisapproveReason') != null) T1.disapprove_reason = stripLabel(val('t1DisapproveReason'));
  // Categorical "Other" pattern (rule 2): new sibling name "t1DisapproveReason_
  // otherNote", falling back to the legacy "disapproveOther" row name so older
  // reviewed files still round-trip.
  if (val('t1DisapproveReason_otherNote') != null) T1.disapprove_other = val('t1DisapproveReason_otherNote');
  else if (val('disapproveOther')         != null) T1.disapprove_other = val('disapproveOther');
  if (val('archCount')          != null) T1.arch_count        = val('archCount');
  if (val('isDuplicate')        != null) T1.isDuplicate       = xlBool(val('isDuplicate'));
  // Source of the isDuplicate row itself (not stripped by val()) — needed so
  // ingestAI() can tell an ML duplicate SUGGESTION (Source e.g. "sbert",
  // "patseer_family") apart from a human-committed one (Source null) before
  // deciding whether to treat it as already "Copied" (see duplicateCopiedId
  // below / MACHINE_SOURCES above).
  if (byField['isDuplicate'])            T1.isDuplicateSource = byField['isDuplicate'].Source;
  if (val('duplicateId')        != null) T1.duplicateId       = val('duplicateId');
  if (val('duplicateType')      != null) T1.duplicateType     = stripLabel(val('duplicateType'));
  // Quick Count Override (v13, rule 4e) — T1 is patent-level.
  if (val('t1_quickOverride')   != null) T1.quickOverride     = xlBool(val('t1_quickOverride'));
  if (val('t1_quickNote')       != null) T1.quickNote         = val('t1_quickNote');
  // Human-uncertainty flag (v13) — T1 is patent-level.
  if (val('t1_humanUncertain')  != null) T1.humanUncertain    = xlBool(val('t1_humanUncertain'));
  if (val('t1_uncertainNote')   != null) T1.uncertainNote     = val('t1_uncertainNote');

  // isHumanReviewed: true only for a reviewed/exported record (carries an
  // explicit isApproved verdict that a HUMAN set), false/undefined for a fresh
  // ML pre-label load. Bug fix (v13, rule 6): ingestAI() uses this to guard the
  // latSym load, which otherwise clobbered the M1 default (true) with an ML
  // pre-label's guess.
  // Bug fix: 01a_wizard_feed.ipynb's auto-approval heuristic now also writes an
  // isApproved row (Source="auto_heuristic") into ML pre-label files, which used
  // to satisfy this check on its own and made a never-reviewed file look
  // human-reviewed. Gate on Source too so only an actual reviewer verdict counts.
  var isApprovedRow  = byField['isApproved'];
  var isHumanReviewed = !!isApprovedRow && isApprovedRow.Value != null && isApprovedRow.Value !== ''
    && !MACHINE_SOURCES[isApprovedRow.Source];

  if (val('topType')     != null) G1.topType     = stripLabel(val('topType'));
  if (val('notPureArch') != null) G1.notPureArch = xlBool(val('notPureArch'));
  // Quick Count Override (v13, rule 4e).
  if (val('g1_quickOverride') != null) G1.quickOverride = xlBool(val('g1_quickOverride'));
  if (val('g1_quickNote')     != null) G1.quickNote     = val('g1_quickNote');
  // Human-uncertainty flag (v13).
  if (val('g1_humanUncertain') != null) G1.humanUncertain = xlBool(val('g1_humanUncertain'));
  if (val('g1_uncertainNote')  != null) G1.uncertainNote  = val('g1_uncertainNote');

  // wingConf/wCount/empType/empKin live under Section "M2" in the row schema,
  // fusShape/fusKin/gearArch/latSym under "M1" — ingestAI() expects all of
  // them merged into one data.M1 object, so just look each field up by name.
  // wingConf/empType/empKin/fusShape/fusKin/gearArch are written as "<id> —
  // <name>" by recordToRows() (see withLabel()), so they need stripLabel() to
  // recover the bare id. The rest (counts/booleans/numbers/free-text notes)
  // must NOT go through stripLabel — a human note can legitimately contain
  // " — " as ordinary punctuation, and truncating it there would corrupt it.
  // empKin (v14/C4): retired as a REVIEWER-FACING field, but kept in this list
  // (coded, so an old "Fixed — ..." / "Tilt — ..." value still strips cleanly)
  // purely so ingestAI's legacy empKin→empTilts mapping has something to read
  // from an old save. New saves never write an empKin row at all.
  var CODED_M1_FIELDS = { wingConf:1, empType:1, empKin:1, fusShape:1, fusKin:1, gearArch:1, dinoUnderstanding:1 };
  ['wingConf', 'wCount', 'empType', 'empKin', 'empTilts', 'empTiltsNote', 'fusShape', 'fusKin', 'gearArch', 'latSym',
   'footLen', 'footWid', 'footHgt', 'footAmbiguous', 'longSym',
   'wingNotes', 'empNotes', 'fusNotes', 'gearNotes',   // persistence fix (H4): notes round-trip
   'dinoUnderstanding',   // per-architecture DINOv2 understanding projection
   'boomsPresent', 'boomXFormat',   // M1 structural booms present-gate + (retired v14) X-formation flag
   // Quick Count Override (v13, rule 4e) — m1_*/m2_* land on this same merged
   // object (prefixed keys avoid collision, matching the wingConf/latSym pattern).
   'm1_quickOverride', 'm1_quickNote', 'm2_quickOverride', 'm2_quickNote',
   // Human-uncertainty flag (v13) — m1_*/m2_*/m3_* land on this same merged object too.
   'm1_humanUncertain', 'm1_uncertainNote', 'm2_humanUncertain', 'm2_uncertainNote',
   'm3_humanUncertain', 'm3_uncertainNote',
   // Shared categorical-"Other" notes (v15.3) — free text, deliberately NOT in
   // CODED_M1_FIELDS so stripLabel never truncates a note containing " — ".
   'wingConfOtherNote', 'empTypeOtherNote', 'fusShapeOtherNote']
    .forEach(function(f) { var v = val(f); if (v != null) M1[f] = CODED_M1_FIELDS[f] ? stripLabel(v) : v; });

  // M1 boom groups — rows under Sub_Dimension "Boom Group N", fields
  // boom<N>_attach|span|long|orient|count|sym|cards (see recordToRows()). attach/
  // span/long/orient are "<id> — <name>" coded, so stripLabel; count is numeric,
  // sym boolean, cards a pipe-joined list of m3 component keys.
  // attachOth/spanOth/longOth/orientOth (v15.3) are free text — kept OUT of
  // BG_CODED so stripLabel never truncates a note containing " — ".
  var BG_CODED = { attach:1, wingSpan:1, span:1, long:1, orient:1 };
  var byBoom = {};
  rows.forEach(function(r) {
    if (r.Section !== 'M1') return;
    var bm = /^boom(\d+)_(attach|wingSpan|span|long|orient|count|sym|circSym|hasProps|cards|attachOth|spanOth|longOth|orientOth)$/.exec(String(r.Field || ''));
    if (!bm) return;
    if (r.Value === undefined || r.Value === '' || r.Value == null) return;
    var bi = parseInt(bm[1], 10), key = bm[2];
    if (!byBoom[bi]) byBoom[bi] = { attach:null, wingSpan:null, span:null, long:null, orient:null, count:0, symmetric:false, circSymmetric:false, hasProps:null, cards:[], notes:'' };
    if (key === 'count')        byBoom[bi].count          = xlCount(r.Value);   // rule 1: normalize True/False → 1/0
    else if (key === 'sym')     byBoom[bi].symmetric      = xlBool(r.Value);
    else if (key === 'circSym') byBoom[bi].circSymmetric  = xlBool(r.Value);
    else if (key === 'hasProps') byBoom[bi].hasProps       = xlBool(r.Value);
    else if (key === 'cards')   byBoom[bi].cards           = String(r.Value).split('|').filter(Boolean);
    else if (key === 'notes')   byBoom[bi].notes           = r.Value;
    else                        byBoom[bi][key]            = BG_CODED[key] ? stripLabel(r.Value) : r.Value;
  });
  var boomGroups = Object.keys(byBoom).map(function(k){ return parseInt(k,10); })
    .sort(function(a,b){ return a-b; }).map(function(i){ return byBoom[i]; });
  // Back-compat: boom groups exported BEFORE the hasProps toggle existed carry a
  // non-empty `cards` link (they DO carry propulsors) but no explicit hasProps.
  // Infer hasProps=true from the link so the "Carries propulsors?" toggle isn't
  // shown blank on those reviewed files. (Only fills an unset value.)
  boomGroups.forEach(function(g){ if (g.hasProps == null && g.cards && g.cards.length) g.hasProps = true; });
  // Legacy migration: old files stored a flat aggregate (boomCount/boomOrient/
  // boomSym) and per-card boom geometry (M3 boomAttach/boomPosLong/boomPosSpan).
  // If there are no boom-group rows but the aggregate exists, fold it into one
  // group so older reviewed files still round-trip (no data loss).
  if (!boomGroups.length) {
    var legCount = val('boomCount'), legOrient = val('boomOrient'), legSym = val('boomSym');
    if (legCount != null || legOrient != null || legSym != null) {
      boomGroups = [{ attach:null, span:null, long:null,
        orient: legOrient != null ? stripLabel(legOrient) : null,
        count: xlCount(legCount),   // rule 1: normalize True/False → 1/0
        symmetric: legSym != null ? xlBool(legSym) : false, cards: [] }];
    }
  }
  if (boomGroups.length) M1.boomGroups = boomGroups;
  if (val('boomNotes') != null) M1.boomNotes = val('boomNotes');

  // T2 — rows grouped by Sub_Dimension "Image: <filename>"
  var byImage = {};
  rows.forEach(function(r) {
    if (r.Section !== 'T2') return;
    var sub = String(r.Sub_Dimension || '');
    if (sub.indexOf('Image: ') !== 0) return;
    var fname = sub.slice('Image: '.length);
    if (!byImage[fname]) byImage[fname] = {};
    if (r.Value !== undefined && r.Value !== '' && r.Value != null) {
      byImage[fname][r.Field] = r.Value;
    }
    // Capture the Source of the duplicate-reference row specifically (not just
    // its Value) — needed below to tell an ML dup SUGGESTION apart from a
    // human-committed one before inferring dupConfirmed (see MACHINE_SOURCES).
    if ((r.Field === 'dupOfPatent' || r.Field === 'dupOfFig' || r.Field === 'dupOf') && r.Source != null) {
      byImage[fname].__dupSource = r.Source;
    }
    // Robust read: every row in this image's group carries the same
    // Image_Path value, but only some rows had it populated in the source
    // file — grab it from whichever row has it, regardless of that row's
    // Field, and never let a blank/null row blow away a path already
    // captured from an earlier row for this same figure.
    if (r.Image_Path && String(r.Image_Path).trim() !== '' && r.Image_Path !== 'null') {
      byImage[fname].__imagePath = String(r.Image_Path).trim();
    }
  });
  var T2 = {};
  // Reset per-patent — recordToRows() needs fNum -> filename/path for
  // whichever patent is currently loaded, not a previous one.
  // NOTE: FIG_ATTACHED_URL is deliberately NOT touched here — rowsToAIData()
  // is also called for transient/nested reads (copyMorphologyFromOriginal,
  // extractArchSnapshots peeking at a DIFFERENT patent's rows mid-session),
  // and URL.revokeObjectURL() is irreversible: wiping it here once killed the
  // CURRENT patent's real attached images the moment either of those ran,
  // even though the caller "restored" the dict reference right after (the
  // blobs were already dead). The one-time "we're now on a new patent" reset
  // belongs in ingestPatentRows() instead — see there.
  FIG_FILENAMES = {};
  FIG_IMAGE_PATH = {};
  Object.keys(byImage).forEach(function(fname) {
    var rec = byImage[fname], entry = {};
    // Persistence fix: qualityFlag/hasLegends/comment/arch/status/rotation_deg are
    // now read back so the reviewed-file round-trip restores them. ML pre-label
    // files never carry these fields, so loading them is unaffected.
    // qualityFlag/acState are written as "<id> — <name>" (withLabel()) — strip
    // back to the bare id; the rest here are free text/booleans/plain strings
    // that never carry a label, so stripLabel must NOT touch them.
    ['per', 'acSty', 'acCol', 'bgSty', 'bgCol', 'acStyOtherNote', 'acColOtherNote',
     'bgStyOtherNote', 'bgColOtherNote', 'dupOfPatent', 'dupOfFig',
     'hasLegends', 'comment', 'arch', 'status', 'rotation_deg', 'partsMulti',
     'stateNote', 'isMain'].forEach(function(k) {
      if (rec[k] != null) entry[k] = rec[k];
    });
    if (rec.qualityFlag != null) entry.qualityFlag = stripLabel(rec.qualityFlag);
    if (rec.acState != null) entry.acState = stripLabel(rec.acState);
    // Combined single-row duplicate reference "<patent> FIG. <fig>" (new reviewed
    // exports). Split it back into dupOfPatent + dupOfFig — but never override the
    // separate two-field form if that's what the file used (ML files / older
    // exports), which was already read above into entry.dupOfPatent/dupOfFig.
    if (rec.dupOf != null && entry.dupOfPatent == null && entry.dupOfFig == null) {
      var _m = /^(.*?)\s*FIG\.\s*(.+)$/i.exec(String(rec.dupOf).trim());
      if (_m) {
        if (_m[1].trim()) entry.dupOfPatent = _m[1].trim();
        entry.dupOfFig = _m[2].trim();
      } else if (String(rec.dupOf).trim()) {
        entry.dupOfPatent = String(rec.dupOf).trim();
      }
    }
    if (rec.parts != null) entry.parts = String(rec.parts).split('|').filter(Boolean);
    if (rec.edgeTags != null) entry.edgeTags = String(rec.edgeTags).split('|').filter(Boolean);
    if (rec.tiltedInView != null) entry.tiltedInView = String(rec.tiltedInView).split('|').map(stripLabel).filter(Boolean);
    if (rec.__dupSource != null) entry.__dupSource = rec.__dupSource;
    // figKey (written by recordToRows on export) is the authoritative fNum —
    // fall back to guessing from the filename only for files that never had
    // one (ML pre-label exports, or older reviewed files from before this fix).
    var fNum = rec.figKey != null ? String(rec.figKey) : figNumFromFilename(fname);
    T2[fNum] = entry;
    FIG_FILENAMES[fNum] = fname;
    if (rec.__imagePath) FIG_IMAGE_PATH[fNum] = rec.__imagePath;
  });

  // M3 — rows grouped by Sub_Dimension "Propulsion: <component>", Field
  // "<component>_<field>" (see src/excel_schema.py build_patent_rows()).
  // Multi-type cards add per-type sub-dimensions "Propulsion: <component> — Type N"
  // with fields "<component>_t<N>_<field>"; we strip the "— Type N" suffix so all
  // types regroup under the base component, and collect them into a `types` array.
  // chord/bmech/rmech/propKin/zone*/boomAttach/boomPos are written as "<id> —
  // <name>"; count/sym/notes/ntypes/orient are not (orient's Horizontal/
  // Vertical/Mixed are already plain words) — only strip the former.
  var CODED_M3_FIELDS = { chord:1, bmech:1, rmech:1, propKin:1, zone:1, zoneChord:1, zoneSpan:1, boomAttach:1, boomPos:1, boomPosLong:1, boomPosSpan:1 };
  var byComponent = {};
  rows.forEach(function(r) {
    if (r.Section !== 'M3') return;
    var sub = String(r.Sub_Dimension || '');
    if (sub.indexOf('Propulsion: ') !== 0) return;
    var component = sub.slice('Propulsion: '.length).replace(/\s+—\s+Type\s+\d+\s*$/, '');
    var prefix = component + '_';
    var field  = String(r.Field || '');
    var suffix = field.indexOf(prefix) === 0 ? field.slice(prefix.length) : field;
    if (!byComponent[component]) byComponent[component] = { component: component };
    var val = (r.Value !== undefined && r.Value !== '' && r.Value != null) ? r.Value : undefined;
    if (val === undefined) return;
    // Per-type field? suffix looks like "t<N>_<field>".
    var tm = /^t(\d+)_(.+)$/.exec(suffix);
    if (tm) {
      var ti = parseInt(tm[1], 10), tfield = tm[2];
      var card = byComponent[component];
      if (!card.types) card.types = {};
      if (!card.types[ti]) card.types[ti] = { idx: ti };
      // zone is MULTI-select — split "a — A|b — B" into an id array.
      card.types[ti][tfield] = (tfield === 'zone')
        ? String(val).split('|').map(stripLabel).filter(Boolean)
        : (CODED_M3_FIELDS[tfield] ? stripLabel(val) : val);
    } else {
      byComponent[component][suffix] = (suffix === 'zone')
        ? String(val).split('|').map(stripLabel).filter(Boolean)
        : (CODED_M3_FIELDS[suffix] ? stripLabel(val) : val);
    }
  });
  var propulsionCards = Object.keys(byComponent).map(function(k) {
    var card = byComponent[k];
    // Normalise the types map -> ordered array (ingestAI expects an array).
    if (card.types) {
      card.types = Object.keys(card.types)
        .sort(function(a,b){ return a - b; })
        .map(function(ti){ return card.types[ti]; });
    }
    return card;
  });

  // M2 per-wing detail — rows with Field "wing<i>_<wTilt|wPosV|wPosL|wPlan|wRole>"
  // (excel_schema.py _WING_MANUAL). These were never reconstructed, so the wing
  // tilt/position/planform/role labels stayed at their defaults on load even
  // when the Excel had them. Map the wizard's wField names back to the
  // ingestAI() wing shape ({id, tilt, posV, posL, plan, role}).
  // Accept BOTH field namings: the wizard's own recordToRows() emits
  // "wing1_tilt/posV/posL/plan/role", while the Python pipeline (excel_schema.py)
  // emits "wing1_wTilt/wPosV/...". The old regex only matched the Python form, so
  // the wizard's OWN reviewed exports never round-tripped M2 wing details — THIS
  // was the "M2 not saved" bug.
  var WING_FIELD_MAP = { wTilt:'tilt', wPosV:'posV', wPosL:'posL', wPlan:'plan', wRole:'role',
                         tilt:'tilt', posV:'posV', posL:'posL', plan:'plan', role:'role' };
  var byWing = {};
  rows.forEach(function(r) {
    if (r.Section !== 'M2') return;
    var m = /^wing(\d+)_(wTilt|wPosV|wPosL|wPlan|wRole|tilt|posV|posL|plan|role)$/.exec(String(r.Field || ''));
    if (!m) return;
    var idx = parseInt(m[1], 10), key = WING_FIELD_MAP[m[2]];
    if (r.Value === undefined || r.Value === '' || r.Value == null) return;
    if (!byWing[idx]) byWing[idx] = { id: idx };
    byWing[idx][key] = stripLabel(r.Value);
  });
  // Categorical "Other" pattern (rule 2): plan_otherNote is free text, so it must
  // NOT go through stripLabel (unlike the coded fields above).
  rows.forEach(function(r) {
    if (r.Section !== 'M2') return;
    var mo = /^wing(\d+)_(plan|role)_otherNote$/.exec(String(r.Field || ''));
    if (!mo) return;
    if (r.Value === undefined || r.Value === '' || r.Value == null) return;
    var idxO = parseInt(mo[1], 10);
    if (!byWing[idxO]) byWing[idxO] = { id: idxO };
    byWing[idxO][mo[2] + 'OtherNote'] = r.Value;
  });
  var wings = Object.keys(byWing)
    .map(function(k){ return parseInt(k, 10); })
    .sort(function(a, b){ return a - b; })
    .map(function(i){ return byWing[i]; });

  return { T1: T1, G1: G1, M1: M1, T2: T2, wings: wings, propulsionCards: propulsionCards, isHumanReviewed: isHumanReviewed };
}

// "Same Aircraft" duplicates (DUP_TYPES id '1') share the exact same
// morphology — re-labeling M1/M2/M3/G1 by hand for every continuation of
// the same physical aircraft is pure repeated work. Pulls those sections
// from a patent already reviewed & exported earlier in this batch session
// (REVIEWED_ROWS) into the current S, leaving T1 triage and T2 image data
// (this patent's own figures/files) untouched.
function copyMorphologyFromOriginal(originalPid) {
  var origRows = REVIEWED_ROWS.filter(function(r) { return basePatentId(r.Patent_ID) === originalPid; });
  if (!origRows.length) {
    alert('Patent "' + originalPid + '" hasn\'t been reviewed & exported yet in this session — nothing to copy from.');
    return false;
  }
  // rowsToAIData() rebuilds the global FIG_FILENAMES/FIG_IMAGE_PATH lookup
  // as a side effect, keyed to whatever rows it's given — save/restore this
  // patent's own image lookup around the call so pulling the original's
  // G1/M1/M2/M3 doesn't also overwrite which images belong to THIS patent.
  var savedFilenames = FIG_FILENAMES, savedImagePaths = FIG_IMAGE_PATH, savedAttached = FIG_ATTACHED_URL;
  // For multi-arch originals, use only arch 1's rows so the byField lookup
  // isn't confused by arch 2+ overwriting arch 1's field values.
  var arch1Rows = rowsForArch(origRows, 1);
  var origData = rowsToAIData(arch1Rows.length ? arch1Rows : origRows);
  FIG_FILENAMES = savedFilenames;
  FIG_IMAGE_PATH = savedImagePaths;
  FIG_ATTACHED_URL = savedAttached;
  // isHumanReviewed passed through explicitly (rule 6 guard) — origRows always
  // come from REVIEWED_ROWS here, so origData.isHumanReviewed is already true,
  // but forwarding it keeps this call correct if that source ever changes.
  ingestAI({ G1: origData.G1, M1: origData.M1, wings: origData.wings, propulsionCards: origData.propulsionCards, isHumanReviewed: origData.isHumanReviewed });
  // Commit the new morphology into archProfiles[curArch] immediately, exactly
  // as applyCopyMorphSource does — without this, a stale profile (loaded when
  // the user first entered the morphology pages) survives and overwrites the
  // copy when loadArchProfile(0) is called on the T2→G1 transition.
  saveCurArchProfile();
  return true;
}

// v13: flagging a type-1 ("Same Aircraft") or type-3 ("Same plane, small
// changes") duplicate auto-copies M1–M3 (+G1) the moment the reviewer commits
// the pair — type card clicked, the original's ID entered while type 1/3 is
// selected, or the duplicate flag re-ticked — no separate "⟲ Copy" click
// needed. Type 1: the copy IS the labels (same aircraft) and commits the dup
// for export via duplicateCopiedId. Type 3: the copy is a STARTING POINT the
// reviewer then edits for the small changes; the export commits on the flag
// alone regardless (duplicateCopiedId only tracks copy state for the UI).
// Only fires from HUMAN event handlers, never from ingestAI, so an ML
// duplicate suggestion still can't commit itself (the MACHINE_SOURCES gate
// stands). Deliberately SILENT when the original isn't in REVIEWED_ROWS yet
// (reviewed out of order): the manual button stays as the fallback and
// explains that requirement on click.
function autoCopyDupMorphology() {
  if (!S.isDuplicate || (S.duplicateType !== '1' && S.duplicateType !== '3')) return false;
  var dupId = (S.duplicateId || '').trim();
  if (!dupId || S.duplicateCopiedId === dupId) return false;
  var hasOriginal = REVIEWED_ROWS.some(function(r){ return basePatentId(r.Patent_ID) === dupId; });
  if (!hasOriginal) return false;
  if (!copyMorphologyFromOriginal(dupId)) return false;
  S.duplicateCopiedId = dupId;
  if (BATCH) markBatchDirty();
  return true;
}

// ── Copy morphology (G1/M1/M2/M3) into the CURRENT architecture ──────────────
// Sources: another architecture of THIS patent, or any architecture of the
// PREVIOUS patent (read back from its reviewed rows). Driven by a sidebar button.
var _copyMorphOpen = false;     // is the source picker expanded?
var _copyMorphSources = [];     // [{key,label,snap}] computed when the picker opens

// Rebuild per-architecture morphology snapshots from a patent's reviewed rows,
// WITHOUT disturbing the patent currently in S (save + restore everything the
// extraction touches: morphology snapshot, m3_* keys, and the FIG_* lookups
// that rowsToAIData rebuilds as a side effect).
function extractArchSnapshots(rows) {
  var idxSet = {};
  rows.forEach(function(r){ var s = archSuffixNum(r.Patent_ID); if (s != null) idxSet[s] = true; });
  var archIdxs = Object.keys(idxSet).map(Number).sort(function(a,b){ return a-b; });
  if (!archIdxs.length) archIdxs = [1];

  var savedSnap = captureAircraftSnapshot();
  var savedFN = FIG_FILENAMES, savedIP = FIG_IMAGE_PATH, savedAU = FIG_ATTACHED_URL;
  var out = [];
  archIdxs.forEach(function(n){
    var blank = fresh();
    Object.keys(S).forEach(function(k){ if (k.indexOf('m3_') === 0 || M3_QUICK_KEY_RE.test(k)) delete S[k]; });
    aircraftSnapshotKeys().forEach(function(k){ S[k] = blank[k]; });
    var d = rowsToAIData(rowsForArch(rows, n));
    // isHumanReviewed passed through (rule 6 guard) — `rows` here may be either
    // REVIEWED_ROWS (human-reviewed) or raw ML predictions (see buildCopyMorphSources),
    // so d.isHumanReviewed correctly reflects whichever source this call is using.
    ingestAI({ G1: d.G1, M1: d.M1, wings: d.wings, propulsionCards: d.propulsionCards, isHumanReviewed: d.isHumanReviewed });
    out.push({ arch: n, snapshot: captureAircraftSnapshot() });
  });
  // Restore the live patent's morphology + image lookups.
  applyAircraftSnapshot(savedSnap);
  FIG_FILENAMES = savedFN; FIG_IMAGE_PATH = savedIP; FIG_ATTACHED_URL = savedAU;
  return out;
}

// Build the list of morphology sources available to copy into the current arch.
function buildCopyMorphSources() {
  var sources = [];
  saveCurArchProfile();                 // capture the active arch so it's in archProfiles
  var nArch = getArchCount();
  for (var i = 0; i < nArch; i++) {
    if (i === S.curArch) continue;      // can't copy an arch onto itself
    if (S.archProfiles[i]) sources.push({ key: 'self|' + i, label: 'This patent · Arch ' + (i + 1), snap: S.archProfiles[i] });
  }
  if (BATCH && BATCH.idx > 0) {
    var prevPid = BATCH.ids[BATCH.idx - 1];
    // Prefer the previous patent's REVIEWED rows (human-edited); fall back to its
    // original ML-predicted rows so you can still copy even if it wasn't reviewed.
    var prevReviewed = REVIEWED_ROWS.filter(function(r){ return basePatentId(r.Patent_ID) === prevPid; });
    var prevRows = prevReviewed.length ? prevReviewed : (BATCH.byId[prevPid] || []);
    var tag = prevReviewed.length ? '' : ' (predicted)';
    if (prevRows.length) {
      extractArchSnapshots(prevRows).forEach(function(s){
        sources.push({ key: 'prev|' + s.arch, label: 'Prev ' + prevPid + ' · Arch ' + s.arch + tag, snap: s.snapshot });
      });
    }
  }
  return sources;
}

// Apply one source snapshot onto the current architecture (editable pre-fill).
function applyCopyMorphSource(idx) {
  var src = _copyMorphSources[idx];
  if (!src || !src.snap) return;
  applyAircraftSnapshot(src.snap);   // overwrite current arch's G1/M1/M2/M3 morphology
  saveCurArchProfile();              // persist into archProfiles[curArch]
  _copyMorphOpen = false;
  if (BATCH) markBatchDirty();
  render();
}

// Sidebar panel: a toggle button + (when open) the list of sources. Shown from
// T2 onward (T2 + the morphology pages), where figures/architectures exist —
// hidden on T1 (pure metadata) and when no batch is loaded.
function renderCopyMorph() {
  var el = document.getElementById('copy-morph-rail');
  if (!el) return;
  var show = BATCH && ['t2','gate','m1','m2','m3'].indexOf(curSID()) > -1;
  if (!show) { el.innerHTML = ''; _copyMorphOpen = false; return; }

  var h = '<div class="rail-label" style="margin-top:6px;">Copy morphology</div>'
        + '<button type="button" id="btn-copy-morph-toggle" class="btn" title="Copy G1/M1/M2/M3 from another architecture or the previous patent into Architecture ' + (S.curArch + 1) + '">⧉ Copy M1–M3 into Arch ' + (S.curArch + 1) + (_copyMorphOpen ? ' ▲' : ' ▼') + '</button>';
  if (_copyMorphOpen) {
    if (!_copyMorphSources.length) {
      h += '<div class="m3-sub" style="margin-top:6px;">No sources yet — another architecture in this patent, or review the previous patent first.</div>';
    } else {
      h += '<div style="display:flex; flex-direction:column; gap:6px; margin-top:6px;">'
        + _copyMorphSources.map(function(s, i){
            return '<button type="button" class="btn" data-copy-morph-idx="' + i + '" style="font-size:11px; text-align:left;" title="Copy from ' + escHtml(s.label) + ' into Architecture ' + (S.curArch + 1) + '">⟲ ' + escHtml(s.label) + '</button>';
          }).join('')
        + '</div>';
    }
  }
  el.innerHTML = h;
}

// ── Save-state indicator ─────────────────────────────────────────────────
// "Saved" means this patent's reviewed rows are captured in REVIEWED_ROWS (the
// buffer that exportReviewedBatch() writes to the .xlsx). updateSaveIndicator()
// reflects, for the patent on screen, whether it is Unsaved / Saved / Modified,
// and shows how many of the batch's patents have been saved so far.
function updateSaveIndicator() {
  var badge = document.getElementById('batch-save-status');
  var count = document.getElementById('batch-saved-count');
  if (!badge) return;
  if (!BATCH) { badge.style.display = 'none'; if (count) count.textContent = ''; return; }
  badge.style.display = '';
  var pid = BATCH.ids[BATCH.idx];
  var isSaved = !!BATCH.saved[pid];
  var state, bg, bdr, fg;
  if (isSaved && !BATCH.dirty)      { state = '✓ Saved';    bg = 'var(--ok-bg)';   bdr = 'var(--ok-bdr)';   fg = 'var(--ok)'; }
  else if (isSaved && BATCH.dirty)  { state = '✎ Modified'; bg = 'var(--warn-bg)'; bdr = 'var(--warn-bdr)'; fg = 'var(--warn)'; }
  else                              { state = '• Unsaved';  bg = 'var(--bg2)';     bdr = 'var(--border2)';  fg = 'var(--text2)'; }
  badge.textContent = state;
  badge.style.background = bg; badge.style.borderColor = bdr; badge.style.color = fg;
  badge.title = isSaved
    ? (BATCH.dirty ? 'Saved earlier, but edited since — re-save to update the .xlsx' : 'Captured in the reviewed .xlsx buffer')
    : 'Not yet written to the reviewed .xlsx buffer';
  if (count) {
    var n = Object.keys(BATCH.saved).length;
    count.textContent = '(' + n + '/' + BATCH.ids.length + ')';
  }
}

// Marks the on-screen patent as having unsaved edits. Wired to the data-entry
// events below so the indicator flips to "Modified"/"Unsaved" the moment a
// reviewer changes anything.
function markBatchDirty() {
  if (!BATCH || BATCH.dirty) return;
  BATCH.dirty = true;
  updateSaveIndicator();
}

// Commit one patent's reviewed rows into REVIEWED_ROWS, replacing any rows from
// a previous save of the same patent so revisiting + re-saving never duplicates
// it in the exported .xlsx. Then flag it saved and clear the dirty state.
function commitReviewedRows(pid, record) {
  // Drop every prior row for this patent — INCLUDING its "_arch{N}" morphology
  // rows (match on the base id) — so re-saving a multi-architecture patent never
  // leaves stale architecture rows behind.
  REVIEWED_ROWS = REVIEWED_ROWS.filter(function(r){ return basePatentId(r.Patent_ID) !== pid; });
  REVIEWED_ROWS = REVIEWED_ROWS.concat(recordToRows(record, pid));
  if (BATCH) { BATCH.saved[pid] = true; BATCH.dirty = false; }
  updateSaveIndicator();
}

// Auto-save the patent currently on screen into the reviewed buffer, so paging
// away with Prev/Next never loses edits (the reviewer asked for always-save).
// Only commits when there are actual unsaved edits (BATCH.dirty) — patents merely
// paged past untouched are left as-is so we don't persist raw ML predictions as
// if they were human-reviewed. Must run BEFORE BATCH.idx changes.
function autoSaveCurrentPatent() {
  if (!BATCH || !BATCH.dirty) return;
  commitReviewedRows(BATCH.ids[BATCH.idx], buildExport());
}

// Relationship between the current patent and the "mother" patent it's flagged a
// duplicate of (S.duplicateId). By convention the FIRST occurrence in the batch
// is the original, so a valid duplicate must reference a patent that ALREADY
// appeared (a lower batch index). Returns null when there's no batch or no id.
function dupMotherInfo() {
  var raw = (S.duplicateId || '').trim();
  if (!BATCH || !raw) return null;
  var motherId  = basePatentId(raw);
  var motherIdx = BATCH.ids.indexOf(motherId);
  return {
    motherId: motherId,
    motherIdx: motherIdx,
    inBatch: motherIdx > -1,
    appearedEarlier: motherIdx > -1 && motherIdx < BATCH.idx
  };
}

// Mirrors extractor.py's _normalize_for_google(): PatSeer stores US A-series
// publications with a 6-digit sequence number, but Google Patents requires
// 7 digits (zero-padded) — without this, /patent/<pid>/en 404s for every US
// patent whose Patent_ID came from PatSeer instead of GP itself.
var _US_PUBNUM_RE = /^(US)(\d{4})(\d{6})(A\d)$/;
function normalizePatentIdForGoogle(pid) {
  var m = _US_PUBNUM_RE.exec(pid);
  return m ? (m[1] + m[2] + '0' + m[3] + m[4]) : pid;
}

// Multi-architecture exports suffix the Patent_ID with "_arch{N}" on the G1/M
// rows (see recordToRows). These two helpers recover the base patent id and the
// architecture number so the batch loader can regroup a reloaded reviewed file.
function basePatentId(pid) { return String(pid == null ? '' : pid).replace(/_arch\d+$/, ''); }
function archSuffixNum(pid) { var m = /_arch(\d+)$/.exec(String(pid == null ? '' : pid)); return m ? parseInt(m[1], 10) : null; }

// Rows that belong to architecture `n`: the shared rows (T1/T2/META — no
// suffix) plus only the morphology rows tagged with that architecture number.
function rowsForArch(allRows, n) {
  return allRows.filter(function(r){
    var suf = archSuffixNum(r.Patent_ID);
    return suf == null || suf === n;
  });
}

// Ingest one patent's rows, rebuilding S.archProfiles for multi-architecture
// patents. Single-architecture files (bare Patent_IDs, incl. all ML exports)
// behave exactly as the old `ingestAI(rowsToAIData(rows))` line did, just with
// archProfiles[0] populated as a side effect.
function ingestPatentRows(rows) {
  // This is the real "we are now displaying a different patent" boundary —
  // unlike rowsToAIData() (called here per-architecture AND from transient
  // nested reads elsewhere), this only runs once per genuine patent switch.
  // FIG_ATTACHED_URL is a blob: URL keyed by fNum only, with no patent
  // identity of its own, so without clearing it here a manually-attached FIG 1
  // image on patent A "bleeds" into FIG 1 of every later patent B/C/...
  // (realFigImage() checks FIG_ATTACHED_URL before FIG_IMAGE_PATH).
