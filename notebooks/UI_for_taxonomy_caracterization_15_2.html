<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eVTOL Taxonomy Wizard v14.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F5F4F0;--bg2:#EDECE7;--surface:#fff;--border:#D6D5CF;--border2:#C4C3BB;
  --text:#1A1A18;--text2:#5A5955;--text3:#8A8985;
  --accent:#2D5BE3;--accent-bg:#EEF2FD;--accent-bdr:#B8C9F8;--accent-text:#1A3A9E;
  --ok:#1A7F4E;--ok-bg:#EAF6F0;--ok-bdr:#9FD9BC;
  --warn:#9A4F0A;--warn-bg:#FDF3E7;--warn-bdr:#F0C88A;
  --danger:#C0392B;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --r:6px;--rl:10px;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem;font-size:14px;}
/* ── Left navigation rail ─────────────────────────────────────────────────────
   A fixed left sidebar holding the batch toolbar AND the step tracker, so the
   top of the page is reserved for content. Page content is pushed right via the
   body padding. Collapses back to a normal stacked top layout on narrow screens. */
#side-rail{
  position:fixed; left:0; top:0; bottom:0; width:248px; z-index:200;
  display:flex; flex-direction:column; gap:14px;
  background:var(--surface); border-right:1px solid var(--border);
  box-shadow:1px 0 4px rgba(0,0,0,.04);
  padding:18px 14px; overflow-y:auto;
}
.rail-brand{ font-size:12px; font-family:var(--mono); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-text); line-height:1.4; }
.rail-label{ font-size:10px; font-family:var(--mono); font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin-bottom:2px; }
/* Title / subtitle / patent-counter shrink to fit the rail. */
#side-rail .wiz-h{ font-size:15px; line-height:1.2                                                                  5; margin:0; }
#side-rail .wiz-sub{ font-size:11px; line-height:1.4; margin:0; }
#side-rail #throughput{ margin:0; }
body{ padding-left:280px; }

/* Toolbar, now a clean vertical stack inside the rail. */
#batch-load-bar.side-toolbar{
  display:flex; flex-direction:column; align-items:stretch; gap:8px;
  margin:0; padding:12px; border:1px solid var(--accent-bdr); border-radius:var(--rl);
  background:var(--accent-bg);
}
#batch-load-bar.side-toolbar #batch-nav{ display:flex; flex-direction:column; align-items:stretch; gap:8px; margin-left:0 !important; }
#batch-load-bar.side-toolbar .btn{ width:100%; margin-left:0 !important; justify-content:center; }
#batch-load-bar.side-toolbar #batch-nav-label,
#batch-load-bar.side-toolbar #batch-load-status,
#batch-load-bar.side-toolbar #batch-save-status{ white-space:normal; text-align:center; }
/* Make the rail buttons read clearly as clickable: solid surface, hover lift. */
#side-rail .btn{ background:var(--surface); border:1px solid var(--border2); border-radius:8px; padding:8px 10px !important; font-size:12px; font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.04); }
#side-rail .btn:hover{ background:var(--bg); border-color:var(--accent); color:var(--accent-text); transform:translateY(-1px); box-shadow:0 3px 6px rgba(0,0,0,.07); }

/* Vertical, clickable step tracker in the rail. */
#side-rail .stepper{ flex-direction:column; align-items:stretch; overflow:visible; gap:2px; margin:0; padding:0; }
#side-rail .s-bar{ display:none; }
#side-rail .s-wrap{ flex-direction:row; align-items:center; gap:10px; min-width:0; flex:none; padding:7px 9px; border-radius:8px; cursor:pointer; transition:background .15s; }
#side-rail .s-wrap:hover{ background:var(--bg2); }
#side-rail .s-wrap.active-step{ background:var(--accent-bg); }
#side-rail .s-lbl{ max-width:none; text-align:left; font-size:12px; white-space:nowrap; }

@media (max-width:900px){
  #side-rail{ position:static; width:auto; flex-direction:column; border-right:none; box-shadow:none; padding:0 0 12px; }
  body{ padding-left:1rem; }
  #side-rail .stepper{ flex-direction:row; align-items:flex-start; overflow-x:auto; }
  #side-rail .s-bar{ display:block; }
  #side-rail .s-wrap{ flex-direction:column; flex:1; }
  #side-rail .s-lbl{ text-align:center; white-space:normal; }
}
.wiz{max-width:820px;margin:0 auto;}
/* User-cyclable wizard width (▷ #btn-width-toggle): Compact = original 820px,
   Wide = roomier for the 4-column T2 layout, Full = nearly the whole window. */
.wiz.w-wide{max-width:1200px;}
.wiz.w-full{max-width:96vw;}
/* In Wide/Full the wizard is too wide for the fixed right-margin main-figure
   panel to clear it, so drop that panel back into normal flow at the top. */
.wiz.w-wide .morph-mainfig, .wiz.w-full .morph-mainfig{position:static;width:auto;max-width:100%;max-height:none;margin:0 auto 14px;right:auto;top:auto;box-shadow:none;}
.wiz-eyebrow{font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:.3rem;}
.wiz-h{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:.2rem;}
.wiz-sub{font-size:13px;color:var(--text2);margin-bottom:0.75rem;}

/* throughput tracker */
.progress-tracker { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 4px; margin-bottom: 1.5rem; font-family: var(--mono); }
.progress-tracker input { border: none; background: transparent; color: var(--accent); font-weight: 600; width: 44px; text-align: center; font-family: var(--mono); padding: 2px 0; outline: none; border-bottom: 1px dashed var(--border2); font-size: 13px; transition: border-color 0.2s; }
.progress-tracker input:focus { border-bottom-color: var(--accent); }

/* stepper */
.stepper{display:flex;align-items:flex-start;overflow-x:auto;padding-bottom:4px;margin-bottom:1.75rem;}
.s-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:50px;}
.s-dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:var(--mono);color:var(--text3);background:var(--surface);transition:all .2s;flex-shrink:0;}
.s-dot.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.s-dot.done{background:var(--ok-bg);border-color:var(--ok-bdr);color:var(--ok);}
.s-lbl{font-size:10px;color:var(--text3);text-align:center;font-family:var(--mono);max-width:58px;line-height:1.3;}
.s-lbl.active{color:var(--accent-text);font-weight:500;}
.s-lbl.done{color:var(--ok);}
.s-bar{height:1.5px;flex:1;background:var(--border);margin-top:12px;min-width:6px;transition:background .2s;}
.s-bar.done{background:var(--ok-bdr);}

/* breadcrumb */
.bc{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem;min-height:22px;}
.crumb{font-size:11px;font-family:var(--mono);padding:2px 9px;border-radius:999px;background:var(--bg2);color:var(--text2);border:1px solid var(--border);}
.crumb.hi{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent-bdr);}
.crumb.w{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bdr);}

/* panel */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.p-module{font-size:10px;font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:.35rem;}
.p-q{font-size:17px;font-weight:600;letter-spacing:-.015em;margin-bottom:.3rem;}
.p-hint{font-size:12px;color:var(--text2);margin-bottom:1.25rem;line-height:1.55;}
.sec{font-size:12px;font-weight:500;color:var(--text2);margin:1.25rem 0 .55rem;}

/* options */
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px;margin-bottom:.25rem;}
.og.n{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));}
.opt{padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--surface);transition:all 0.15s ease;position:relative;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,0.02);}
.opt:hover{border-color:var(--text3);background:var(--bg);transform:translateY(-1px);box-shadow:0 3px 5px rgba(0,0,0,0.04);}
.opt.sel{border-color:var(--accent);background:var(--accent-bg);}
.opt.sel::after{content:'\2713';position:absolute;top:8px;right:9px;font-size:11px;color:var(--accent);font-weight:700;}
.opt.dis{opacity:.3;pointer-events:none;}
.o-id{font-size:10px;font-family:var(--mono);color:var(--text3);margin-bottom:2px;}
.opt.sel .o-id{color:var(--accent);}
.o-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.3;padding-right:16px;}
.opt.sel .o-name{color:var(--accent-text);}
.o-desc{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.45;}
.opt.sel .o-desc{color:var(--accent-text);opacity:.75;}

/* int stepper */
.irow{display:flex;align-items:center;gap:12px;margin:.75rem 0;}
.ibtn{width:36px;height:36px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:20px;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;transition:all 0.2s ease;}
.ibtn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}
.ival{font-size:22px;font-weight:600;font-family:var(--mono);min-width:40px;text-align:center;}
.ilbl{font-size:13px;color:var(--text2);font-weight:500;}

/* flags */
.flag{border-radius:var(--r);padding:10px 13px;font-size:12.5px;line-height:1.5;margin-top:.75rem;}
.flag.warn{background:var(--warn-bg);border:1px solid var(--warn-bdr);color:var(--warn);}
.flag.info{background:var(--accent-bg);border:1px solid var(--accent-bdr);color:var(--accent-text);}
.flag.skip{background:var(--bg2);border:1px solid var(--border);color:var(--text2);}
.f-lbl{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:3px;}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border);}
.btn{padding:10px 24px;border-radius:var(--r);border:1px solid var(--border2);font-size:14px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text);font-family:var(--sans);transition:all 0.2s ease;}
.btn:hover:not(:disabled){background:var(--bg2);border-color:var(--text3);transform:translateY(-1px);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:hover:not(:disabled){background:#1a45bd;border-color:#1a45bd;}
.btn.danger{background:var(--surface);border-color:var(--danger);color:var(--danger);}
.btn.danger:hover{background:#FDEDEC;}
.btn.danger.sel{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn.danger.sel:hover{background:#a12d22;}
.btn:disabled{opacity:0.4;cursor:not-allowed;background:var(--bg);}
.bgrp{display:flex;gap:12px;align-items:center;}

/* summary blocks */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sb{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;}
.sb.full{grid-column:1/-1;}
.sl{font-size:10px;font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.sv{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;}
.code{margin-top:8px;background:var(--text);border-radius:var(--r);padding:10px 14px;font-family:var(--mono);font-size:13px;color:#E8E7E0;word-break:break-all;}
.reset{font-size:12px;font-family:var(--mono);color:var(--text3);cursor:pointer;text-decoration:underline;}

.comments-wrap{margin-top:1rem;}
.comments{width:100%;min-height:96px;resize:vertical;border-radius:var(--rl);border:1px solid var(--border2);background:var(--bg);color:var(--text);font:13px/1.55 var(--sans);padding:12px 13px;}
.comments:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,91,227,.12);background:var(--surface);}

/* propulsion & structural modules */
.m2-shell, .m3-shell{display:grid;gap:12px;}
.m2-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:.2rem;}
.m2-card, .m3-card{border:1px solid var(--border);border-radius:var(--rl);background:linear-gradient(180deg,var(--surface),var(--bg));padding:14px;}
.m2-head, .m3-head{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--text);margin-bottom:4px;}
.m2-sub, .m3-sub{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px;}
.m3-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;}
.m3-field{display:flex;flex-direction:column;gap:6px;}
.m3-label{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--text3);}
.m3-num, .m3-readonly{width:100%;padding:10px 11px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);font:600 14px var(--mono);}
.m3-num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,91,227,.12);}
.m3-readonly{background:var(--bg);color:var(--accent-text);}
.m3-footnote{font-size:11px;color:var(--text2);line-height:1.45;margin-top:2px;}
.m2-zone, .m3-zone{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;}
.m2-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.m2-count-wrap{display:flex;align-items:center;gap:8px;}
.m2-count{width:92px;padding:9px 10px;border-radius:var(--r);border:1px solid var(--border2);font:600 14px var(--mono);text-align:center;}
.m2-check{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);cursor:pointer;}
.m2-kv{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:10px 0 4px;}

/* Details/Summary overrides for T1 Citations */
details.m3-readonly { cursor: pointer; transition: background 0.2s ease; overflow:hidden; }
details.m3-readonly[open] { background: var(--surface); border-color: var(--text3); }
details.m3-readonly summary { outline: none; font-weight: 600; user-select: none; display: flex; align-items: center; justify-content: space-between; margin: -10px -11px; padding: 10px 11px; font-family: var(--sans); font-size:14px; color:var(--text);}
details.m3-readonly summary::-webkit-details-marker { display: none; }
details.m3-readonly summary::after { content: '+'; font-size: 16px; font-weight: 400; color: var(--text3); font-family:var(--mono); }
details.m3-readonly[open] summary::after { content: '\2212'; }
.cite-list { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border2); font-size: 13px; font-weight: 400; line-height: 1.55; color: var(--text2); font-family: var(--sans); }
.cite-link { color: var(--accent); text-decoration: none; font-weight: 500; border-bottom: 1px dotted var(--accent); padding-bottom: 1px;}
.cite-link:hover { background: var(--accent-bg); }

/* progressive UI structures */
.g1-master-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:4px;}
.g1-master{border:1px solid var(--border);border-radius:var(--rl);background:linear-gradient(180deg,var(--surface),var(--bg));padding:14px;cursor:pointer;transition:all .18s ease;}
.g1-master:hover{border-color:var(--text3);transform:translateY(-1px);}
.g1-master.sel{border-color:var(--accent);background:var(--accent-bg);}
.g1-master-lbl{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;}
.g1-master.sel .g1-master-lbl{color:var(--accent-text);}
.g1-master-desc{font-size:12px;color:var(--text2);line-height:1.45;}
.g1-panel{display:none;opacity:0;margin-top:12px;}
.g1-panel.open{display:block;opacity:1;}
.g1-subcard{border:1px solid var(--border);border-radius:var(--rl);background:var(--surface);padding:14px;margin-bottom:10px;}
.g1-subhead{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.g1-subdesc{font-size:12px;color:var(--text2);margin-bottom:10px;}
.g1-subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;}
.g1-subbtn, .t1-scopebtn{border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:12px;text-align:left;cursor:pointer;transition:all .16s ease;width:100%;}
.g1-subbtn:hover, .t1-scopebtn:hover{border-color:var(--text3);transform:translateY(-1px);}
.g1-subbtn.sel, .t1-scopebtn.sel{border-color:var(--accent);background:var(--accent-bg);}
.g1-subid{font-size:10px;font-family:var(--mono);text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.g1-subbtn.sel .g1-subid, .g1-subbtn.sel .g1-subname, .t1-scopebtn.sel .g1-subname{color:var(--accent-text);}
.g1-subname{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.g1-subtxt{font-size:11px;color:var(--text2);}

/* T2 Image Module Layout */
.t2-split{display:flex;gap:20px;align-items:flex-start;height:calc(100vh - 220px);}
@media (max-width:768px){.t2-split{flex-direction:column; height:auto;}}
.t2-left{flex:1;min-width:280px;background:var(--bg2);padding:16px;border-radius:var(--rl);height:100%;overflow-y:auto;border:1px solid var(--border);}
.t2-right{flex:1.5;min-width:0;display:flex;flex-direction:column;gap:4px;height:100%;overflow-y:auto;padding-right:8px;}
/* 4-column T2 layout (Task B): image | thumbnails | tag group 1 | tag group 2.
   Each column scrolls independently so a long column never stretches the others. */
.t2-grid4{display:grid;grid-template-columns:1.35fr 1fr 1fr 1.05fr;gap:14px;align-items:stretch;height:calc(100vh - 200px);}
.t2-col{min-width:0;height:100%;overflow-y:auto;}
.t2-col-img{background:var(--bg2);padding:14px;border-radius:var(--rl);border:1px solid var(--border);}
.t2-col-thumbs,.t2-col-tags{padding-right:6px;}
@media (max-width:1200px){.t2-grid4{grid-template-columns:1fr 1fr;height:auto;}.t2-col{height:auto;max-height:70vh;}}
@media (max-width:768px){.t2-grid4{grid-template-columns:1fr;height:auto;}.t2-col{height:auto;max-height:none;overflow:visible;}}
/* Sticky main-figure helper on the G1/M1/M2/M3 morphology pages (Task B). On wide
   screens it floats in the empty right margin beside the 820px-wide wizard; on
   narrower screens it drops into normal flow at the top so it never overlaps. */
.morph-mainfig{position:fixed;top:88px;right:16px;width:220px;max-height:48vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:0 2px 10px rgba(0,0,0,.10);padding:10px;z-index:50;}
.morph-mainfig-lbl{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:6px;}
.morph-mainfig img{width:100%;max-height:38vh;object-fit:contain;border-radius:6px;border:1px solid var(--border);background:var(--bg2);display:block;}
@media (max-width:1300px){.morph-mainfig{position:static;width:auto;max-width:820px;max-height:none;margin:0 auto 14px;right:auto;top:auto;box-shadow:none;}.morph-mainfig img{max-height:34vh;}}
.highlight-fig{background:var(--warn-bg);color:var(--warn);font-weight:600;padding:2px 6px;border-radius:4px;border:1px solid var(--warn-bdr);display:inline-block;margin-bottom:4px;}

/* Custom Scrollbar for inner panes */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
</style>
</head>
<body>
<aside id="side-rail">
  <div class="rail-brand">eVTOL Taxonomy<br>Builder v15.0</div>
  <div id="batch-load-bar" class="side-toolbar" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--accent-bg);border:1px solid var(--accent-bdr);border-radius:var(--r);flex-wrap:wrap;">
    <span style="font-size:11px;font-family:var(--mono);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text);">Load Batch</span>
    <input type="file" id="batch-xlsx-input" accept=".xlsx" style="font-size:12px;color:var(--text2);">
    <span id="batch-load-status" style="font-size:12px;font-family:var(--mono);color:var(--text3);"></span>
    <label for="batch-resume-input" style="font-size:11px;font-family:var(--mono);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text);" title="Optional: load a previously-exported reviewed_patents_*.xlsx to restore your earlier choices on top of the ml batch above, and jump straight to the first not-yet-reviewed patent.">Resume Review</label>

// ── Cross-patent session memory (NOT wiped by fresh()) ──────────────────────
// Persists across patents within a labeling session and is rebuilt from the
// running batch Excel on load (see ingestRegistryFromRows). Two stores:
//   AIRCRAFT_REGISTRY[normName] = { display, rawNames:[...], snapshot:{...} }

//       for that aircraft, used to pre-fill same-name patents (editable copy).
//   PART_TOKENS = [...]  custom T2 part tokens added by the reviewer, surfaced
//       on every subsequent patent (so a token like "test" no longer vanishes).
var AIRCRAFT_REGISTRY = {};
var PART_TOKENS = [];
var NO_NAME_AIRCRAFT = '(No-name aircraft)';

// Custom figure edge-case tokens — same persistence model as PART_TOKENS, so a
// token added on one figure/patent is offered (via datalist) on every later one.
var EDGE_TOKENS = [];

// Duplicate-image label memory: the T2 image labels of every figure seen this
// session, keyed "PATENTID|FIGNUM". When a figure is flagged as a duplicate of
// (patent, fig), we copy that original's labels in as an editable starting point
// — the same flag-time-copy model used for same-name aircraft M1/M2/M3.
var FIGURE_LABEL_REGISTRY = {};
// T2 image-label keys copied between duplicate images (image-level only — NOT
// approve/disapprove status, which stays independent per occurrence).
var FIG_LABEL_KEYS = ['per','acSty','acCol','bgSty','bgCol','acStyOtherNote','acColOtherNote','bgStyOtherNote','bgColOtherNote','parts','edgeTags','comment','acState','tiltedInView','stateNote'];

function figRegKey(patentId, figNum) { return String(patentId||'').trim() + '|' + String(figNum||'').trim(); }

// Snapshot one figure's current T2 labels into the registry.
function registerFigureLabels(patentId, figNum) {
  var fd = S.figData[figNum]; if (!fd) return;
  var snap = {};
  FIG_LABEL_KEYS.forEach(function(k){ if (fd[k] != null) snap[k] = Array.isArray(fd[k]) ? fd[k].slice() : fd[k]; });
  // Stash this figure's architecture DINOv2 legibility rating on the registry
  // entry so a CROSS-patent duplicate of this drawing can carry it (same image
  // ⇒ same legibility). It's per-architecture (S.archDinoUnderstanding), not
  // per-figure, so look it up via this figure's arch tag. The leading "__"
  // marks it as bookkeeping, not a per-figure label — applyDuplicateFigureLabels
  // skips it when copying figure fields and applies it to the target's arch.
  var _d = (S.archDinoUnderstanding || {})[figArchOf(figNum)];
  if (_d != null) snap.__dino = _d;
  FIGURE_LABEL_REGISTRY[figRegKey(patentId, figNum)] = snap;
}

// Copy an original figure's T2 labels onto the current figure (editable copy).
// Looks first in the live current patent (same-patent duplicate, labels still in
// S.figData and not yet committed to the registry), then in the cross-patent
// registry. Never copies approve/disapprove status. Returns true on success.
function applyDuplicateFigureLabels(targetFig, originalPatent, originalFig) {
  var snap = null;
  var srcDino = null;   // source architecture's DINOv2 legibility rating, if any
  var samePatent = !originalPatent || String(originalPatent).trim() === String(T1_META.recordNumber).trim();
  if (samePatent && S.figData[originalFig]) {
    snap = {};
    var fd = S.figData[originalFig];
    FIG_LABEL_KEYS.forEach(function(k){ if (fd[k] != null) snap[k] = fd[k]; });
    // Same drawing ⇒ same DINOv2 legibility. The rating is per-architecture
    // (S.archDinoUnderstanding), so read it via the SOURCE figure's arch tag.
    srcDino = (S.archDinoUnderstanding || {})[figArchOf(originalFig)] || null;
  } else {
    snap = FIGURE_LABEL_REGISTRY[figRegKey(originalPatent, originalFig)];
    // Cross-patent: the source patent's arch rating was stashed on the registry
    // entry at registerFigureLabels() time (the "__dino" bookkeeping key).
    if (snap) srcDino = snap.__dino || null;
  }
  if (!snap || targetFig === originalFig) return false;
  Object.keys(snap).forEach(function(k){
    if (k === '__dino') return;   // bookkeeping, not a per-figure label
    figSet(targetFig, k, Array.isArray(snap[k]) ? snap[k].slice() : snap[k]);
  });
  // Carry the rating onto THIS figure's architecture (per-architecture store,
  // keyed by the TARGET figure's arch tag). Never invents one — only copies a
  // rating the source actually had, so a blank source leaves the target blank.
  if (srcDino) {
    if (!S.archDinoUnderstanding) S.archDinoUnderstanding = {};
    S.archDinoUnderstanding[figArchOf(targetFig)] = srcDino;
  }
  return true;
}

// The S keys that make up the per-aircraft M1/M2/M3 morphology snapshot. Wing
// arrays are dynamic so we capture indices 1..4 explicitly. figData / T1 triage
// / duplicate flags are intentionally excluded — those are per-patent.
function aircraftSnapshotKeys() {
  var keys = ['topType','g1Focus','wingConf','wCount','empType','empTilts','empTiltsNote','empNotes',
              'latSym','longSym','footLen','footWid','footHgt','footAmbiguous',
              'fusShape','fusKin','fusNotes','gearArch','gearNotes','wingNotes',
              'boomsPresent','boomNotes','boomXFormat','notPureArch',
              // Quick Count Override (v13) — G1/M1/M2 are per-architecture, so they
              // ride along in the same snapshot as the rest of the morphology.
              'g1_quickOverride','g1_quickNote','m1_quickOverride','m1_quickNote',
              'm2_quickOverride','m2_quickNote',
              // Human-uncertainty flag (v13) — G1/M1/M2/M3 are per-architecture too.
              'g1_humanUncertain','g1_uncertainNote','m1_humanUncertain','m1_uncertainNote',
              'm2_humanUncertain','m2_uncertainNote','m3_humanUncertain','m3_uncertainNote',
              // Shared categorical-"Other" notes (v15.3, see otherNoteInput()) —
              // per-architecture like the fields they belong to. The boom-group
              // ones ride inside boomGroups (cloneBoomGroups copies every key)
              // and the m3_*_propKinOth ones ride the generic m3_* sweep, so
              // only the flat M1/M2 ones need listing here.
              'wingConfOth','empTypeOth','fusShapeOth'];
  ['wTilt','wRole','wPosV','wPosL','wPlan','wPlanOth'].forEach(function(base){
    for (var i=1;i<=4;i++) keys.push(base+i);
  });
  // Wing Role's note key is wRole<i>Oth (field + 'Oth' — see otherNoteKey()),
  // which doesn't fit the base+index pattern above.
  for (var wi=1; wi<=4; wi++) keys.push('wRole'+wi+'Oth');
  return keys;
}

// Snapshot the current S morphology (+ all m3_* propulsion keys) for storage.
function cloneBoomGroups(arr){ return (arr || []).map(function(g){ return Object.assign({}, g, { cards: (g.cards || []).slice() }); }); }
// M3 "Quick Count Override" per-station keys (v13) — NOT m3_-prefixed (see
// m3QuickCountKeys()/m3Card()), so they need their own sweep alongside the
// generic m3_* one below to travel with the rest of a station's per-architecture data.
var M3_QUICK_KEY_RE = /^(wing[1-4]|fuselage|boom|core_layout|hull_array|emp)_(quickOverride|quickCount)$/;
function captureAircraftSnapshot() {
  var snap = {};
  aircraftSnapshotKeys().forEach(function(k){ snap[k] = S[k]; });
  // boomGroups is an array of objects — deep-copy so each architecture profile
  // keeps its own, instead of sharing one mutable array by reference.
  snap.boomGroups = cloneBoomGroups(S.boomGroups);
  Object.keys(S).forEach(function(k){ if (k.indexOf('m3_') === 0 || M3_QUICK_KEY_RE.test(k)) snap[k] = Array.isArray(S[k]) ? S[k].slice() : S[k]; });
  return snap;
}

// Apply a stored snapshot onto the current S (editable pre-fill — not a lock).
// Clears any stale m3_* keys first so a copied aircraft doesn't inherit leftover
// propulsion fields from the previous patent.
function applyAircraftSnapshot(snap) {
  if (!snap) return;
  Object.keys(S).forEach(function(k){ if (k.indexOf('m3_') === 0 || M3_QUICK_KEY_RE.test(k)) delete S[k]; });
  Object.keys(snap).forEach(function(k){ S[k] = Array.isArray(snap[k]) ? snap[k].slice() : snap[k]; });
  // Independent deep copy so editing this arch's booms never mutates the stored profile.
  S.boomGroups = cloneBoomGroups(snap.boomGroups);
}

// ── Multi-architecture profile helpers ──────────────────────────────────────
// A "profile" is the same key-set as captureAircraftSnapshot() (G1/M1/M2/M3
// morphology). archProfiles[] stores one per architecture; the flat S.* keys
// mirror whichever is active (S.curArch). These swap them in/out so the page
// renderers and validators never have to know about multi-arch.

// How many architectures this patent has: the max of the distinct architecture
// numbers the reviewer assigned to figures, the stored profile count, and any
// manual override (S.archCount). Always at least 1.
function getArchCount() {
  var maxTag = 1;
  Object.keys(S.figData || {}).forEach(function(f){
    var a = parseInt((S.figData[f] || {}).arch, 10);
    if (a > maxTag) maxTag = a;
  });
  return Math.max(1, maxTag, S.archProfiles ? S.archProfiles.length : 1, S.archCount || 1);
}

// ── Main figure is PER ARCHITECTURE ──────────────────────────────────────────
// A patent can describe several architectures; each gets its own "main figure".
// Stored as a per-figure flag (figData[fNum].isMain) — a figure already carries
// its 1-based architecture tag (figData[fNum].arch), so "main of architecture N"
// is the figure tagged N that has isMain set. This replaces the old single
// patent-level S.mainFigure.
function figArchOf(fNum){ var a = parseInt(figGet(fNum, 'arch', '1'), 10); return isNaN(a) ? 1 : a; }
// v14 (C3): the topType of a given 1-based architecture number, for T2's
// Aircraft State card — T2 (step 1) is visited BEFORE G1 (step 2), so most of
// the time no architecture has a topType yet (returns null, handled by the
// caller as "unknown — show the provisional 4-option UI"). Mirrors the live-vs-
// snapshot split every other per-architecture reader uses (see
// save-load-roundtrip-contract): the CURRENTLY ACTIVE architecture's topType
// lives in the flat S.topType; every other architecture's lives in its saved
// archProfiles[] slot (archProfiles is 0-based, arch1 is 1-based).
function topTypeOfArch(arch1) {
  if (arch1 - 1 === S.curArch) return S.topType;
  var snap = (S.archProfiles || [])[arch1 - 1];
  return snap ? snap.topType : null;
}
function mainFigureOfArch(arch1){
  var nums = Object.keys(S.figData || {});
  for (var i = 0; i < nums.length; i++){ if (figArchOf(nums[i]) === arch1 && (S.figData[nums[i]]||{}).isMain) return nums[i]; }
  return null;
}
// Set fNum as the main figure of ITS architecture, clearing any previous main in
// that same architecture (other architectures' mains are untouched).
function setMainFigure(fNum){
  if (!fNum) return;
  var a = figArchOf(fNum);
  Object.keys(S.figData || {}).forEach(function(f){
    if (f !== fNum && figArchOf(f) === a && (S.figData[f]||{}).isMain) figSet(f, 'isMain', false);
  });
  figSet(fNum, 'isMain', true);
}

// Save the flat S.* morphology keys into archProfiles[curArch].
function saveCurArchProfile() {
  if (!S.archProfiles) S.archProfiles = [];
  S.archProfiles[S.curArch] = captureAircraftSnapshot();
}

// Make architecture `idx` (0-based) the active one: stash the current flat keys
// back to their slot, then load idx's stored profile into the flat keys (or a
// blank morphology if that arch hasn't been visited yet). m3_* keys are cleared
// by applyAircraftSnapshot so one arch never inherits another's propulsion rows.
function loadArchProfile(idx) {
  if (!S.archProfiles) S.archProfiles = [];
  // Always stash current edits into their slot first, even when idx === S.curArch.
  // Callers sometimes force S.curArch = idx right before calling this (e.g. the
  // T2 "Next" handler re-entering architecture 1 every time), which used to make
  // this look like "already on this slot" and skip the save — so live, unsaved
  // M1/M2/M3 edits got clobbered by the last-saved (stale) snapshot the moment
  // the reviewer went back to T1/T2 and forward again. Saving is cheap/idempotent.
  saveCurArchProfile();
  S.curArch = idx;
  var prof = S.archProfiles[idx];
  if (prof) {
    applyAircraftSnapshot(prof);
  } else {
    // blank slate for a not-yet-edited architecture: reset just the morphology
    // keys to their fresh() defaults so the previous arch's answers don't bleed in
    var blank = fresh();
    Object.keys(S).forEach(function(k){ if (k.indexOf('m3_') === 0 || M3_QUICK_KEY_RE.test(k)) delete S[k]; });
    aircraftSnapshotKeys().forEach(function(k){ S[k] = blank[k]; });
    saveCurArchProfile();
  }
}

// Record this patent's aircraft name + morphology snapshot into the registry.
function registerAircraft(rawName) {
  var disp = normalizeAircraftName(rawName);
  if (!disp || disp === NO_NAME_AIRCRAFT) return;            // don't register the no-name bucket
  var key = disp.toLowerCase();
  if (!AIRCRAFT_REGISTRY[key]) AIRCRAFT_REGISTRY[key] = { display: disp, rawNames: [], snapshot: null };
  if (AIRCRAFT_REGISTRY[key].rawNames.indexOf(rawName) === -1) AIRCRAFT_REGISTRY[key].rawNames.push(rawName);
  AIRCRAFT_REGISTRY[key].snapshot = captureAircraftSnapshot();   // latest wins
}

// Fuzzy lookup: exact normalized match first, then a lightweight near-match
// (case/space-insensitive prefix or small edit distance) so minor spelling
// variants resolve to the same aircraft. Returns the registry entry or null.
function lookupAircraft(rawName) {
  var disp = normalizeAircraftName(rawName);
  if (!disp || disp === NO_NAME_AIRCRAFT) return null;
  var key = disp.toLowerCase();
  if (AIRCRAFT_REGISTRY[key]) return AIRCRAFT_REGISTRY[key];
  // fuzzy: compare the de-spaced lowercase forms
  var probe = key.replace(/\s+/g,'');
  var best = null, bestD = 1e9;
  Object.keys(AIRCRAFT_REGISTRY).forEach(function(k){
    var cand = k.replace(/\s+/g,'');
    var d = _editDistance(probe, cand);
    // accept if identical de-spaced, or within a small distance relative to length
    if (d < bestD && d <= Math.max(1, Math.floor(Math.min(probe.length,cand.length)*0.15))) { bestD = d; best = AIRCRAFT_REGISTRY[k]; }
  });
  return best;
}

function _editDistance(a, b) {
  if (a === b) return 0;
  var m=a.length, n=b.length, dp=[]; for(var i=0;i<=m;i++) dp[i]=[i];
  for(var j=1;j<=n;j++) dp[0][j]=j;
  for(i=1;i<=m;i++) for(j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}

// Seed the aircraft-name registry from a freshly-loaded batch Excel (byId:
// {patentId: [rowObjects]}). Registers any aircraftName already present so it
// shows up as a suggestion immediately. Snapshots (M1/M2/M3) are NOT rebuilt
// here — they accumulate as each patent is reviewed & committed this session.
function ingestRegistryFromRows(byId) {
  Object.keys(byId || {}).forEach(function(pid){
    var nameRow = (byId[pid]||[]).find(function(r){ return r.Field === 'aircraftName'; });
    var nm = nameRow && nameRow.Value != null ? String(nameRow.Value).trim() : '';
    if (!nm) return;
    var disp = normalizeAircraftName(nm), key = disp.toLowerCase();
    if (disp === NO_NAME_AIRCRAFT) return;
    if (!AIRCRAFT_REGISTRY[key]) AIRCRAFT_REGISTRY[key] = { display: disp, rawNames: [], snapshot: null };
    if (AIRCRAFT_REGISTRY[key].rawNames.indexOf(nm) === -1) AIRCRAFT_REGISTRY[key].rawNames.push(nm);
  });
}

// Look up the aircraft / prototype name recorded for another patent id, so a
// flagged duplicate can inherit it. Prefers the human-reviewed rows
// (REVIEWED_ROWS, latest wins), falling back to the batch's ML-predicted rows.
// Returns '' when the referenced patent has no aircraft name on record.
function aircraftNameForPatent(pid) {
  var want = basePatentId(String(pid == null ? '' : pid).trim());
  if (!want) return '';
  var found = '';
  (REVIEWED_ROWS || []).forEach(function(r){
    if (r && r.Field === 'aircraftName' && basePatentId(r.Patent_ID) === want
        && r.Value != null && String(r.Value).trim()) {
      found = String(r.Value).trim();   // keep scanning: last (latest committed) wins
    }
  });
  if (!found && BATCH && BATCH.byId && BATCH.byId[want]) {
    var row = BATCH.byId[want].find(function(r){ return r.Field === 'aircraftName'; });
    if (row && row.Value != null && String(row.Value).trim()) found = String(row.Value).trim();
  }
  return found;
}

// When a patent is flagged as a Same-Aircraft (type 1) or Exact-Duplicate
// (type 2) duplicate of another patent, pull that original's aircraft name onto
// this patent's name line immediately — so the reviewer doesn't have to retype
// it. Only fills when the name field is empty or still holds a name WE
// auto-filled before (never clobbers a hand-typed name). Returns true if it set
// a name. Morphology is intentionally left to the explicit "Copy M1–M3 (+G1)"
// button (which also gates type-1 export via duplicateCopiedId).
function autofillDuplicateAircraftName() {
  if (!S.isDuplicate) return false;
  if (S.duplicateType !== '1' && S.duplicateType !== '2') return false;
  var dupId = (S.duplicateId || '').trim();
  if (!dupId) return false;
  var nm = aircraftNameForPatent(dupId);
  if (!nm) return false;
  var disp = normalizeAircraftName(nm);
  if (!disp || disp === NO_NAME_AIRCRAFT) return false;
  // A flagged duplicate inherits the ORIGINAL patent's aircraft name, so
  // overwrite whatever is currently in the box (typically an ML-predicted
  // name). Skip only when it already matches, to avoid a redundant re-render.
  if ((T1_META.aircraftName || '').trim() === disp) return false;
  T1_META.aircraftName = disp;
  S._dupAutoName = disp;
  return true;
}

// {assigneeKey: {display, patentIds: [...]}} — built once per batch load so
// T1 can show "this applicant appears in N patents in this batch" (helps the
// reviewer judge whether it's worth naming the aircraft/prototype: a one-off
// applicant rarely has a named program, a repeat player like Beta/Airbus/
// Honda often does). Keyed loosely (trimmed+lowercased) so minor formatting
// differences in the PatSeer export still group together.
var ASSIGNEE_GROUPS = {};
function buildAssigneeGroups(byId) {
  ASSIGNEE_GROUPS = {};
  Object.keys(byId || {}).forEach(function(pid){
    var row = (byId[pid]||[]).find(function(r){ return r.Field === 'assignee'; });
    var raw = row && row.Value != null ? String(row.Value).trim() : '';
    if (!raw) return;
    var key = raw.toLowerCase();
    if (!ASSIGNEE_GROUPS[key]) ASSIGNEE_GROUPS[key] = { display: raw, patentIds: [] };
    if (ASSIGNEE_GROUPS[key].patentIds.indexOf(pid) === -1) ASSIGNEE_GROUPS[key].patentIds.push(pid);
  });
}
// Returns {count, isRepeat, otherIds} for the assignee string on the CURRENT
// patent (T1_META.assignee), or null when there's no assignee to look up.
function lookupAssigneeGroup(assignee) {
  var raw = (assignee || '').trim();
  if (!raw) return null;
  var g = ASSIGNEE_GROUPS[raw.toLowerCase()];
  if (!g) return null;
  return { count: g.patentIds.length, isRepeat: g.patentIds.length > 1,
           otherIds: g.patentIds.filter(function(id){ return id !== T1_META.recordNumber; }) };
}

// Fills the <datalist> backing the "Jump: ID / # / applicant" input with every
// patent ID and applicant/assignee name in the loaded batch, so the browser's
// native autocomplete surfaces matches as the reviewer types (no custom
// dropdown code needed). Re-run on every batch load/resume-restore.
function populateJumpDatalist() {
  var dl = document.getElementById('batch-jump-list');
  if (!dl || !BATCH) return;
  var seen = {};
  var html = '';
  BATCH.ids.forEach(function(pid){
    if (seen[pid]) return; seen[pid] = true;
    html += '<option value="' + escHtml(pid) + '">';
  });
  Object.keys(ASSIGNEE_GROUPS).forEach(function(key){
    var disp = ASSIGNEE_GROUPS[key].display;
    if (seen[disp]) return; seen[disp] = true;
    html += '<option value="' + escHtml(disp) + '">';
  });
  dl.innerHTML = html;
}

// Resolves the free-text "Jump" box to a patent and navigates to it. Tries,
// in order: (1) exact/prefix patent-ID match (case-insensitive — reviewers may
// type "3594113" without the "EP" country prefix); (2) a bare batch position
// number ("39" or "#39"), 1-indexed to match the "Patent N / total" label;
// (3) an applicant/assignee substring match, landing on the first patent for
// that applicant (and reporting how many others share it, since one applicant
// can span several patents in the batch).
function jumpToPatentQuery(raw) {
  var status = document.getElementById('batch-jump-status');
  var q = String(raw || '').trim();
  if (!BATCH || !q) { if (status) status.textContent = ''; return; }
  var qLower = q.toLowerCase();

  // (1) Patent ID — exact match first, then prefix match (so "3594113" finds
  // "EP3594113A1" etc).
  var idIdx = BATCH.ids.findIndex(function(pid){ return pid.toLowerCase() === qLower; });
  if (idIdx === -1) idIdx = BATCH.ids.findIndex(function(pid){ return pid.toLowerCase().indexOf(qLower) === 0; });
  if (idIdx === -1) idIdx = BATCH.ids.findIndex(function(pid){ return pid.toLowerCase().indexOf(qLower) > -1; });
  if (idIdx > -1) {
    if (status) status.textContent = '';
    loadBatchPatent(idIdx);
    return;
  }

  // (2) Bare batch position number, e.g. "39" or "#39" (1-indexed).
  var numMatch = /^#?(\d+)$/.exec(q);
  if (numMatch) {
    var n = parseInt(numMatch[1], 10);
    if (n >= 1 && n <= BATCH.ids.length) {
      if (status) status.textContent = '';
      loadBatchPatent(n - 1);
      return;
    }
    if (status) status.textContent = ' Out of range (1-' + BATCH.ids.length + ').';
    return;
  }

  // (3) Applicant / assignee name — substring match against the grouped
  // display names built by buildAssigneeGroups().
  var matchKey = Object.keys(ASSIGNEE_GROUPS).find(function(key){ return key.indexOf(qLower) > -1; });
  if (matchKey) {
    var grp = ASSIGNEE_GROUPS[matchKey];
    var firstIdx = BATCH.ids.indexOf(grp.patentIds[0]);
    if (firstIdx > -1) {
      if (status) status.textContent = grp.patentIds.length > 1
        ? ' ' + grp.display + ': ' + grp.patentIds.length + ' patent(s) in batch — showing first.'
        : '';
      loadBatchPatent(firstIdx);
      return;
    }
  }

  if (status) status.textContent = ' No match for "' + q + '".';
}

// FigData Accessors
function figGet(fNum, key, fallback) {
  var d = S.figData[fNum];
  if (!d && key === 'status') return 'disapproved';
  return (d && d[key] != null) ? d[key] : (fallback !== undefined ? fallback : null);
}
function figSet(fNum, key, val) {
  if (!S.figData[fNum]) S.figData[fNum] = {}; S.figData[fNum][key] = val;
}

function isWinged() { return ['TW','TP','DS','CVT','TB','PTC','SLC','SRW'].indexOf(S.topType)>-1; }
// v14 (C3/PR-04,05): the CONVERTIBLE/FIXED split for per-figure Aircraft State.
// CONVERTIBLE = mechanism reorients between hover and cruise, so a figure's state
// is a real, per-drawing question (Hover/Transition/Cruise/Other). FIXED = the
// airframe never changes shape, so hover and cruise are literally the same
// drawing — the question isn't asked (see pageT2 / applyStateArchLock). This is
// an EXHAUSTIVE 6+6 split of every id in TOP (verified against TOP above); if a
// new topType is ever added to TOP, it must be added to one list or the other or
// pageT2's Aircraft State card will silently fall back to the provisional
// (unknown-topType) 4-option UI, same as during T1/T2 before G1 is visited.
function isConvertibleArch(topType) { return ['TW','TP','DS','CVT','TB','PTC'].indexOf(topType) > -1; }
// Novel / Other architectures (Hoverbikes, PFVs) don't map to the winged/wingless
// structured morphology, so M1/M2/M3 render as free-text commentary instead.
function isOtherArch() { return S.g1Focus === 'other' || ['HB','PFV'].indexOf(S.topType) > -1; }
function isIndependentThrust() { return ['SLC','SRW'].indexOf(S.topType)>-1; }
function curSID(){ return STEPS[S.step].id; }

// Returns an array of human-readable reasons the "Next" button is disabled for
// the current step. Empty array → ready to advance. canGo() is a thin wrapper
// so the nav bar can show *why* the user is blocked (single source of truth).
function nextBlockers(){
  var sid=curSID(), b=[];
  if(sid=='t1') {
    var ubT1 = uncertainBlocker('t1', 'T1'); if (ubT1) b.push(ubT1);
    var qnT1 = quickNoteBlocker('t1', 'T1'); if (qnT1) b.push(qnT1);
    if (S.isApproved === null) { b.push('Approve or Disapprove this patent'); return b; }
    if (S.isApproved === false) {
      if (!S.t1DisapproveReason) b.push('Pick a disapproval reason');
      else if (S.t1DisapproveReason === 'Other' && !(S.t1DisapproveOther||'').trim()) b.push('Describe the "Other" disapproval reason');
      return b;
    }
    // Aircraft-name gate: an APPROVED patent may not advance with the name box
    // simply untouched — the reviewer must either type/pick a name or explicitly
    // choose "(No-name aircraft)" (tracked via t1NoNameConfirmed, since the
    // No-name pick deliberately stores an empty aircraftName). Disapproved
    // patents never reach here (early return above) — no name needed for those.
    if (!(T1_META.aircraftName || '').trim() && !S.t1NoNameConfirmed) {
      b.push('Enter the aircraft/prototype name (or pick "(No-name aircraft)")');
    }
    // Approved patents get default scope/field/target from the approve handler,
    // so approval alone is enough to advance.
    return b;
  }
  if(sid=='t2') {
    // A figure counts as "done" when it's been labeled and approved. Disapproved
    // figures are exempt (you don't fully label images you've rejected). At least
    // one approved+labeled figure is required to advance.
    var figs = Object.keys(S.figData);
    var approvedFigs = figs.filter(function(f){ return S.figData[f].status === 'approved'; });
    if (approvedFigs.length === 0) {
      b.push('Approve at least one figure (✓ on the figure card)');
    } else {
      // Completeness enforcement (2026-07-02): EVERY approved figure must be fully
      // labeled — previously only ONE fully-labeled approved figure was required,
      // so a second approved figure with gaps slipped through silently. Also now
      // required per approved figure: Present Structural Elements (parts — auto-
      // defaulted to "Whole Vehicle Layout" on load, but single-select mode lets
      // it be clicked-to-clear) and Flight configuration shown (acState — starts
      // null; the parts≠Whole-Vehicle rule auto-fills "NonApplicable", so this
      // only costs a click on whole-vehicle figures). Disapproved figures stay
      // exempt. Name the first offending figure so the reviewer can find it.
      for (var afi = 0; afi < approvedFigs.length; afi++) {
        var fA = approvedFigs[afi], fdA = S.figData[fA];
        var miss = [];
        if (!fdA.per)   miss.push('Perspective');
        if (!fdA.acSty) miss.push('Rendering Style');
        if (!fdA.acCol) miss.push('Rendering Color');
        if (!fdA.bgSty) miss.push('Background Style');
        if (!fdA.bgCol) miss.push('Background Color');
        if (!(fdA.parts || []).length) miss.push('Structural Elements');
        if (!fdA.acState) miss.push('Flight configuration shown');
        // v15.2: categorical "Other" pattern — a paired free-text note is
        // mandatory whenever "Other" is picked (same rule as t1DisapproveOther/
        // wPlanOth elsewhere in the wizard).
        if (fdA.acSty === 'Other' && !(fdA.acStyOtherNote||'').trim()) miss.push('Rendering Style "Other" detail');
        if (fdA.acCol === 'Other' && !(fdA.acColOtherNote||'').trim()) miss.push('Rendering Color "Other" detail');
        if (fdA.bgSty === 'Other' && !(fdA.bgStyOtherNote||'').trim()) miss.push('Background Style "Other" detail');
        if (fdA.bgCol === 'Other' && !(fdA.bgColOtherNote||'').trim()) miss.push('Background Color "Other" detail');
        if (miss.length) { b.push('FIG. ' + fA + ' needs: ' + miss.join(', ')); break; }
      }
    }
    // Per-architecture recognition-sufficiency rating (internal id/state key
    // unchanged: archDinoUnderstanding) — required for EVERY architecture
    // before leaving T2 (2026-07-02): it was never enforced, so arch ratings
    // (especially arch 2+) silently exported as null. Same per-architecture
    // loop pattern as the main-image check below.
    var noDino = [];
    for (var di = 1; di <= getArchCount(); di++) {
      if (!(S.archDinoUnderstanding || {})[di]) noDino.push(di);
    }
    if (noDino.length) {
      b.push((getArchCount() > 1 ? ('Architecture ' + noDino.join(', ') + ': ') : '')
        + 'rate the Projected Recognition Sufficiency');
    }
    // Every architecture must have a designated main image before leaving T2 —
    // the morphology pages (and the export) anchor each architecture to its main
    // figure, so an architecture with no main can't be carried forward. Name the
    // architectures still missing one (mainFigureOfArch returns null for those).
    var noMain = [];
    for (var ai = 1; ai <= getArchCount(); ai++) {
      if (!mainFigureOfArch(ai)) noMain.push(ai);
    }
    if (noMain.length) {
      b.push((getArchCount() > 1 ? ('Architecture ' + noMain.join(', ') + ': ') : '')
        + 'set a main image (★ Set as Main Figure)');
    }
    return b;
  }
  if(sid=='gate') {
    var ubG1 = uncertainBlocker('g1', 'G1'); if (ubG1) b.push(ubG1);
    var qnG1 = quickNoteBlocker('g1', 'G1'); if (qnG1) b.push(qnG1);
    if (S.g1_quickOverride) return b;   // Quick Count Override: architecture selection bypassed (note required above)
    if(!S.topType) b.push('Select an architecture topology');
    return b;
  }
  if(sid=='m1') {
    var ubM1 = uncertainBlocker('m1', 'M1'); if (ubM1) b.push(ubM1);
    var qnM1 = quickNoteBlocker('m1', 'M1'); if (qnM1) b.push(qnM1);
    if (isOtherArch()) return b;   // Novel/Other: M1 is free-text commentary, nothing required
    if (S.m1_quickOverride) return b;   // Quick Count Override: detail fields bypassed (note required above)
    // Booms present/boom counts pairing (rule 5) — independent of the footprint-
    // bypass gate below, so it isn't silently skipped by footAmbiguous's default.
    // Completeness enforcement (2026-07-02): a boom group's geometry fields
    // (attachment, positions, orientation, carries-propulsors — and wing
    // coverage when wing-attached) were never required, so a counted group
    // could pass with everything else blank. Now each declared group must be
    // fully described. hasProps is a yes/no toggle → require an ANSWER
    // (non-null), not "yes".
    if (S.boomsPresent) {
      (S.boomGroups || []).forEach(function(g, i){
        var gm = [];
        if (!g.count || g.count <= 0) gm.push('count');
        if (!g.attach)                gm.push('attachment');
        if ((g.attach === 'Wings' || g.attach === 'Both') && !g.wingSpan) gm.push('wing coverage');
        if (!g.span)                  gm.push('spanwise position');
        if (!g.long)                  gm.push('longitudinal position');
        if (!g.orient)                gm.push('orientation');
        if (g.hasProps == null)       gm.push('carries propulsors?');
        // v15.3: every 'Other' pick needs its paired note (see otherNoteInput).
        [['attach','attachment'],['span','spanwise position'],['long','longitudinal position'],['orient','orientation']]
          .forEach(function(pair){ var ob = otherBlocker(pair[0], pair[1], i); if (ob) gm.push(ob); });
        if (gm.length) b.push('Boom Group ' + (i + 1) + ' — ' + gm.join(', '));
      });
    }
    // Bug fix: footAmbiguous (defaults to true — see fresh() state) used to
    // `return b` here, which skipped fusShape/fusKin/gearArch too — three
    // fields with nothing to do with footprint dimensions. That let a
    // reviewer click Next on M1 having never touched Fuselage Incidence
    // Mechanics (or Fuselage Shape / Landing Gear), because the DEFAULT state
    // already satisfied this early return. Now the bypass only exempts the
    // footprint-dimension check itself; the other three fields are always
    // required regardless of footAmbiguous.
    if (!S.footAmbiguous && (!S.footLen || !S.footWid || !S.footHgt)) {
      b.push('Enter footprint dimensions (or Bypass)');
    }
    if (!S.fusShape) b.push('Fuselage shape');
    // v15.3: FUS_SHAPE's new 'Other' needs its paired note.
    else { var _fsOth = otherBlocker('fusShape', 'Fuselage shape'); if (_fsOth) b.push(_fsOth); }
    if (!S.fusKin)   b.push('Fuselage kinematics');
    if (!S.gearArch) b.push('Landing gear architecture');
    return b;
  }
  if(sid=='m2') {
     var ubM2 = uncertainBlocker('m2', 'M2'); if (ubM2) b.push(ubM2);
     var qnM2 = quickNoteBlocker('m2', 'M2'); if (qnM2) b.push(qnM2);
     if (isOtherArch()) return b;   // Novel/Other: M2 is free-text commentary, nothing required
     if (S.m2_quickOverride) return b;   // Quick Count Override: detail fields bypassed (note required above)
     if (isWinged()) {
        if (!S.wingConf) { b.push('Wing configuration'); }
        // Integrated hulls (BWB/FW/LB) bypass the per-panel loop below (no
        // discrete panels to count), but their single overall planform IS still
        // recorded (wPlan1) — it was never required (2026-07-02 completeness
        // enforcement), so integrated-hull patents exported a blank planform.
        else if (['BWB','FW','LB'].indexOf(S.wingConf) > -1) {
          if (!S.wPlan1) b.push('Integrated-hull planform (Wing 1)');
          else if (S.wPlan1 === 'Oth' && !(S.wPlanOth1||'').trim()) b.push('Integrated-hull planform "Other" detail');
        }
        else if (S.wingConf == 'W' || S.wingConf == 'Oth') {
          // Wing count pairing (rule 5): a panelled config implies at least one
          // wing panel — wCount must actually be set, not silently left at 0.
          if (!S.wCount || S.wCount < 1) { b.push('Wing count'); }
          else {
            for (var i = 1; i <= S.wCount; i++) {
              if (!S['wTilt' + i] || !S['wPosV' + i] || !S['wPosL' + i] || !S['wPlan' + i]) { b.push('Wing ' + i + ' position/planform'); }
              else if (i > 1 && !S['wRole' + i]) { b.push('Wing ' + i + ' role'); }
              else if (S['wPlan' + i] === 'Oth' && !(S['wPlanOth' + i]||'').trim()) { b.push('Wing ' + i + ' planform "Other" detail'); }
              // v15.3: Wing Role's 'Other' needs its paired note (checked
              // separately from the chain above so it can't be masked by it).
              var _wrOth = otherBlocker(wingField('wRole', i), 'Wing ' + i + ' role'); if (_wrOth) b.push(_wrOth);
            }
          }
        }
        // v15.3: Wing Architecture's 'Oth' needs its paired note.
        var _wcOth = otherBlocker('wingConf', 'Wing Architecture'); if (_wcOth) b.push(_wcOth);
        // v14 (C7.3): TW (Tilt Wing) requires wing panels actually set to Tilt
        // — wTilt1 is auto-defaulted to 'Tilt' when TW is picked
        // (see the g1-subbtn handler / ingestAI G1 block), but nothing stopped
        // the reviewer from then setting every wing back to Fixed. Block M2
        // completion in that case; the tilting wing is the whole point of TW.
        if (S.topType === 'TW') {
          // v15.3: TW requires EVERY wing panel to tilt, not just one. A mix of tilting and
          // fixed wings is CVT by definition (codebook lock L5), so the old "at least one"
          // test let real CVT aircraft through as TW.
          var _allWingsTilt = (S.wCount||0) > 0;
          for (var _wi = 1; _wi <= (S.wCount||0); _wi++) { if (S['wTilt' + _wi] !== 'Tilt') _allWingsTilt = false; }
          if (!_allWingsTilt) b.push('Tilt Wing (TW) requires every wing to be set to Tilt — a mix of tilting and fixed wings is CVT, not TW');
        }
     }
     if (!S.empType) b.push('Empennage type');
     // v14 (C4): empKin's "must pick one of 3 options" gate retired along with
     // the field itself — Fixed is now the silent default (nothing to enter).
     // The only remaining requirement: if "Empennage tilts (exception)" is
     // ticked, its note is mandatory (mirrors quickNoteBlocker/uncertainBlocker).
     else if (S.empTilts && !(S.empTiltsNote||'').trim()) b.push('Describe the empennage tilt mechanism (required when "Empennage tilts" is ticked)');
     // v15.3: Empennage Type's 'Oth' needs its paired note.
     var _etOth = otherBlocker('empType', 'Empennage type'); if (_etOth) b.push(_etOth);
     return b;
  }
  if(sid=='m3') {
    var ubM3 = uncertainBlocker('m3', 'M3'); if (ubM3) b.push(ubM3);
    if (isOtherArch()) return b;
    // Per-station propulsor count pairing (rule 5): Quick Count Override stations
    // require their total count; non-override multi-type stations require each
    // declared type to carry its own count (previously unchecked — a type could be
    // declared with chord/orient/bmech/rmech set but count left at 0).
    m3Blueprints().forEach(function(bp){
      if (S[bp.key + '_quickOverride']) {
        var qc = S[bp.key + '_quickCount'];
        if (qc == null || qc === '') b.push(bp.title.replace(/\s*\[.*?\]/g, '') + ' — enter total propulsor count');
        return;
      }
      var nT = m3NTypes(bp.key);
      if (nT > 1) {
        for (var t = 1; t <= nT; t++) {
          if (m3Count(m3TypeKey(bp.key, t)) <= 0) b.push(bp.title.replace(/\s*\[.*?\]/g, '') + ' Type ' + t + ' — enter a count');
        }
      }
    });
    // v14 (C7.2): CVT ("Combined Thrust") must actually show a mix, per its own
    // G1 description — either (a) independent Fixed lift rotors AND Tilt cruise
    // propulsors, or (b) the "ambiguous dual-rotation" case: a tilting wing
    // PLUS an independently tilting rotor/propulsor. Both cases require at
    // least one Tilt propulsor somewhere; case (a) additionally needs a Fixed
    // one, case (b) a tilting wing instead. Checked here (not m3Ready(), which
    // just gates "propulsion fields complete") so the message is specific.
    if (S.topType === 'CVT') {
      var _hasFixedPK = false, _hasTiltPK = false;
      m3Blueprints().forEach(function(bp){
        var nTc = m3NTypes(bp.key);
        for (var tc = 1; tc <= nTc; tc++) {
          var tkc = nTc <= 1 ? bp.key : m3TypeKey(bp.key, tc);
          var pkc = m3Get(tkc, 'propKin');
          if (pkc === 'Fixed') _hasFixedPK = true;
          if (pkc === 'Tilt')  _hasTiltPK  = true;
        }
      });
      var _hasWingTilt = false;
      for (var _wic = 1; _wic <= (S.wCount||0); _wic++) { if (S['wTilt' + _wic] === 'Tilt') _hasWingTilt = true; }
      if (!(_hasTiltPK && (_hasFixedPK || _hasWingTilt))) {
        b.push('Combined Thrust (CVT) requires a mix: a Fixed + a Tilt propulsor across cards, OR a tilting wing combined with an independently tilting rotor/propulsor');
      }
    }
    // v15.3: PROP_KIN's new 'Other' needs its paired note, on every declared
    // propeller type. Skipped when the architecture lock is on — a locked card
    // can only be Fixed, so 'Other' is unreachable there (see m3Card).
    if (!propKinLock(S.topType)) {
      m3Blueprints().forEach(function(bp){
        if (S[bp.key + '_quickOverride']) return;
        var nTo = m3NTypes(bp.key);
        for (var to = 1; to <= nTo; to++) {
          var tko = nTo <= 1 ? bp.key : m3TypeKey(bp.key, to);
          var obk = otherBlocker(m3Field(tko, 'propKin'), bp.title.replace(/\s*\[.*?\]/g, '') + (nTo > 1 ? ' Type ' + to : '') + ' articulation');
          if (obk) b.push(obk);
        }
      });
    }
    if(!m3Ready()) b.push('Complete propulsion fields for each active component');
    return b;
  }
  return b;
}

function canGo(){ return nextBlockers().length === 0; }

function buildLbl() {
  var p=[];
  if(S.t1Scope) p.push(S.t1Scope.replace(/\s+/g, ''));
  if(S.topType) p.push(S.topType);
  if(isWinged() && S.wingConf) p.push(S.wingConf + (S.wingConf=='W'?'\u00d7'+S.wCount:''));
  if (isWinged() && (S.wingConf == 'W' || S.wingConf == 'Oth')) {
    for (var i = 1; i <= S.wCount; i++) {
      if (S['wPosV' + i] || S['wPosL' + i] || S['wPlan' + i]) {
        var wParts = [S['wTilt' + i]==='Tilt'?'T':'F', S['wPosV' + i], S['wPosL' + i], S['wPlan' + i] === 'Oth' ? 'Oth' : S['wPlan' + i]];
        if (i > 1 && S['wRole' + i]) wParts.unshift(S['wRole' + i]);
        p.push('W' + i + ':' + wParts.filter(Boolean).join('-'));
      }
    }
  }
  if(S.empType) p.push(S.empType.split(' ')[0]);
  if(S.fusShape) p.push('FUS:'+S.fusShape);
  if(S.latSym) p.push('LSYM');
  if(S.longSym) p.push('FSYM');
  
  var activeBlueprints = m3Blueprints();
  activeBlueprints.forEach(function(bp){
    var cnt = m3CardCount(bp.key);
    if(cnt > 0) p.push(bp.key.toUpperCase()+'x'+cnt);
  });
  return p.join('_');
}

function m3Field(key, suffix) { return 'm3_' + key + '_' + suffix; }
// ── Architecture physics locks (M3 Propulsor Articulation) ──────────────────
// Single source of truth for the approved physics matrix: which architectures
// FIX how the propulsor articulates vs leave it free. Used by the M3 render
// (m3Card), the lock-application points (ingestAI / topType click) and the
// export (buildMorphologyObj) so the three never drift.
//   TW/DS/SLC/SRW/MR/TB/PTC/RC → Fixed (nothing articulates independently)
//   (v15.3: RC moved into the Fixed group — the retired 'Cyclic' option it used
//    to lock to no longer exists. See propKinLockReason('RC').)
//   TP, CVT (and anything else) → null = reviewer is free
// TP is intentionally NOT locked to Tilt: real tilt-propeller aircraft commonly
// carry a mix of tilting cruise props and fixed lift rotors, so articulation is
// recorded per propulsor (and per propeller type) rather than forced. The wing
// itself still stays fixed on TP — that lock lives in the M2 wing-tilt block.
// TB (tailsitter) is Fixed for the same reason as TW: the propulsors are bolted
// to the airframe and never move relative to it — it's the WHOLE BODY (wing +
// fuselage together) that reorients between hover and cruise, not the propulsor.
// DS (deflected slipstream, v14/C7.5) is Fixed: thrust is redirected by large
// structural flaps deflecting the slipstream, not by the propulsor articulating.
function propKinLock(topType){
  if (['TW','DS','SLC','SRW','MR','TB','PTC','RC'].indexOf(topType) > -1) return 'Fixed';
  return null;
}
function applyPropKinLock(){
  var locked = propKinLock(S.topType);
  if (!locked) return;
  ['core_layout','hull_array','fuselage','emp','wing1','wing2','wing3','wing4'].forEach(function(k){
    S[m3Field(k,'propKin')] = locked;
  });
}
function propKinLockReason(topType){
  return ({
    TW:'the rotors are fixed to the wing — the wing tilts, the rotors do not tilt on their own (if they did, it would be CVT)',
    TB:'the rotors are fixed to the airframe — the whole body (wing + fuselage) rotates between hover and cruise, the rotors do not tilt on their own',
    PTC:'the rotors are fixed to the airframe — the vehicle pitches forward as a whole (multirotor-style) to gain cruise speed while the wing offloads the rotors; nothing articulates',
    DS:'thrust is redirected by large structural flaps deflecting the slipstream — the propulsors themselves never articulate',
    SLC:'separate fixed lift and fixed cruise units — nothing tilts',
    SRW:'the rotor stops and locks for cruise rather than tilting',
    MR:'distributed fixed rotors — thrust is set by RPM, not articulation',
    RC:'a helicopter main rotor sets thrust by cyclic and collective through the swashplate, but the rotor unit does not pivot relative to its mast — at drawing level it is Fixed. Note the rotor type in the comment if it is visible'
  })[topType] || '';
}
// v14 (C7.4): TB (tailsitter) fuselage kinematics are locked to TiltBody — the
// whole airframe (fuselage + wing together) reorients between hover and cruise
// as one rigid unit, which is definitionally "Tilting Body" (see FUS_KIN /
// pageM1's Fuselage Incidence Mechanics tooltip, R-06). Mirrors applyPropKinLock
// in shape and call sites (ingestAI G1 block + the g1-subbtn click handler) —
// same "single source of truth, reapplied on every load/click" style, since this
// is a physics fact, not reviewer-editable data to preserve historically.
function applyFusKinLock(){
  if (S.topType === 'TB') S.fusKin = 'TiltBody';
}
// Short, human label for a topType — used by the unified physics-lock banner.
function archShort(topType){
  return ({TW:'Tilt Wing',TP:'Tilt Propulsors',DS:'Deflected Slipstream',CVT:'Combined Thrust',
    TB:'Tilt Body (Tailsitter)',PTC:'Pitch-to-Cruise (Winged Multirotor)',
    SLC:'Lift + Cruise',SRW:'Stopped Rotor',RC:'Rotorcraft',MR:'Multirotor',
    HB:'Hoverbike',PFV:'Personal Flying Vehicle'})[topType] || (topType || '');
}
// One consistent banner for every taxonomy/physics lock across M2 and M3, so the
// pages read the same regardless of architecture (only the reason text changes).
function physicsLock(topType, reason){
  return '<div class="flag skip"><span class="f-lbl">🔒 Physics Lock — ' + archShort(topType) + '</span>' + reason + '</div>';
}
function m3Get(key, suffix, fallback) {
  var field = m3Field(key, suffix);
  if (typeof S[field] == 'undefined' || S[field] === null || S[field] === '') return fallback;
  return S[field];
}
// xlCount() (not a bare parseInt||0): a count field can hold a raw boolean if a
// legacy/malformed import wrote a presence flag into it instead of a number —
// parseInt(true,10) is NaN, which silently reads back as 0 instead of 1 (rule 1).
function m3Count(key) { return xlCount(m3Get(key, 'count', 0)); }
// Multi-propeller-type support: a single wing/zone can carry several DISTINCT
// propeller types (e.g. some fixed, some tilting). m3_<key>_ntypes holds how
// many distinct types the reviewer declared (default 1 = the legacy single-set
// behaviour). When >1, each type's full attribute set is stored under a
// namespaced sub-key "<key>__t<n>" so m3Field/m3Get/m3Count/inc-dec all work on
// it unchanged. The card's total propulsor count is the sum across its types.
var M3_MAX_TYPES = 4;
function m3NTypes(key) { var n = parseInt(m3Get(key, 'ntypes', 1), 10) || 1; return Math.min(M3_MAX_TYPES, Math.max(1, n)); }
function m3TypeKey(key, t) { return key + '__t' + t; }
// Per-card total count: legacy single-type cards read the card key directly;
// multi-type cards sum the per-type counts.
function m3CardCount(key) {
  var n = m3NTypes(key);
  if (n <= 1) return m3Count(key);
  var sum = 0;
  for (var t = 1; t <= n; t++) sum += m3Count(m3TypeKey(key, t));
  return sum;
}
function m3Sym(key) {
  var bp = m3Blueprints().find(function(item){ return item.key === key; });
  var fallback = bp ? bp.defaultSym !== false : true;
  return m3Get(key, 'sym', fallback) !== false && m3Get(key, 'sym', fallback) !== 'false';
}
// Longitudinal (fore/aft) symmetry of a propulsion card — the second, independent
// mirror plane alongside m3Sym()'s lateral (left/right) one. Defaults to FALSE
// (fore/aft symmetry is the rarer case), so an untouched card stays unchecked.
function m3SymLong(key) {
  var v = m3Get(key, 'symLong', false);
  return v === true || v === 'true';
}
// Circular / radial symmetry — propulsors arranged in a rotationally symmetric
// pattern (e.g. 3-boom tri, hex array). Independent of lateral/longitudinal planes.
function m3SymCirc(key) {
  var v = m3Get(key, 'symCirc', false);
  return v === true || v === 'true';
}
function m3WingLabel(i) {
  var parts = [];
  if (S['wPosV' + i]) parts.push(labelFor(W_POS_V, S['wPosV' + i]));
  if (S['wPosL' + i]) parts.push(labelFor(W_POS_L, S['wPosL' + i]));
  return parts.length ? parts.join(' / ') : 'Unspecified';
}

function m3Blueprints() {
  if (S.topType === 'RC' || S.topType === 'MR') {
    var rotorCards = [{key:'core_layout', title:'Main Rotor Layout', subtitle:'Central vertical thrust mechanics.', zoneMode:true, defaultSym:false}];
    // Rotorcraft/multirotors can still carry an empennage (esp. an 'Other' tail)
    // with built-in propulsors — give them the same empennage propulsion card the
    // winged/fallback configs get so those tail-mounted units can be recorded.
    if (S.empType && S.empType != 'Tailless') {
      rotorCards.push({key:'emp', title:'Empennage [' + labelFor(EMP_TYPE, S.empType) + ']', subtitle:'Tail stabilizer structural thrusters.', defaultSym:S.latSym, zoneMode:true});
    }
    // Multirotors (and some rotorcraft) carry their rotors on booms / outriggers —
    // offer the same boom-mounted propulsors card the winged/fallback configs get.
    rotorCards.push({key:'boom', title:'Boom-Mounted Propulsors', subtitle:'Propulsors carried on booms/outriggers — record where the booms attach.', defaultSym:S.latSym, isBoom:true});
    return rotorCards;
  }
  if (!isWinged() || S.wCount === 0 || ['BWB', 'FW', 'LB'].indexOf(S.wingConf) > -1) {
    var fallbackCards = [];
    if (['BWB', 'FW', 'LB'].indexOf(S.wingConf) > -1) {
      fallbackCards.push({key:'hull_array', title:'Integrated Hull Edge Array', subtitle:'Propulsion mapped directly to the lifting body edges.', zoneMode:true, defaultSym:S.latSym, isHull:true});
    } else {
      fallbackCards.push({key:'core_layout', title:'Fuselage & Airframe Hub Array', subtitle:'Primary propulsion allocation grid.', zoneMode:true, defaultSym:S.latSym});
    }
    if (S.empType && S.empType != 'Tailless') {
      fallbackCards.push({key:'emp', title:'Empennage [' + labelFor(EMP_TYPE, S.empType) + ']', subtitle:'Tail stabilizer structural thrusters.', defaultSym:S.latSym});
    }
    // Boom-mounted propulsors (booms carrying lift/cruise units, attached to the
    // airframe). isBoom drives the card-level "Boom Attachment" selector.
    fallbackCards.push({key:'boom', title:'Boom-Mounted Propulsors', subtitle:'Propulsors carried on booms/outriggers — record where the booms attach.', defaultSym:S.latSym, isBoom:true});
    return fallbackCards;
  }
  var cards = [];
  for (var i = 1; i <= S.wCount; i++) {
    cards.push({key:'wing' + i, title:'Wing ' + i + ' [' + m3WingLabel(i) + ']', subtitle:'Independent thruster allocations across this wing.', defaultSym:true, zoneMode:true});
  }
  cards.push({key:'fuselage', title:'Fuselage Body', subtitle:'Central structure, cabin spine, or structural outriggers.', defaultSym:false, zoneMode:true});
  // Boom-mounted propulsors — same propulsor attributes as a wing/fuselage card,
  // plus a card-level "Boom Attachment" selector (to the wings, fuselage, etc.).
  cards.push({key:'boom', title:'Boom-Mounted Propulsors', subtitle:'Propulsors carried on booms/outriggers — record where the booms attach.', defaultSym:true, isBoom:true});
  if (S.empType && S.empType != 'Tailless') {
    cards.push({key:'emp', title:'Empennage / Tail [' + labelFor(EMP_TYPE, S.empType) + ']', subtitle:'Stabilizer control thrusters.', defaultSym:false, zoneMode:true});
  }
  return cards;
}

function m3OrientationOptions() {
  // orient vocab [Horizontal, Vertical, Mixed] — identical across the stack
  // (vlm_extractor.py / cross_modal.py / reviewer.py / excel_schema.py).
  // Independent fixed lift+cruise thrust never tilts, so it omits "Mixed".
  if (isIndependentThrust()) return [{id:'Vertical', n:'Vertical / Lift Engine'},{id:'Horizontal', n:'Horizontal / Cruise Pusher'}];
  return [{id:'Horizontal', n:'Horizontal (Cruise)'},{id:'Vertical', n:'Vertical (Hover)'},{id:'Mixed', n:'Mixed (Vectoring / Tilting)'}];
}
function m3ZoneOptions(bp) {
  if (bp.key === 'emp') return [{id:'StackV', n:'Stacked Vertically'},{id:'StackH', n:'Stacked Horizontally'},{id:'Tip', n:'Tip Mounted'},{id:'Other', n:'Other'}];
  return [{id:'Nose', n:'Nose/Forward (nose tip)'},{id:'Aft', n:'Aft/Pusher (tail tip)'},{id:'FusFront', n:'Fuselage — Front (body)'},{id:'FusRear', n:'Fuselage — Rear (body)'},{id:'Side', n:'Side Outriggers'},{id:'Dorsal', n:'Dorsal/Top'},{id:'Ventral', n:'Ventral/Bottom'}];
}
function m3ZoneChordOptions() { return [{id:'LE', n:'Leading Edge'},{id:'TE', n:'Trailing Edge'},{id:'Above', n:'Above Surface'},{id:'Below', n:'Below Surface'}]; }
function m3ZoneSpanOptions() { return [{id:'Inboard', n:'Inboard (Near Fuselage)'},{id:'MidSpan', n:'Mid-Span'},{id:'Outboard', n:'Outboard (Near Tip)'},{id:'Wingtip', n:'Wingtip'},{id:'FullSpan', n:'Across the extension of the wing'}]; }

// Quick Count Override stations report their total via {key}_quickCount instead
// of the (hidden, unfilled) structured count field — use that for the total so
// the header stays accurate when a station is overridden.
function m3TotalCount() { return m3Blueprints().reduce(function(sum, bp){ return sum + (S[bp.key + '_quickOverride'] ? (parseInt(S[bp.key + '_quickCount'], 10) || 0) : m3CardCount(bp.key)); }, 0); }
function m3DistributedFlag() {
  var total = m3TotalCount();
  if (S.topType === 'MR') return {cls:'info', text:'Multi-Rotor (Native DEP — not wing-integrated)'};
  if (S.topType === 'RC') return {cls:'skip', text:'Rotorcraft — Single/Coaxial Hub Architecture'};
  if (total >= 8) return {cls:'warn', text:'Distributed_Propulsion = Full (Wing-DEP ≥8 units)'};
  if (total >= 6) return {cls:'info', text:'Distributed_Propulsion = Entry (Wing-DEP 6–7 units)'};
  if (total > 2) return {cls:'info', text:'Distributed_Propulsion = Partial (3–5 units)'};
  return {cls:'skip', text:'Distributed_Propulsion = Conventional (≤2 units)'};
}

// Per-type propulsor attribute block (chord / thrust kinematics / blade
// behavior / retraction / articulation + its own count). `tkey` is either the
// bare card key (legacy single-type) or a "<key>__t<n>" sub-key (multi-type).
// Reviewer guidance shown under the Thrust Kinematics (thrust-direction) picker:
// a tailsitter flies vertically for hover/launch then rotates to horizontal for
// cruise, so its thrust direction differs by phase — record the CRUISE one.
function _tailsitterKinNote() {
  return '<div class="m3-sub" style="margin-bottom:4px; color:var(--warn);">If it’s a <b>tailsitter</b>, choose the kinematics for <b>cruise mode</b> (rotated to forward flight), not the vertical hover/launch posture.</div>';
}

// `showCount` is false for the legacy path (the count lives in the card header)
// and true per type when multiple types are declared.
function m3TypeAttrs(bp, tkey, showCount) {
  var h = '';
  if (showCount) {
    var tcount = m3Count(tkey);
    h += '<div class="m2-tools" style="margin-top:6px;"><div class="m2-row"><div class="m2-kv" style="margin:0 8px 0 0;">Count of this type</div>'
      + '<div class="m2-count-wrap"><button class="m3-btn ibtn" type="button" data-m3-action="dec" data-comp="' + tkey + '">−</button>'
      + '<input class="m2-count" type="number" min="0" step="1" inputmode="numeric" data-field="' + m3Field(tkey,'count') + '" value="' + tcount + '">'
      + '<button class="m3-btn ibtn" type="button" data-m3-action="inc" data-comp="' + tkey + '">+</button></div></div></div>';
  }

  // v15.1 (T3): label text only — "chordwise position" is a distinct
  // aerodynamic term (position along an airfoil's chord line); this field
  // actually records tractor-vs-pusher orientation. CHORD array, its
  // options, and the "chord" field id are unchanged.
  h += '<div class="m2-kv">Thrust Orientation (Tractor / Pusher)</div>' + grid('', CHORD.map(function(o){ return oc(m3Field(tkey,'chord'), o.id, o.n, o.d); }));

  if (S.topType === 'TW' && bp.key.indexOf('wing') > -1) {
    // Tilt-wing: the propulsor is bolted to the wing, so its ARTICULATION is
    // locked (propKin, below). Its thrust DIRECTION still sweeps as the wing
    // rotates, so orient stays a free choice — Mixed is offered as an option.
    h += '<div class="m2-kv">Thrust Kinematics</div>'
       + '<div class="m3-sub" style="margin-bottom:4px;">Tilt-wing: the whole wing rotates, so the wing-mounted thrust vectors with it — pick <b>Mixed</b> for the airframe-relative sweep, or <b>Horizontal</b> if you mean relative to the wing chord.</div>'
       + _tailsitterKinNote()
       + grid('', m3OrientationOptions().map(function(o){ return oc(m3Field(tkey,'orient'), o.id, o.n); }));
  } else if (S.topType === 'TB') {
    // Tilt-body (tailsitter): the whole airframe rotates, so EVERY propulsor's
    // thrust direction sweeps with it, regardless of which station mounts it —
    // unlike TW this isn't limited to wing-mounted cards. ARTICULATION is still
    // locked (propKin, below); only thrust DIRECTION is a free choice.
    h += '<div class="m2-kv">Thrust Kinematics</div>'
       + '<div class="m3-sub" style="margin-bottom:4px;">Tilt-body (tailsitter): the whole airframe rotates between hover and cruise, so every propulsor’s thrust vectors with it — pick <b>Mixed</b> for the airframe-relative sweep, or record relative to the <b>cruise</b> attitude if you mean the body axis.</div>'
       + _tailsitterKinNote()
       + grid('', m3OrientationOptions().map(function(o){ return oc(m3Field(tkey,'orient'), o.id, o.n); }));
  } else {
    h += '<div class="m2-kv">Thrust Kinematics</div>' + _tailsitterKinNote() + grid('', m3OrientationOptions().map(function(o){ return oc(m3Field(tkey,'orient'), o.id, o.n); }));
  }

  h += '<div class="m2-kv">Aerodynamic Blade Behavior</div>' + grid('', BLADE_MECH.map(function(o){ return oc(m3Field(tkey,'bmech'), o.id, o.n); }));
  h += '<div class="m2-kv">Retraction Kinematics</div>' + grid('', RETRACT_MECH.map(function(o){ return oc(m3Field(tkey,'rmech'), o.id, o.n); }));

  // Propulsor Articulation (propKin) — locked per the architecture physics
  // matrix (propKinLock): TW/DS/SLC/SRW/MR/TB/RC→Fixed; TP & CVT free
  // (TP aircraft can mix tilting and fixed propulsors). The locked value is
  // shown selected+disabled, forced again in buildExport, and the unified
  // physics-lock banner explains why. NOTE: when several propeller
  // types are declared the lock is intentionally NOT applied per type — that's
  // the whole point of declaring multiple types (e.g. fixed + tilting on the
  // same wing), so articulation stays a free per-type choice.
  var pkLock = propKinLock(S.topType);
  var propKinLocked = !!pkLock;
  if (propKinLocked) h += physicsLock(S.topType, propKinLockReason(S.topType) + '.');
  h += '<div class="m2-kv">Propulsor Articulation' + (propKinLocked ? ' (Locked)' : '') + '</div>' + grid('', PROP_KIN.map(function(o){
    var sel = propKinLocked ? (o.id === pkLock) : (m3Get(tkey,'propKin',null) === o.id);
    return '<div class="opt' + (sel ? ' sel' : '') + (propKinLocked ? ' dis' : '') + '" data-field="' + m3Field(tkey,'propKin') + '" data-val="' + encodeURIComponent(o.id) + '" title="' + escHtml(o.d || o.n) + '"><div class="o-name">' + o.n + '</div></div>';
  }));
  // v15.3: PROP_KIN's new 'Other' needs a paired mandatory note (see
  // otherNoteInput). Never shown while the architecture lock is on — a locked
  // card can only be Fixed, so 'Other' is unreachable there.
  if (!propKinLocked) h += otherNoteInput(m3Field(tkey,'propKin'), 'Describe how this propulsor articulates...');

  // Mounting-zone position — now PER propeller type (each type block carries its
  // own), stored under tkey. For wing cards: chordwise + spanwise; for other
  // zone cards: the airframe mounting-zone set.
  if (bp.zoneMode) {
    if (bp.key.indexOf('wing') > -1) {
