  Object.keys(FIG_ATTACHED_URL).forEach(function(k){ try { URL.revokeObjectURL(FIG_ATTACHED_URL[k]); } catch (e) {} });
  FIG_ATTACHED_URL = {};
  var idxSet = {};
  rows.forEach(function(r){ var s = archSuffixNum(r.Patent_ID); if (s != null) idxSet[s] = true; });
  var archIdxs = Object.keys(idxSet).map(Number).sort(function(a,b){ return a-b; });
  if (!archIdxs.length) archIdxs = [1];   // no suffixed rows ⇒ single architecture

  S.archProfiles = [];
  S.archDinoUnderstanding = {};
  archIdxs.forEach(function(n, i){
    // Blank the morphology slate between architectures so arch n never inherits
    // arch (n-1)'s leftover wing/propulsion fields; figData/T1 are shared and
    // re-applied identically each pass.
    var blank = fresh();
    Object.keys(S).forEach(function(k){ if (k.indexOf('m3_') === 0 || M3_QUICK_KEY_RE.test(k)) delete S[k]; });
    aircraftSnapshotKeys().forEach(function(k){ S[k] = blank[k]; });
    var archData = rowsToAIData(rowsForArch(rows, n));
    ingestAI(archData);
    // dinoUnderstanding round-trips separately from the morphology snapshot —
    // it's keyed by architecture NUMBER (n), not swapped via archProfiles.
    if (archData.M1 && archData.M1.dinoUnderstanding) {
      S.archDinoUnderstanding[n] = archData.M1.dinoUnderstanding;
    }
    S.curArch = i;
    S.archProfiles[i] = captureAircraftSnapshot();
  });
  // Show architecture 1 as the active one.
  S.curArch = 0;
  applyAircraftSnapshot(S.archProfiles[0]);
  S.archCount = archIdxs.length;
}

function loadBatchPatent(idx) {
  if (!BATCH || idx < 0 || idx >= BATCH.ids.length) return;
  BATCH.idx = idx;
  var pid  = BATCH.ids[idx];
  // If this patent was already reviewed in this session, its approve/
  // duplicate/etc. choices live in REVIEWED_ROWS (written by
  // commitReviewedRows on Export & Next), not in the original BATCH.byId
  // rows from the uploaded xlsx — read those back first so navigating away
  // and back (batch-prev/-next) doesn't show the triage as unselected.
  var reviewedRows = REVIEWED_ROWS.filter(function(r) { return basePatentId(r.Patent_ID) === pid; });
  var rows;
  if (reviewedRows.length) {
    // Already reviewed this session — its human choices live in REVIEWED_ROWS,
    // which take precedence so navigating away/back doesn't show triage as
    // unselected. BUT: a reviewed patent's rows were captured when it was saved,
    // so any image ADDED to the ml batch afterwards (e.g. a newly-cropped figure
    // appended to ml_predict_labels_<batch>.xlsx) is absent from them and would
    // never appear. Merge in any ml "Image: <file>" group whose figure isn't
    // already in the reviewed rows — new figures show up as unlabeled, while
    // every reviewed label is left untouched (they re-export on the next save).
    rows = reviewedRows.slice();
    var haveImg = {};
    reviewedRows.forEach(function(r) {
      if (r.Section === 'T2' && String(r.Sub_Dimension || '').indexOf('Image: ') === 0) haveImg[r.Sub_Dimension] = true;
    });
    (BATCH.byId[pid] || []).forEach(function(r) {
      if (r.Section === 'T2' && String(r.Sub_Dimension || '').indexOf('Image: ') === 0 && !haveImg[r.Sub_Dimension]) {
        rows.push(r);
      }
    });
  } else {
    rows = BATCH.byId[pid];
  }

  S = fresh();

  // T1_META was a hardcoded placeholder before the batch loader existed —
  // populate it from this patent's T1 rows so the metadata pane and the
  // FIG.-highlighting in pageT2() reflect the real patent instead.
  function metaVal(field) {
    var r = rows.find(function(x) { return x.Field === field; });
    return (r && r.Value !== undefined && r.Value !== '') ? r.Value : '';
  }
  T1_META.recordNumber        = pid;
  // Two separate links per patent:
  //  • pdfLink (the side-by-side window opened on Next/prev) → EPO Espacenet
  //    record, built straight from the publication number: always resolves,
  //    needs no login, never expires, AND — unlike the PatSeer PDF — renders
  //    Espacenet's machine-translated view for non-English patents (AT, DE,
  //    CN, ...), where the raw PatSeer PDF stays in the native language.
  //  • pdfSourceLink (the "Open PDF" button) → the actual PatSeer source PDF,
  //    injected per patent as a 'pdf_link' row by scripts/inject_pdf_links.py.
  //    Note this is a PatSeer API URL, so it generally only opens when you're
  //    logged into PatSeer in this browser; use the EPO window if it's blocked.
  T1_META.pdfLink              = 'https://worldwide.espacenet.com/patent/search?q=pn%3D' + encodeURIComponent(pid);
  // Fall back to the EPO link when a patent has no PatSeer PDF link, so the
  // button is never blank.
  T1_META.pdfSourceLink        = metaVal('pdf_link') || T1_META.pdfLink;
  // Raw value (no EPO fallback baked in) so recordToRows() can re-emit the
  // original 'pdf_link' row on export — without this, every reviewed export
  // silently dropped the PatSeer PDF link injected by inject_pdf_links.py,
  // so re-loading a reviewed file always fell back to the EPO link.
  T1_META.pdfLinkRaw           = metaVal('pdf_link') || '';
  // Always reset the name per patent (no fallback to the previous patent's name,
  // which would wrongly carry a name onto a blank-name patent).
  T1_META.aircraftName          = metaVal('aircraftName') || '';
  T1_META.title                = metaVal('title')        || T1_META.title;
  T1_META.abstract             = metaVal('abstract')      || T1_META.abstract;
  T1_META.assignee             = metaVal('assignee')      || T1_META.assignee;
  T1_META.pubYear              = metaVal('pub_year')      || T1_META.pubYear;
  T1_META.appYear              = metaVal('app_year')      || T1_META.appYear;
  T1_META.descriptionOfDrawings = metaVal('description_of_drawings') || T1_META.descriptionOfDrawings;
  // Download-audit flag (scripts/flag_missing_downloads.py): true when this
  // patent has NO raw download folder, so its images are placeholders and the
  // source document must be retrieved manually before the final merge. Drives
  // the red banner at the top of T1.
  T1_META.missingFromDownload  = String(metaVal('missing_from_download')).toLowerCase() === 'true';

  ingestPatentRows(rows);

  // Persistence fix (H3/H5): mainFigure + patent-level comments are written to META
  // rows on save but were never read back; restore them from this patent's rows.
  // No-op for ML pre-label files (which carry neither) and for the placeholder
  // fresh() defaults when a patent hasn't been reviewed yet.
  // Main figure is now per-architecture (per-figure isMain flag, restored above
  // by ingestPatentRows). Backward-compat: if this is an OLD reviewed file that
  // only carries the single META mainFigure (no per-figure isMain), seed that
  // figure's isMain so it still shows as the main of its architecture.
  var _mainFig = metaVal('mainFigure');
  var _anyMain = Object.keys(S.figData || {}).some(function(f){ return (S.figData[f]||{}).isMain; });
  if (_mainFig && !_anyMain && S.figData[_mainFig]) setMainFigure(_mainFig);
  var _patComments = metaVal('comments'); if (_patComments) S.comments = _patComments;
  // T1 edge-case toggle tags — split the "|"-joined META row back into a list.
  var _t1Edge = metaVal('t1EdgeTags');
  S.t1EdgeTags = _t1Edge ? String(_t1Edge).split('|').filter(Boolean) : [];
  // Patent-level image-semantics review (T2 col 4) — restore from META rows.
  S.imgNotReflect = String(metaVal('imgNotReflect')).toLowerCase() === 'true';
  // stripLabel: recordToRows() writes this as "<id> — <name>" (withLabel), so
  // without stripping it back the stored value ("TW — Tilt Wing") never matches
  // the option id ("TW") the UI compares against — the choice would silently
  // come back unselected and re-save double-labelled.
  var _imgArch = metaVal('imgApparentArch'); if (_imgArch) S.imgApparentArch = stripLabel(_imgArch);
  var _imgNotes = metaVal('patentImageComments'); if (_imgNotes) S.patentImageComments = _imgNotes;

  var nImages = Object.keys(S.figData).length;
  THROUGHPUT.patCur = String(idx + 1);
  THROUGHPUT.patTot = String(BATCH.ids.length);
  if (nImages) THROUGHPUT.figTot = String(nImages);
  THROUGHPUT.figCur = '1';

  document.getElementById('batch-nav-label').textContent =
    'Patent ' + (idx + 1) + ' / ' + BATCH.ids.length + ' — ' + pid;
  document.getElementById('batch-prev').disabled = (idx === 0);
  document.getElementById('batch-next').disabled = (idx === BATCH.ids.length - 1);

  // Freshly landed on this patent — nothing edited yet. The badge then reflects
  // whether it was already saved on a previous visit.
  BATCH.dirty = false;
  updateSaveIndicator();

  render();
}

document.getElementById('batch-xlsx-input').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
      var sheetName = wb.SheetNames.indexOf('Review') > -1 ? 'Review' : wb.SheetNames[0];
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: null });

      var ids = [], byId = {};
      rows.forEach(function(r) {
        if (r.Patent_ID == null) return;
        // Collapse "_arch{N}"-suffixed morphology rows from a reloaded reviewed
        // file back under their BASE patent id, so a multi-architecture patent is
        // one entry in the batch (not one per architecture). Single-arch / ML
        // exports have no suffix, so basePatentId is a no-op for them.
        var pid = basePatentId(r.Patent_ID);
        if (!byId[pid]) { byId[pid] = []; ids.push(pid); }
        byId[pid].push(r);
      });
      if (!ids.length) throw new Error('No Patent_ID rows found in sheet "' + sheetName + '"');

      // Derive a batch label from the filename (e.g. "ml_predict_labels_Batch_01.xlsx"
      // -> "Batch_01") so the reviewed-output xlsx is named after the same batch,
      // matching the data/matched/<batch>/ml_predict_labels_<batch>.xlsx convention.
      var m = /_?((?:Batch_?\d+|Batch_[A-Za-z0-9_]+))\.xlsx$/i.exec(file.name);
      var label = m ? m[1] : file.name.replace(/\.xlsx$/i, '');

      // saved: set of Patent_IDs whose reviewed rows are in REVIEWED_ROWS.
      // dirty: the patent currently on screen has unsaved edits.
      BATCH = { ids: ids, byId: byId, idx: 0, label: label, saved: {}, dirty: false };
      REVIEWED_ROWS = [];  // new batch loaded — don't carry over a previous batch's rows
      AIRCRAFT_REGISTRY = {}; PART_TOKENS = []; EDGE_TOKENS = []; FIGURE_LABEL_REGISTRY = {};  // reset session memory for the new batch
      ingestRegistryFromRows(byId);              // seed aircraft names from the loaded Excel
      buildAssigneeGroups(byId);                 // applicant -> patent-count map for T1
      populateJumpDatalist();
      document.getElementById('batch-load-status').textContent =
        ' Loaded ' + ids.length + ' patent(s) from ' + sheetName + ' (batch: ' + label + ').';
      document.getElementById('batch-nav').style.display = 'flex';
      loadBatchPatent(0);
    } catch (err) {
      document.getElementById('batch-load-status').textContent = ' Failed to load batch: ' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
});

// Resume a batch: load a previously-exported reviewed_patents_<batch>.xlsx
// AFTER the ml_predict batch above is already loaded, and overlay its rows
// onto REVIEWED_ROWS (loadBatchPatent() already prefers REVIEWED_ROWS over
// BATCH.byId, so every patent present in this file shows the human's saved
// choices instead of the raw ML guesses). Patents not present in this file
// fall back to the ml batch untouched. Jumps straight to the first patent
// NOT yet in this file, so closing/reopening the page resumes where you left
// off instead of restarting at patent 1.
document.getElementById('batch-resume-input').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var status = document.getElementById('batch-resume-status');
  if (!BATCH) { status.textContent = ' Load the ml batch first.'; e.target.value = ''; return; }
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
      var sheetName = wb.SheetNames.indexOf('Review') > -1 ? 'Review' : wb.SheetNames[0];
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: null });

      var byId = {};
      rows.forEach(function(r) {
        if (r.Patent_ID == null) return;
        var pid = basePatentId(r.Patent_ID);
        if (!byId[pid]) byId[pid] = [];
        byId[pid].push(r);
      });

      var restored = 0;
      Object.keys(byId).forEach(function(pid) {
        if (BATCH.ids.indexOf(pid) === -1) return;   // not part of the currently loaded ml batch
        REVIEWED_ROWS = REVIEWED_ROWS.filter(function(r){ return basePatentId(r.Patent_ID) !== pid; });
        REVIEWED_ROWS = REVIEWED_ROWS.concat(byId[pid]);
        BATCH.saved[pid] = true;
        restored++;
      });

      // First not-yet-reviewed patent, or the last one if every patent is already saved.
      var nextIdx = BATCH.ids.findIndex(function(pid){ return !BATCH.saved[pid]; });
      if (nextIdx === -1) nextIdx = BATCH.ids.length - 1;

      status.textContent = ' Restored ' + restored + '/' + BATCH.ids.length + ' patent(s) — resuming at #' + (nextIdx + 1) + '.';
      loadBatchPatent(nextIdx);
    } catch (err) {
      status.textContent = ' Failed to resume: ' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
});

// --- KEYBOARD NAVIGATION (Audit R-01) ---
document.addEventListener('keydown', function(e) {
  var tag = document.activeElement ? document.activeElement.tagName : '';
  var isTyping = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
  var sid = curSID();
  
  if (!isTyping) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      // Click the real Next button so the per-architecture loop logic in the
      // click handler runs (don't manipulate S.step directly here, which would
      // bypass the G1↔M3 arch loop).
      var btn = document.getElementById('btn-next');
      if (btn && !btn.disabled) btn.click();
    }
    if (e.key === 'Backspace') {
      e.preventDefault();
      var bb = document.getElementById('btn-back');
      if (bb) bb.click();             // route through the loop-aware Back handler
    }
  }

  if (sid === 't2' && !isTyping) {
    var fNum = (S.t2figNum||'1').trim();
    if (e.key === 'ArrowRight' || e.key === ']') {
      e.preventDefault(); S.t2figNum = String(parseInt(fNum||0) + 1); render();
    }
    if (e.key === 'ArrowLeft' || e.key === '[') {
      e.preventDefault(); S.t2figNum = String(Math.max(1, parseInt(fNum||2) - 1)); render();
    }
    if (e.key === 'a' || e.key === 'A') {
      if (fNum) { figSet(fNum, 'status', 'approved'); markBatchDirty(); render(); }
    }
    if (e.key === 'x' || e.key === 'X') {
      if (fNum) {
        figSet(fNum, 'status', 'disapproved');
        figSet(fNum, 'isMain', false);   // a disapproved figure can't be the arch's main
        markBatchDirty(); render();
      }
    }
    if (e.key === 'm' || e.key === 'M') {
      if (fNum) { setMainFigure(fNum); figSet(fNum, 'status', 'approved'); markBatchDirty(); render(); }
    }
    if (e.key === 'Escape') {
      if (fNum) { delete S.figData[fNum]; markBatchDirty(); render(); }   // isMain lived on figData, gone with it
    }
  }

  if (sid === 't1' && !isTyping) {
    if (e.shiftKey && e.key === 'A') { S.isApproved = true; markBatchDirty(); render(); }
    if (e.shiftKey && e.key === 'D') { S.isApproved = false; markBatchDirty(); render(); }
    if (e.shiftKey && e.key === 'F') { S.isDuplicate = !S.isDuplicate; markBatchDirty(); render(); }
  }
});

(function(){

  if (!panel) return;
  var DIRTY_SEL = '[data-field],[data-arrfield],[data-figfield],[data-figarrfield],'
    + '[data-t1-approve],[data-dup-type],[data-fig-quality],'
    + '[data-grid-approve],[data-grid-disapprove],'
    + '[data-t2-main],[data-t2-rotate],[data-t2-arch],[data-g1-top],'

    + '[data-quick-override],[data-quick-note],[data-m3-quick-override],[data-m3-quick-count],'
    + '[data-human-uncertain],[data-uncertain-note]';
  panel.addEventListener('click', function(e){
    if (BATCH && e.target.closest(DIRTY_SEL)) markBatchDirty();
  });
  // Every <input>/<textarea>/<select> inside the panel is a patent data field.
  panel.addEventListener('input',  function(){ if (BATCH) markBatchDirty(); });
  panel.addEventListener('change', function(){ if (BATCH) markBatchDirty(); });
})();

document.getElementById('panel').addEventListener('click', function(e){
  var tgt=e.target;

  if(tgt.tagName === 'SUMMARY' || tgt.closest('summary')) return;

  // Quick Count Override (v13): section-level toggle (G1/M1/M2/T1) and its
  // M3 per-station variant. Both live in the notes/edge-case area of the page
  // they belong to (see quickOverrideToggle()/m3Card()).
  var qoBtn = tgt.closest('[data-quick-override]');
  if (qoBtn) {
    var qoKey = qoBtn.getAttribute('data-quick-override');
    S[qoKey + '_quickOverride'] = !S[qoKey + '_quickOverride'];
    renderPreserveScroll(); return;
  }
  var m3QoBtn = tgt.closest('[data-m3-quick-override]');
  if (m3QoBtn) {
    var m3QoKey = m3QoBtn.getAttribute('data-m3-quick-override');
    S[m3QoKey + '_quickOverride'] = !S[m3QoKey + '_quickOverride'];
    renderPreserveScroll(); return;
  }

  // Boom groups: add / remove (M1 "Booms / Outriggers")
  var bgAddBtn = tgt.closest('[data-bg-add]');
  if (bgAddBtn) { S.boomGroups = S.boomGroups || []; S.boomGroups.push({ attach:null, wingSpan:null, span:null, long:null, orient:null, count:0, symmetric:true, circSymmetric:false, hasProps:null, cards:[] }); markBatchDirty(); renderPreserveScroll(); return; }
  var bgRemBtn = tgt.closest('[data-bg-remove]');
  if (bgRemBtn) { var rmi=parseInt(bgRemBtn.getAttribute('data-bg-idx'),10); if(S.boomGroups && S.boomGroups[rmi]!==undefined){ S.boomGroups.splice(rmi,1); markBatchDirty(); renderPreserveScroll(); } return; }
  if(tgt.id === 'btn-next' && !tgt.disabled) {
    var sidNow = curSID();
    // Same-name aircraft auto-jump: when the M1/M2/M3 were pre-filled from a
    // known aircraft on T1, clicking Next on T2 skips Gate/M1/M2/M3 and lands on
    // the Summary (Done) page — the morphology is already filled. You can still
    // Back into the skipped steps to verify/edit. Fires only once per patent.
    // Same-name auto-jump only makes sense for a SINGLE-architecture patent
    // (one shared morphology was copied). For a multi-architecture patent the
    // reviewer must still fill each architecture, so fall through to the loop;
    // the copied morphology pre-fills architecture 1.
    if (S.aircraftAutoJump && sidNow === 't2' && getArchCount() === 1) {
      var doneIdx = STEPS.map(function(s){return s.id;}).indexOf('done');
      S.curArch = 0; loadArchProfile(0);   // ensure arch1 profile captured before jumping
      S.step = doneIdx >= 0 ? doneIdx : S.step + 1;
      S.aircraftAutoJump = false;
      renderPreserveScroll(); return;
    }
    // Entering the morphology pages from T2: start at architecture 1.
    if (sidNow === 't2') { S.curArch = 0; loadArchProfile(0); S.step++; renderPreserveScroll(); return; }
    // Leaving M3: if more architectures remain, save this one, advance curArch,
    // load it, and jump BACK to G1 to fill the next architecture. Otherwise fall
    // through to the normal Next (→ Done).
    if (sidNow === 'm3') {
      saveCurArchProfile();
      if (S.curArch < getArchCount() - 1) {
        loadArchProfile(S.curArch + 1);
        var gateIdx = STEPS.map(function(s){return s.id;}).indexOf('gate');
        S.step = gateIdx;
        renderPreserveScroll(); return;
      }
    }
    S.step++; renderPreserveScroll(); return;
  }
  if(tgt.id === 'btn-back') {
    var sidBack = curSID();
    // Going Back from G1 while on architecture 2+ returns to M3 of the PREVIOUS
    // architecture (not T2): save current arch, step curArch down, reload it.
    if (sidBack === 'gate' && S.curArch > 0) {
      saveCurArchProfile();
      loadArchProfile(S.curArch - 1);
      var m3Idx = STEPS.map(function(s){return s.id;}).indexOf('m3');
      S.step = m3Idx;
      renderPreserveScroll(); return;
    }
    S.step--; renderPreserveScroll(); return;
  }
  
  if(tgt.id === 'btn-export-next') {
    var record = buildExport();
    console.log("JSON Payload Ready for Pipeline:", record);

    // Record this aircraft's name + morphology so the next same-name patent can
    // copy it (no-op for the no-name bucket / blank name).
    registerAircraft(T1_META.aircraftName);
    // Register every figure's T2 labels so a later duplicate (this patent or a
    // future one) can copy them in, and harvest any edge-case tokens into the
    // session-wide token list so they keep being suggested.
    Object.keys(S.figData).forEach(function(fNum){
      registerFigureLabels(T1_META.recordNumber, fNum);
      (figGet(fNum,'edgeTags',[])||[]).forEach(function(t){ if (EDGE_TOKENS.indexOf(t) === -1) EDGE_TOKENS.push(t); });
    });

    if (BATCH) {
      // Accumulate into the batch's reviewed rows instead of downloading one
      // JSON per patent — exportReviewedBatch() writes all of these as a
      // single reviewed_patents_<batch>.xlsx. commitReviewedRows() dedupes by
      // Patent_ID and flips the save indicator to "✓ Saved".
      commitReviewedRows(BATCH.ids[BATCH.idx], record);
    } else {
      // No batch loaded (single-patent ad-hoc review) — fall back to the
      // original per-patent JSON download, since there's no batch to export.
      var blob = new Blob([JSON.stringify(record, null, 2)], {type:'application/json'});
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = T1_META.recordNumber + '_label.json'; a.click();
    }

    if (BATCH && BATCH.idx < BATCH.ids.length - 1) {
      // A batch xlsx is loaded — advance straight to the next patient's
      // precomputed AI predictions instead of resetting to a blank form.
      loadBatchPatent(BATCH.idx + 1);
      openOrUpdatePatentWindow(T1_META.pdfLink, 'epo');
    } else {
      if (BATCH) {
        document.getElementById('batch-load-status').textContent =
          ' Batch complete — reviewed all ' + BATCH.ids.length + ' patent(s). Exporting reviewed_patents_' + BATCH.label + '.xlsx...';
        exportReviewedBatch();
      }
      THROUGHPUT.patCur = String(parseInt(THROUGHPUT.patCur||0) + 1);
      THROUGHPUT.figCur = '1';
      S=fresh();
    }
    renderPreserveScroll(); return;
  }

  var figNavBtn = tgt.closest('[data-fig-nav]');
  if (figNavBtn) { S.t2figNum = figNavBtn.getAttribute('data-fig-nav'); renderPreserveScroll(); return; }

  if (tgt.id === 'btn-copy-morphology') {
    var _dupPid = (S.duplicateId||'').trim();
    // Only this Copy action commits a type-1 patent duplicate to the export:
    // record WHICH id was copied so buildExport() can verify it still matches.
    if (copyMorphologyFromOriginal(_dupPid)) {
      S.duplicateCopiedId = _dupPid;
      if (BATCH) markBatchDirty();
      renderPreserveScroll();
    }
    return;
  }

  // T1 Approve Patent
  var t1AppBtn = tgt.closest('[data-t1-approve]');
  if (t1AppBtn) {
    S.isApproved = t1AppBtn.getAttribute('data-t1-approve') === 'true';
    if (S.isApproved === true) {
      // Approving without filled-in scope/field/target left the export with
      // empty triage fields — backfill generic defaults so there's always
      // something valid to ship downstream.
      if (!S.t1Scope)  S.t1Scope  = 'Whole Aircraft Architecture';
      if (!S.t1Field)  S.t1Field  = 'Aerodynamic/Structural';
      if (!S.t1Target) S.t1Target = 'Layout Convergence';
    }
    renderPreserveScroll(); return;
  }

  // T1 Duplicate Type
  var dupTypeBtn = tgt.closest('[data-dup-type]');
  if (dupTypeBtn) { S.duplicateType = dupTypeBtn.getAttribute('data-dup-type'); autofillDuplicateAircraftName(); autoCopyDupMorphology(); renderPreserveScroll(); return; }

  // T1 patent-level edge-case toggle tags (Comments & Edge-Case Log chips).
  var t1EdgeBtn = tgt.closest('[data-t1-edge-tag]');
  if (t1EdgeBtn) {
    var tagId = t1EdgeBtn.getAttribute('data-t1-edge-tag');
    if (!Array.isArray(S.t1EdgeTags)) S.t1EdgeTags = [];
    var pos = S.t1EdgeTags.indexOf(tagId);
    if (pos > -1) S.t1EdgeTags.splice(pos, 1); else S.t1EdgeTags.push(tagId);
    if (BATCH) markBatchDirty();
    renderPreserveScroll(); return;
  }

  // T2 Figure Quality Flag
  var figQualBtn = tgt.closest('[data-fig-quality]');
  if (figQualBtn) {
    var fNumQ = (S.t2figNum||'1').trim();
    figSet(fNumQ, 'qualityFlag', figQualBtn.getAttribute('data-fig-quality'));
    renderPreserveScroll(); return;
  }

  // T2 Per-figure edge-case tags
  if (tgt.id === 'btn-add-edge-tag') {
    var tagInput = document.getElementById('t2-edge-tag-input');
    var newTag = tagInput ? tagInput.value.trim() : '';
    if (newTag) {
      var fNumTag = (S.t2figNum||'1').trim();
      var tags = figGet(fNumTag, 'edgeTags', []);
      if (tags.indexOf(newTag) === -1) { tags = tags.concat([newTag]); figSet(fNumTag, 'edgeTags', tags); }
      // Persist the token session-wide (like PART_TOKENS / aircraft names) so it
      // is offered as a suggestion on every later figure/patent.
      if (EDGE_TOKENS.indexOf(newTag) === -1) EDGE_TOKENS.push(newTag);
      tagInput.value = '';
      renderPreserveScroll();
    }
    return;
  }
  var addTagChip = tgt.closest('[data-add-edge-tag]');
  if (addTagChip) {
    var fNumAddTag = (S.t2figNum||'1').trim();
    var tagToAdd = addTagChip.getAttribute('data-add-edge-tag');
    var curEdgeTags = figGet(fNumAddTag, 'edgeTags', []);
    if (curEdgeTags.indexOf(tagToAdd) === -1) {
      figSet(fNumAddTag, 'edgeTags', curEdgeTags.concat([tagToAdd]));
    }
    renderPreserveScroll();
    return;
  }
  var removeTagEl = tgt.closest('[data-remove-tag]');
  if (removeTagEl) {
    var fNumRmTag = (S.t2figNum||'1').trim();
    var tagToRemove = removeTagEl.getAttribute('data-remove-tag');
    var tagsArr = figGet(fNumRmTag, 'edgeTags', []).filter(function(t){ return t !== tagToRemove; });
    figSet(fNumRmTag, 'edgeTags', tagsArr);
    renderPreserveScroll();
    return;
  }

  // Attach/replace image for the active FIG (see FIG_ATTACHED_URL comment
  // above): opens a throwaway file input, previews the pick via blob: URL,
  // and records file.name into FIG_FILENAMES so export still emits a correct
  // "Image: <filename>" row (Image_Path is filled in later by the Python
  // scripts/resolve_image_paths.py enrichment pass).
  var attachBtn = tgt.closest('[data-attach-img]');
  if (attachBtn) {
    var fNumAttach = attachBtn.getAttribute('data-attach-img');
    var picker = document.createElement('input');
    picker.type = 'file'; picker.accept = 'image/*';
    picker.addEventListener('change', function() {
      var file = picker.files && picker.files[0];
      if (!file) return;
      if (FIG_ATTACHED_URL[fNumAttach]) { try { URL.revokeObjectURL(FIG_ATTACHED_URL[fNumAttach]); } catch (e) {} }
      FIG_ATTACHED_URL[fNumAttach] = URL.createObjectURL(file);
      FIG_FILENAMES[fNumAttach] = file.name;
      // Same "fresh figure" appearance defaults ingestAI() applies to a brand
      // new ML crop (per/acSty/acCol/bgSty/bgCol/parts) — a manually attached
      // image never goes through ingestAI, so without this it would sit blank
      // instead of pre-filled. Only fills fields still unset, so re-attaching
      // over an already-labeled figure never clobbers the reviewer's picks.
      Object.keys(T2_APPEARANCE_DEFAULTS).forEach(function(key) {
        if (figGet(fNumAttach, key, null) == null) figSet(fNumAttach, key, T2_APPEARANCE_DEFAULTS[key]);
      });
      if (figGet(fNumAttach, 'parts', null) == null) figSet(fNumAttach, 'parts', ['Whole Vehicle Layout']);
      markBatchDirty();
      renderPreserveScroll();
    });
    picker.click();
    return;
  }

  // Remove the image currently on this FIG (attached OR pipeline-matched):
  // clears all three lookups so the figure goes back to "no image on disk"
  // (a clean escape hatch for the FIG_ATTACHED_URL cross-patent leak, or any
  // image wrongly attached to the wrong figure — no need to hunt down which
  // global variable is stale, just remove and reattach the right file).
  var removeBtn = tgt.closest('[data-remove-img]');
  if (removeBtn) {
    var fNumRemove = removeBtn.getAttribute('data-remove-img');
    if (!confirm('Remove the image from FIG. ' + fNumRemove + '?')) return;
    if (FIG_ATTACHED_URL[fNumRemove]) { try { URL.revokeObjectURL(FIG_ATTACHED_URL[fNumRemove]); } catch (e) {} }
    delete FIG_ATTACHED_URL[fNumRemove];
    FIG_FILENAMES[fNumRemove] = '';
    FIG_IMAGE_PATH[fNumRemove] = null;
    markBatchDirty();
    renderPreserveScroll();
    return;
  }

  // T2 Figure Grid — per-card Approve / Disapprove / Text-toggle. Checked
  // BEFORE the card-select branch so a click on these buttons toggles the
  // figure's state (and re-renders the green/red glow) instead of merely
  // selecting the card. Clicking the same status again clears it.
  var gridApproveBtn = tgt.closest('[data-grid-approve]');
  if (gridApproveBtn) {
    var fNumA = gridApproveBtn.getAttribute('data-grid-approve');
    figSet(fNumA, 'status', figGet(fNumA,'status',null) === 'approved' ? null : 'approved');
    renderPreserveScroll(); return;
  }
  var gridDisBtn = tgt.closest('[data-grid-disapprove]');
  if (gridDisBtn) {
    var fNumD = gridDisBtn.getAttribute('data-grid-disapprove');
    var nextD = figGet(fNumD,'status',null) === 'disapproved' ? null : 'disapproved';
    figSet(fNumD, 'status', nextD);
    if (nextD === 'disapproved') figSet(fNumD, 'isMain', false);   // a disapproved figure can't be a main
    renderPreserveScroll(); return;
  }
  // Bulk "Disapprove all" — set every figure to disapproved in one click, so the
  // reviewer then only clicks ✓ on the images they want to keep.
  if (tgt.closest('#btn-grid-disapprove-all')) {
    t2AllFigNums().forEach(function(fn){ figSet(fn, 'status', 'disapproved'); figSet(fn, 'isMain', false); });
    if (BATCH) markBatchDirty();
    renderPreserveScroll(); return;
  }
  var gridTextBtn = tgt.closest('[data-grid-text-toggle]');
  if (gridTextBtn) {
    var fNumT = gridTextBtn.getAttribute('data-grid-text-toggle');
    figSet(fNumT, 'gridShowText', !figGet(fNumT,'gridShowText',false));
    renderPreserveScroll(); return;
  }

  // T2 Figure Grid Card select
  var figCardBtn = tgt.closest('[data-fig-card]');
  if (figCardBtn) { S.t2figNum = figCardBtn.getAttribute('data-fig-card'); renderPreserveScroll(); return; }
  if (tgt.id === 'btn-add-figure') {
    var maxN = 0;
    t2AllFigNums().forEach(function(n){ var p = parseInt(n,10); if(!isNaN(p) && p>maxN) maxN=p; });
    S.t2figNum = String(maxN+1); renderPreserveScroll(); return;
  }

  // T2 Main Figure (approve/disapprove now lives only on the figure cards via
  // data-grid-approve / data-grid-disapprove — the duplicate buttons that used
  // to be here in "Figure Validation & Assignment" were removed).
  // Manually declare one more architecture than is currently derived (for a
  // distinct architecture the patent describes but no single figure isolates).
  // Bumping S.archCount above the figure-derived max makes getArchCount() return
  // it; the Assign-To dropdown then offers the new number.
  if (tgt.id === 'btn-add-arch') {
    S.archCount = getArchCount() + 1;
    renderPreserveScroll(); return;
  }
  // Remove the LAST architecture. getArchCount() is the max of several sources
  // (figure arch tags, archProfiles.length, S.archCount), so to actually lower
  // it we must shrink ALL of them: refuse if any figure is still tagged to the
  // last architecture (that would orphan it), then trim archProfiles, the
  // per-arch DINOv2 store, clamp curArch, and lower S.archCount.
  if (tgt.id === 'btn-remove-arch') {
    var lastArch = getArchCount();
    if (lastArch <= 1) return;   // never remove the only architecture
    var tagged = Object.keys(S.figData || {}).filter(function(f){ return figArchOf(f) === lastArch; });
    if (tagged.length) {
      var stR = document.getElementById('batch-load-status');
      var msg = 'Can\'t remove Architecture ' + lastArch + ' — reassign FIG. '
              + tagged.join(', ') + ' to another architecture first (Assign To dropdown).';
      if (stR) stR.textContent = ' ' + msg; else alert(msg);
      return;
    }
    var newCount = lastArch - 1;
    if (S.archProfiles && S.archProfiles.length > newCount) S.archProfiles.length = newCount;
    if (S.archDinoUnderstanding) delete S.archDinoUnderstanding[lastArch];
    if (S.curArch > newCount - 1) S.curArch = newCount - 1;
    S.archCount = newCount;
    if (BATCH) markBatchDirty();
    renderPreserveScroll(); return;
  }

  var t2MainBtn = tgt.closest('[data-t2-main]');
  if (t2MainBtn) {
      var fNum2 = (S.t2figNum||'1').trim();
      if(fNum2){ setMainFigure(fNum2); figSet(fNum2, 'status', 'approved'); if (BATCH) markBatchDirty(); renderPreserveScroll(); }
      return;
  }

  // T2 Rotation
  var t2RotateBtn = tgt.closest('[data-t2-rotate]');
  if (t2RotateBtn) {
      var fNumR = (S.t2figNum||'1').trim();
      if (fNumR) {
          var curRot = figGet(fNumR, 't2_rotation', 0);
          figSet(fNumR, 't2_rotation', (curRot + 90) % 360);
          renderPreserveScroll();
      }
      return;
  }

  var t1Btn = tgt.closest('.t1-scopebtn');
  if (t1Btn) { S.t1Scope = decodeURIComponent(t1Btn.getAttribute('data-val')); renderPreserveScroll(); return; }

  var g1Master = tgt.closest('.g1-master');
  if(g1Master){ S.g1Focus = g1Master.getAttribute('data-g1-master'); S.topType = null; renderPreserveScroll(); return; }

  var g1Sub = tgt.closest('.g1-subbtn');
  if(g1Sub && g1Sub.getAttribute('data-g1-top')){
    var _prevTopType = S.topType;
    S.topType = g1Sub.getAttribute('data-g1-top');
    S.g1Focus = g1Sub.getAttribute('data-g1-group');

    // Audit B-02 Fix: Apply Physics Locks here, not in render.
    // TP excluded (v15 F1 fix) — TP wing-tilt is a legitimate reviewer
    // choice (folding/ground-clearance), no longer force-set on selection.
    if (S.topType === 'TB' || S.topType === 'PTC') {
        // TB (tailsitter) / PTC (pitch-to-cruise): whole airframe reorients as one rigid unit — see propKinLock().
        for (var i = 1; i <= 4; i++) { S['wTilt'+i] = 'Fixed'; }
    } else if (S.topType === 'TW') {
        S['wTilt1'] = 'Tilt';
        // default wing-mounted thrust orient, but leave it editable (Mixed allowed)
        for (var i = 1; i <= 4; i++) { if (!S['m3_wing'+i+'_orient']) S['m3_wing'+i+'_orient'] = 'Horizontal'; }
    } else if (S.topType === 'RC' || S.topType === 'MR') {
        for (var i = 1; i <= 4; i++) { S['wTilt'+i] = null; }
        // v14 (C7.1): RC/MR are wingless — lock wing count to 0 so exported data
        // agrees with the wing UI, already hidden by isWinged() excluding both.
        S.wCount = 0;
    }
    applyPropKinLock();   // propKin lock per the physics matrix (now incl. DS — see propKinLock())
    applyFusKinLock();    // v14 (C7.4): TB → fusKin locked to TiltBody
    // v14 (C3): only reconcile acState when the architecture ACTUALLY changed —
    // guards against clobbering a preserved historical raw value if the reviewer
    // merely re-clicks the already-selected G1 button while navigating around.
    // FIXED: force HoverCruise onto every figure of this architecture — no
    // question asked (this is a deliberate, in-session reclassification by the
    // reviewer, not a background/ingest overwrite, so it's exempt from the
    // "don't silently overwrite saved raw values" ingest rule on AC_STATE above).
    // CONVERTIBLE: clear a stale HoverCruise left over from a prior FIXED pick so
    // the reviewer is re-prompted; never touches any other value.
    if (S.topType !== _prevTopType) {
      (function(){
        var _arch1 = S.curArch + 1, _fixedNow = !isConvertibleArch(S.topType);
        Object.keys(S.figData || {}).forEach(function(f){
          if (figArchOf(f) !== _arch1) return;
          if (_fixedNow) { figSet(f, 'acState', 'HoverCruise'); }
          else if (figGet(f, 'acState') === 'HoverCruise') { figSet(f, 'acState', null); }
        });
      })();
    }
    renderPreserveScroll(); return;
  }
  
  var opt = tgt.closest('.opt');
  if(opt && !opt.classList.contains('dis')){
    // Boom-group option grids (M1): attach/span/long/orient single-select (re-click
    // toggles off), cards multi-select. Routed via data-bg-* onto S.boomGroups[idx].
    var bgField = opt.getAttribute('data-bg-field');
    if (bgField) {
      var bgIdx = parseInt(opt.getAttribute('data-bg-idx'), 10);
      var bgVal = decodeURIComponent(opt.getAttribute('data-bg-val'));
      var grp = (S.boomGroups || [])[bgIdx];
      if (grp) {
        if (bgField === 'hasProps') {
          grp.hasProps = (bgVal === 'yes');
        } else if (bgField === 'cards') {
          grp.cards = grp.cards || [];
          var cIx = grp.cards.indexOf(bgVal);
          if (cIx > -1) grp.cards.splice(cIx, 1); else grp.cards.push(bgVal);
        } else {
          grp[bgField] = (grp[bgField] === bgVal) ? null : bgVal;
        }
        markBatchDirty(); renderPreserveScroll();
      }
      return;
    }
    var field = opt.getAttribute('data-field'), arrfield = opt.getAttribute('data-arrfield');
    var figfield = opt.getAttribute('data-figfield'), figarrfield = opt.getAttribute('data-figarrfield');
    var val = decodeURIComponent(opt.getAttribute('data-val'));
    
    if(field){
      var prevWingConf = S[field];
      S[field] = val;
      // Audit B-05 Fix: clear wing orphan fields on wingConf change — BUT only
      // when switching to a genuinely different config. 'W' (Standard Wings) and
      // 'Oth' (Other) use the SAME countable-panel inputs, so switching between
      // them (or re-clicking the same value) must PRESERVE the wing details the
      // reviewer already entered, instead of wiping them.
      if(field === 'wingConf'){
          var panelled = ['W','Oth'];
          var bothPanelled = panelled.indexOf(prevWingConf) > -1 && panelled.indexOf(val) > -1;
          if (val !== prevWingConf && !bothPanelled) {
              S.wKin = null; S.wCount = (['BWB', 'FW', 'LB'].indexOf(val) > -1) ? 0 : 1;
              ['wTilt','wPosV','wPosL','wPlan','wRole','wPlanOth'].forEach(function(base){
                [1,2,3,4].forEach(function(i){ S[base+i] = (base==='wPlanOth')?'':null; });
              });
              // v15.3: clear the paired Wing Role "Other" notes too (key is
              // wRole<i>Oth — see otherNoteKey()), so no stale note survives.
              [1,2,3,4].forEach(function(i){ S['wRole'+i+'Oth'] = ''; });
          } else if (panelled.indexOf(val) > -1 && (!S.wCount || S.wCount < 1)) {
              // Entering a panelled config with no count yet — seed one panel.
              S.wCount = 1;
          }
      }
      renderPreserveScroll(); return;
    } else if (arrfield) {
      var arr = S[arrfield] || [], idx = arr.indexOf(val);
      if (idx > -1) arr.splice(idx, 1); else arr.push(val);
      S[arrfield] = arr; renderPreserveScroll(); return;
    } else if (figfield) {
      figSet((S.t2figNum||'1').trim(), figfield, val); renderPreserveScroll(); return;
    } else if (figarrfield) {
      var fN = (S.t2figNum||'1').trim(), fArr = figGet(fN, figarrfield, []), fIdx = fArr.indexOf(val);
      if (figarrfield === 'parts' && !figGet(fN, 'partsMulti', false)) {
        // SINGLE mode (default): radio-like. Click the selected token to clear,
        // otherwise replace the selection. parts stays an ARRAY (length 0 or 1) so
        // the export schema (recordToRows joins with "|") is unchanged.
        fArr = (fIdx > -1) ? [] : [val];
      } else {
        // MULTI mode (figData[fN].partsMulti) or any other figarrfield: legacy toggle.
        if (fIdx > -1) fArr.splice(fIdx, 1); else fArr.push(val);
      }
      figSet(fN, figarrfield, fArr);
      // Structural Elements -> Aircraft State coupling: any token OTHER than
      // "Whole Vehicle Layout" usually means this figure is a component
      // close-up, not a full-aircraft view, so "Aircraft State" doesn't
      // really apply. Pre-select Non-Applicable as the default in that case
      // (only if the reviewer hasn't already picked a state for this figure,
      // so a manual choice is never clobbered). Switching back to "Whole
      // Vehicle Layout" clears an auto-applied Non-Applicable so the
      // reviewer is prompted to pick a real state again.
      if (figarrfield === 'parts') {
        var isWholeVehicle = fArr.length === 1 && fArr[0] === 'Whole Vehicle Layout';
        var curAcState = figGet(fN, 'acState');
        if (!isWholeVehicle && !curAcState) {
          figSet(fN, 'acState', 'NonApplicable');
        } else if (isWholeVehicle && curAcState === 'NonApplicable') {
          figSet(fN, 'acState', null);
        }
      }
      renderPreserveScroll(); return;
    }
  }

  // Projected Level of Understanding by DINOv2 — lives on T2 but is keyed by
  // ARCHITECTURE (figArchOf of the active figure), not by figure and not by
  // patent: every figure tagged to the same architecture shares one rating,
  // stored in S.archDinoUnderstanding[archNum] (separate from figData and
  // from the G1/M1/M2/M3 archProfiles morphology snapshot).
  var archDinoBtn = tgt.closest('[data-arch-dino]');
  if (archDinoBtn) {
    var fNumAD = (S.t2figNum||'1').trim();
    var archAD = figArchOf(fNumAD);
    if (!S.archDinoUnderstanding) S.archDinoUnderstanding = {};
    S.archDinoUnderstanding[archAD] = archDinoBtn.getAttribute('data-arch-dino');
    renderPreserveScroll();
    return;
  }

  if (tgt.id === 'btn-fig-dup-set') {
    var dupPatentInput = document.getElementById('t2-dup-patent-input');
    var dupFigInput    = document.getElementById('t2-dup-fig-input');
    var dupPid = dupPatentInput ? dupPatentInput.value.trim() : '';
    if (dupPid) {
      var fNumDup = (S.t2figNum||'1').trim();
      var dupFig  = dupFigInput ? dupFigInput.value.trim() : '';
      figSet(fNumDup, 'dupOfPatent', dupPid);
      figSet(fNumDup, 'dupOfFig', dupFig);
      // Same image ⇒ same image-level labels. Copy the original figure's T2
      // labels in as an editable starting point (image-level only, not status),
      // mirroring how same-name aircraft share M1/M2/M3.
      var copied = dupFig ? applyDuplicateFigureLabels(fNumDup, dupPid, dupFig) : false;
      // Only a real copy commits the duplicate for export (per user rule). If the
      // source wasn't available to copy from, the figure stays flagged in the UI
      // but exports as NOT a duplicate until a copy actually succeeds.
      figSet(fNumDup, 'dupConfirmed', copied);
      var st = document.getElementById('batch-load-status');
      if (st) st.textContent = copied
        ? ' Copied FIG. ' + dupFig + ' labels from ' + dupPid + ' into FIG. ' + fNumDup + ' (editable).'
        : (dupFig ? ' Flagged duplicate — original FIG. ' + dupFig + ' not seen yet this session, no labels copied.' : ' Flagged duplicate.');
      renderPreserveScroll();
    }
    return;
  }
  // Copy all image labels from this architecture's MAIN figure onto the current
  // figure (editable). Reuses the same-patent copy path as duplicate images, but
  // does NOT flag the figure as a duplicate — it's just a label prefill.
  if (tgt.id === 'btn-fig-copy-main') {
    var fNumCM = (S.t2figNum||'1').trim();
    var mainCM = mainFigureOfArch(figArchOf(fNumCM));
    var okCM = (mainCM && mainCM !== fNumCM) ? applyDuplicateFigureLabels(fNumCM, '', mainCM) : false;
    if (BATCH) markBatchDirty();
    var stCM = document.getElementById('batch-load-status');
    if (stCM) stCM.textContent = okCM
      ? ' Copied image labels from main FIG. ' + mainCM + ' onto FIG. ' + fNumCM + ' (editable).'
      : ' No main-figure labels to copy yet — label and set a main figure first.';
    renderPreserveScroll(); return;
  }
  if (tgt.id === 'btn-fig-dup-clear') {
    var fNumDupClear = (S.t2figNum||'1').trim();
    figSet(fNumDupClear, 'dupOfPatent', '');
    figSet(fNumDupClear, 'dupOfFig', '');
    figSet(fNumDupClear, 'dupConfirmed', false);
    renderPreserveScroll();
    return;
  }
  // On-demand "Copy labels from FIG. X" for an already-flagged duplicate — pulls
  // the original figure's current T2 labels onto this figure. Handles the case
  // where the original was labeled AFTER this figure was flagged (so the
  // flag-time copy was empty/stale).
  if (tgt.id === 'btn-fig-dup-sync') {
    var fNumSync = (S.t2figNum||'1').trim();
    var srcPid = figGet(fNumSync, 'dupOfPatent', '');
    var srcFig = figGet(fNumSync, 'dupOfFig', '');
    var ok = (srcFig) ? applyDuplicateFigureLabels(fNumSync, srcPid, srcFig) : false;
    if (ok) figSet(fNumSync, 'dupConfirmed', true);   // commit the duplicate for export
    if (BATCH) markBatchDirty();
    var stS = document.getElementById('batch-load-status');
    if (stS) stS.textContent = ok
      ? ' Re-copied FIG. ' + srcFig + ' labels onto FIG. ' + fNumSync + '.'
      : ' Could not copy — FIG. ' + srcFig + ' has no labels yet (label it first).';
    renderPreserveScroll();
    return;
  }

  if (tgt.id === 'btn-parts-multi-toggle') {
    var fNumPM = (S.t2figNum||'1').trim();
    var nowMulti = !figGet(fNumPM, 'partsMulti', false);
    figSet(fNumPM, 'partsMulti', nowMulti);
    // Switching MULTI -> SINGLE while >1 token is selected: keep only the first
    // (single mode can hold at most one; the extra edge-case picks are dropped).
    if (!nowMulti) {
      var partsArrPM = figGet(fNumPM, 'parts', []);
      if (partsArrPM.length > 1) figSet(fNumPM, 'parts', [partsArrPM[0]]);
    }
    renderPreserveScroll();
    return;
  }

  if (tgt.id === 'btn-add-part') {
    var input = document.getElementById('t2-new-part');
    if (input && input.value.trim()) {
      var newTag = input.value.trim();
      // Persist the token session-wide so it appears on every subsequent patent
      // (previously it lived only in S.t2customParts, which fresh() wiped — that
      // is why a token like "test" vanished on the next patent).
      if (PART_TOKENS.indexOf(newTag) === -1) PART_TOKENS.push(newTag);
      if ((S.t2customParts || []).indexOf(newTag) === -1) { S.t2customParts = S.t2customParts || []; S.t2customParts.push(newTag); }
      var fN2 = (S.t2figNum||'1').trim(), arr2 = figGet(fN2, 'parts', []);
      // Auto-select the freshly created token. In single mode it REPLACES the
      // current selection (keeps parts length 1); in multi mode it is appended.
      if (figGet(fN2, 'partsMulti', false)) {
        if (arr2.indexOf(newTag) === -1) arr2.push(newTag);
      } else {
        arr2 = [newTag];
      }
      figSet(fN2, 'parts', arr2);
      renderPreserveScroll();
    }
    return;
  }

  var m3Btn = tgt.closest('.m3-btn');
  if(m3Btn){
    var comp = m3Btn.getAttribute('data-comp'), action = m3Btn.getAttribute('data-m3-action');
    // "Distinct propeller types" stepper (data-ntypes): clamp to [1, MAX].
    if (m3Btn.hasAttribute('data-ntypes')) {
      var nField = m3Field(comp,'ntypes'), nPrev = m3NTypes(comp), nCur = nPrev;
      if(action === 'inc') nCur += 1; if(action === 'dec') nCur -= 1;
      nCur = Math.min(M3_MAX_TYPES, Math.max(1, nCur));
      // Going 1 -> multi: migrate the single-type attributes (held under the bare
      // key) into Type 1's sub-key so the count/selections already entered aren't
      // lost when the per-type blocks appear.
      if (nPrev <= 1 && nCur > 1) {
        ['count','chord','orient','bmech','rmech','propKin','boomAttach','boomPosLong','boomPosSpan'].forEach(function(f){
          var bare = m3Field(comp, f), t1 = m3Field(comp + '__t1', f);
          if (S[t1] == null && S[bare] != null) S[t1] = S[bare];
        });
      }
      S[nField] = nCur; renderPreserveScroll(); return;
    }
    // Counts step by 1 for every component now — symmetric pairs are no longer
    // forced to even values (a reviewer may legitimately enter any count).
    var countField = m3Field(comp,'count'), cur = m3Count(comp);
    if(action === 'inc') cur += 1; if(action === 'dec') cur = Math.max(0, cur - 1);
    S[countField] = cur; renderPreserveScroll(); return;
  }

  var ib = tgt.closest('.ibtn');
  if(ib && !ib.hasAttribute('data-m3-action')){
    var f = ib.getAttribute('data-field'), mn = parseInt(ib.getAttribute('data-min'), 10), mx = parseInt(ib.getAttribute('data-max'), 10), d = ib.hasAttribute('data-dec') ? -1 : 1;
    S[f] = Math.min(mx, Math.max(mn, (S[f] || (f==='archCount'?1:0)) + d)); renderPreserveScroll(); return;
  }
});

document.getElementById('panel').addEventListener('change', function(e){
  var tgt = e.target; if (!tgt || !tgt.dataset) return;
  var field = tgt.dataset.field;

  // Aircraft / prototype name committed. Store it; if it matches a known
  // aircraft that already has a saved M1/M2/M3 snapshot, copy that in (editable)
  // and arm the T2→Done auto-jump. "(No-name aircraft)" stores no name and never
  // copies.
  if (tgt.id === 't1-aircraft-name') {
    var raw = (tgt.value||'').trim();
    // No-name is an explicit CHOICE (satisfies the T1 name gate) that stores no
    // name and — critically — returns HERE, before the snapshot lookup below,
    // so it can never trigger the known-aircraft M1/M2/M3 copy that picking a
    // real existing name does.
    if (raw === NO_NAME_AIRCRAFT) { T1_META.aircraftName = ''; S.t1NoNameConfirmed = true; S.aircraftAutoJump = false; renderPreserveScroll(); return; }
    T1_META.aircraftName = raw;
    S.t1NoNameConfirmed = false;   // a typed name replaces a prior No-name pick
    S.aircraftAutoJump = false;
    // Only auto-apply a snapshot on an EXACT normalized-key match — fuzzy matches
    // are intentionally different names (e.g. "Volocopter Gmbh 1" vs "Volocopter
    // Gmbh") and must not overwrite the name the user typed or steal the snapshot.
    var exactKey = raw ? normalizeAircraftName(raw).toLowerCase() : null;
    var hit = exactKey && AIRCRAFT_REGISTRY[exactKey] ? AIRCRAFT_REGISTRY[exactKey] : null;
    if (hit && hit.snapshot) {
      applyAircraftSnapshot(hit.snapshot);   // editable pre-fill of M1/M2/M3 (+G1)
      T1_META.aircraftName = hit.display;     // canonical display form
      S.aircraftAutoJump = true;              // Next on T2 skips straight to Done
    }
    renderPreserveScroll(); return;
  }

  if (tgt.hasAttribute('data-t2-arch')) { var fNum = (S.t2figNum||'1').trim(); if(fNum){ figSet(fNum, 'arch', tgt.value); renderPreserveScroll(); } return; }

  if (tgt.hasAttribute('data-fig-bool')) {
    var fNumBool = (S.t2figNum||'1').trim();
    if (fNumBool) { figSet(fNumBool, tgt.getAttribute('data-fig-bool'), tgt.checked); renderPreserveScroll(); }
    return;
  }

  // Part 6: Fu_ unlabeled figure → existing taxonomy FIG. assignment
  if (tgt.hasAttribute('data-fig-reassign')) {
    var srcFig = tgt.getAttribute('data-fig-reassign'), dstFig = tgt.value;
    if (dstFig) { reassignFigure(srcFig, dstFig); markBatchDirty(); renderPreserveScroll(); }
    return;
  }

  // Audit B-03 Fix: Defer t2figNum render to 'change' event to allow multi-digit
  // typing without losing focus. Full render() (not scroll-preserving) here is
  // intentional — switching the active figure resets to a clean top-of-panel view.
  if (field === 't2figNum') { S.t2figNum = tgt.value.trim(); render(); return; }

  if (field === 'isDuplicate') { S[field] = tgt.checked; if (tgt.checked) autoCopyDupMorphology(); renderPreserveScroll(); return; }
  if (field === 'duplicateId') { S.duplicateId = tgt.value.trim(); autofillDuplicateAircraftName(); autoCopyDupMorphology(); renderPreserveScroll(); return; }
  if (field === 'notPureArch') { S.notPureArch = tgt.checked; renderPreserveScroll(); return; }
  // Patent-level "images don't reflect semantics" toggle — re-render to reveal/hide
  // the "what does it appear to be?" architecture options.
  if (field === 'imgNotReflect') { S.imgNotReflect = tgt.checked; if (!tgt.checked) S.imgApparentArch = null; renderPreserveScroll(); return; }

  // Per-section human-uncertainty checkbox (v13) — data-human-uncertain="t1"/
  // "g1"/"m1"/"m2"/"m3". Re-render to reveal/hide the mandatory "Why?" note.
  if (tgt.dataset.humanUncertain) {
    S[tgt.dataset.humanUncertain + '_humanUncertain'] = tgt.checked;
    renderPreserveScroll(); return;
  }

  if (field && field.indexOf('m3_') === 0 && tgt.type === 'number') {
    // Free counts for all components — no odd→even coercion for symmetric ones.
    var val = parseInt(tgt.value, 10); if (isNaN(val) || val < 0) val = 0;
    S[field] = val; renderPreserveScroll(); return;
  }
  if (tgt.dataset && tgt.dataset.m3QuickCount && tgt.type === 'number') {
    // Quick Count Override (v13) total-propulsors input — NOT an m3_* key (see
    // M3_QUICK_KEY_RE); re-render so the page's total-count header stays in sync.
    var qcv = parseInt(tgt.value, 10);
    S[tgt.dataset.m3QuickCount + '_quickCount'] = (isNaN(qcv) || qcv < 0) ? null : qcv;
    renderPreserveScroll(); return;
  }
  if ((field === 'footLen' || field === 'footWid' || field === 'footHgt') && tgt.type === 'number') {
    var val3 = parseFloat(tgt.value); if (!isFinite(val3) || val3 < 0) val3 = 0;
    S[field] = val3; renderPreserveScroll(); return;
  }
  if (tgt.type === 'checkbox' && (field === 'latSym' || field === 'longSym')) { S[field] = tgt.checked; renderPreserveScroll(); return; }
  if (tgt.type === 'checkbox' && field === 'boomsPresent') { S.boomsPresent = tgt.checked; if (!tgt.checked) { S.boomGroups = []; } else if (!(S.boomGroups||[]).length) { S.boomGroups = [{ attach:null, wingSpan:null, span:null, long:null, orient:null, count:0, symmetric:true, circSymmetric:false, hasProps:null, cards:[] }]; } renderPreserveScroll(); return; }
  // boomXFormat checkbox retired v14 (C5) — BOOM_ORIENT's per-group 'X' option
  // supersedes it; the S.boomXFormat state key + ingest path are kept only for
  // old-save round-trip (see BOOM_ORIENT's comment), so no click handler needed.
  if (tgt.type === 'checkbox' && field === 'empTilts') { S.empTilts = tgt.checked; renderPreserveScroll(); return; }
  if (tgt.type === 'checkbox' && tgt.dataset && tgt.dataset.bgField === 'symmetric') { var sgi=parseInt(tgt.dataset.bgIdx,10); if(S.boomGroups[sgi]){ S.boomGroups[sgi].symmetric=tgt.checked; markBatchDirty(); renderPreserveScroll(); } return; }
  if (tgt.type === 'checkbox' && tgt.dataset && tgt.dataset.bgField === 'circSymmetric') { var sgi2=parseInt(tgt.dataset.bgIdx,10); if(S.boomGroups[sgi2]){ S.boomGroups[sgi2].circSymmetric=tgt.checked; markBatchDirty(); renderPreserveScroll(); } return; }
  if (tgt.type === 'number' && tgt.dataset && tgt.dataset.bgField === 'count') { var cgi=parseInt(tgt.dataset.bgIdx,10); if(S.boomGroups[cgi]){ var cv=parseInt(tgt.value,10); if(isNaN(cv)||cv<0)cv=0; S.boomGroups[cgi].count=cv; markBatchDirty(); renderPreserveScroll(); } return; }
  if (field && field.indexOf('m3_') === 0 && tgt.type === 'checkbox') {
    // Ticking "symmetric pairs" no longer bumps an odd count up to even —
    // counts are free for all components.
    S[field] = tgt.checked;
    renderPreserveScroll(); return;
  }
  if (tgt.tagName === 'SELECT') { S[field] = tgt.value; renderPreserveScroll(); return; }
});

document.getElementById('panel').addEventListener('input', function(e){
  var tgt = e.target;
  // Clicking a <datalist> suggestion (incl. "(No-name aircraft)") only
  // reliably fires 'input' in some browsers, not 'change' — the 'change'
  // listener below was the only place this got committed, so a datalist
  // click could visually fill the box without ever updating T1_META /
  // re-rendering. Commit immediately here too; the 'change' handler still
  // runs afterwards on blur/Enter and is a harmless no-op repeat.
  if (tgt && tgt.id === 't1-aircraft-name') {
    var rawImmediate = (tgt.value || '').trim();
    if (rawImmediate === NO_NAME_AIRCRAFT) {
      T1_META.aircraftName = ''; S.t1NoNameConfirmed = true; S.aircraftAutoJump = false; renderPreserveScroll(); return;
    }
  }
  if (tgt && tgt.hasAttribute && tgt.hasAttribute('data-fig-comment')) {
    var fNumC = (S.t2figNum||'1').trim();
    if (fNumC) figSet(fNumC, 'comment', tgt.value);
    return;
  }
  // Generic per-figure free-text field (e.g. data-fig-text="stateNote").
  if (tgt && tgt.dataset && tgt.dataset.figText) {
    var fNumFT = (S.t2figNum||'1').trim();
    if (fNumFT) figSet(fNumFT, tgt.dataset.figText, tgt.value);
    return;
  }
  // Quick Count Override (v13): section-level note (data-quick-note="g1"/"m1"/
  // "m2"/"t1"). The M3 per-station total-count input is numeric, so it's handled
  // in the 'change' listener below (with the other m3_* number fields) instead —
  // it needs to re-render to keep the page's total-count display in sync.
  if (tgt && tgt.dataset && tgt.dataset.quickNote) {
    S[tgt.dataset.quickNote + '_quickNote'] = tgt.value;
    return;
  }
  // Per-section human-uncertainty "Why?" note (v13) — data-uncertain-note="t1"/
  // "g1"/"m1"/"m2"/"m3", paired with the data-human-uncertain checkbox above.
  if (tgt && tgt.dataset && tgt.dataset.uncertainNote) {
    S[tgt.dataset.uncertainNote + '_uncertainNote'] = tgt.value;
    return;
  }
  // Shared categorical-"Other" note (v15.3, see otherNoteInput()). Two forms:
  // data-other-note="<key>" writes a flat S key; data-bg-note="<key>" +
  // data-bg-idx writes a sibling key on that boom group (boom fields are
  // per-group, not flat).
  if (tgt && tgt.dataset && tgt.dataset.otherNote) {
    S[tgt.dataset.otherNote] = tgt.value;
    return;
  }
  if (tgt && tgt.dataset && tgt.dataset.bgNote) {
    var _bgn = parseInt(tgt.dataset.bgIdx, 10);
    if (S.boomGroups && S.boomGroups[_bgn]) S.boomGroups[_bgn][tgt.dataset.bgNote] = tgt.value;
    return;
  }
  if (tgt && tgt.dataset && tgt.dataset.field) {
    var f = tgt.dataset.field;
    if (f === 'duplicateId') S.duplicateId = tgt.value;
    else if (f === 't1DisapproveReason') S.t1DisapproveReason = tgt.value;
    else if (f === 't1DisapproveOther') S.t1DisapproveOther = tgt.value;
    else if (f === 'empNotes') S.empNotes = tgt.value;
    else if (f === 'empTiltsNote') S.empTiltsNote = tgt.value;
    else if (f === 'fusNotes') S.fusNotes = tgt.value;
    else if (f === 'gearNotes') S.gearNotes = tgt.value;
    else if (f === 'wingNotes') S.wingNotes = tgt.value;
    else if (f === 'boomNotes') S.boomNotes = tgt.value;
    else if (f === 'comments') S.comments = tgt.value;
    else if (f === 'patentImageComments') S.patentImageComments = tgt.value;
    else if (f.indexOf('wPlanOth') === 0) S[f] = tgt.value;
    else if (f.indexOf('m3_') === 0 && f.indexOf('_notes') > -1) S[f] = tgt.value;
  }
});

// Wizard width control — cycles Compact (820px) / Wide (1200px) / Full (96vw) via
// the #btn-width-toggle button, persisting the choice in localStorage. Defaults to
// Wide on first use so the 4-column T2 layout has room. The class lives on .wiz
// (which render() never rebuilds), so the choice survives patent navigation.
(function(){
  var ORDER = ['compact','wide','full'];
  var LABEL = { compact:'Compact', wide:'Wide', full:'Full' };
  var wiz = document.querySelector('.wiz');
  var btn = document.getElementById('btn-width-toggle');
  function apply(mode){
    if (ORDER.indexOf(mode) === -1) mode = 'wide';
    if (wiz) {
      wiz.classList.remove('w-wide','w-full');
      if (mode === 'wide') wiz.classList.add('w-wide');
      else if (mode === 'full') wiz.classList.add('w-full');
    }
    if (btn) btn.innerHTML = '↔ Width: ' + LABEL[mode];
    try { localStorage.setItem('wizWidth', mode); } catch(e){}
  }
  var saved; try { saved = localStorage.getItem('wizWidth'); } catch(e){}
  apply(saved || 'wide');
  if (btn) btn.addEventListener('click', function(){
    var cur; try { cur = localStorage.getItem('wizWidth'); } catch(e){}
    cur = (ORDER.indexOf(cur) === -1) ? 'wide' : cur;
    apply(ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]);
  });
})();

// ── Refresh-safe session persistence ────────────────────────────────────────
// Mirrors the ENTIRE working session into localStorage so an F5 (or even a
// browser/tab close + reopen on the same machine) drops you back on the SAME
// patent, SAME architecture, SAME wizard step, with every reviewed-but-not-yet-
// exported patent, custom token, duplicate-image memory and in-progress edit
// intact — nothing left behind. localStorage (not sessionStorage) is used so it
// also survives closing the window; loading a different "Load Batch" file just
// overwrites it. Everything stored is plain JSON (no DOM/functions), so it
// round-trips cleanly. The batch .xlsx file itself can't be re-opened
// programmatically, so we persist its already-parsed rows (BATCH.byId) instead.
// ── Session persistence (IndexedDB, with a localStorage fallback) ───────────
// Large batches (the whole BATCH.byId row map + REVIEWED_ROWS) can blow past
// localStorage's ~5 MB cap, so the session blob lives in IndexedDB, which has no
// practical size limit. localStorage is kept only as a fallback for environments
// where IndexedDB can't be opened (e.g. some file:// configs), and to migrate a
// session saved by the older localStorage-only build.
var SESSION_KEY = 'evtolTaxonomySession_v1';   // legacy localStorage key (fallback + migration)
var IDB_NAME = 'evtolTaxonomyDB', IDB_STORE = 'session', IDB_KEY = 'current';
var _idbPromise = null, _idbBroken = false;
var _sessionReady = false;     // gate: never persist until restoreSession() has run,
                               // so the first paint can't clobber a saved session
var _persistTimer = null;

function _idbOpen() {
  if (_idbBroken) return Promise.reject('idb-unavailable');
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise(function(resolve, reject) {
    var req;
    try { req = indexedDB.open(IDB_NAME, 1); }
    catch (e) { _idbBroken = true; reject(e); return; }
    req.onupgradeneeded = function(){ try { req.result.createObjectStore(IDB_STORE); } catch (e) {} };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror   = function(){ _idbBroken = true; reject(req.error); };
  });
  return _idbPromise;
}
function _idbPut(value) {
  return _idbOpen().then(function(db){ return new Promise(function(resolve, reject){
    var tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, IDB_KEY);
    tx.oncomplete = function(){ resolve(true); };
    tx.onerror    = function(){ reject(tx.error); };
    tx.onabort    = function(){ reject(tx.error); };
  }); });
}
function _idbGet() {
  return _idbOpen().then(function(db){ return new Promise(function(resolve, reject){
    var tx = db.transaction(IDB_STORE, 'readonly');
    var rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
    rq.onsuccess = function(){ resolve(rq.result || null); };
    rq.onerror   = function(){ reject(rq.error); };
  }); });
}

function _serializeSession() {
  return {
    v: 1, ts: Date.now(),
    S: S, T1_META: T1_META, BATCH: BATCH, REVIEWED_ROWS: REVIEWED_ROWS,
    AIRCRAFT_REGISTRY: AIRCRAFT_REGISTRY, PART_TOKENS: PART_TOKENS,
    EDGE_TOKENS: EDGE_TOKENS, FIGURE_LABEL_REGISTRY: FIGURE_LABEL_REGISTRY,
    FIG_FILENAMES: FIG_FILENAMES, FIG_IMAGE_PATH: FIG_IMAGE_PATH
  };
}
// Write the whole session. Prefer IndexedDB (structured-clone, no size cap); fall
// back to localStorage if IDB is unavailable or its write fails.
function _writeSessionNow() {
  if (!_sessionReady) return;
  var snap = _serializeSession();
  _idbPut(snap).then(function(){
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}   // drop stale legacy copy
  }).catch(function(){
    // IDB unavailable/failed — best effort to localStorage (may hit quota on huge
    // batches, in which case it degrades silently like the old build did).
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(snap)); } catch (e) {}
  });
  // Mirror the same durable write out to the user's real file (crash-safe),
  // independent of IndexedDB. Self-guards when auto-save isn't linked.
  try { _writeAutosaveNow(); } catch (e) {}
}
function persistSession() {
  if (!_sessionReady) return;          // pre-restore renders must not overwrite the save
  if (_persistTimer) return;           // debounce: coalesce bursts of render() calls
  _persistTimer = setTimeout(function(){ _persistTimer = null; _writeSessionNow(); }, 400);
}

// Apply a deserialized snapshot onto the live globals, then paint. Shared by the
// IDB and localStorage-fallback restore paths. Calls done(true) on success,
// done(false) if the snapshot is missing/invalid.
function _applySession(snap, migrateToIdb, done) {
  if (!snap || snap.v !== 1 || !snap.S) { _sessionReady = true; done(false); return; }
  try {
    S = snap.S;
    if (snap.T1_META) T1_META = snap.T1_META;
    BATCH                 = snap.BATCH || null;
    REVIEWED_ROWS         = snap.REVIEWED_ROWS || [];
    AIRCRAFT_REGISTRY     = snap.AIRCRAFT_REGISTRY || {};
    PART_TOKENS           = snap.PART_TOKENS || [];
    EDGE_TOKENS           = snap.EDGE_TOKENS || [];
    FIGURE_LABEL_REGISTRY = snap.FIGURE_LABEL_REGISTRY || {};
    FIG_FILENAMES         = snap.FIG_FILENAMES || {};
    FIG_IMAGE_PATH        = snap.FIG_IMAGE_PATH || {};
    // blob: URLs die with the tab/page they were created in — never persisted
    // to the F5 snapshot, so always start clean on restore (an attached image
    // must be re-attached after a reload, same as it needs re-running
    // scripts/resolve_image_paths.py to become a real Image_Path).
    FIG_ATTACHED_URL      = {};
    // Back-fill the aircraft-name registry from the committed reviews. The
    // registry (which feeds the name datalist AND the one-click "Copy M1–M3
    // (+G1)") is normally only grown as patents are committed live, so on a
    // resumed session it can come back empty even though every reviewed
    // patent's name + morphology is sitting in REVIEWED_ROWS. Rebuild it from
    // those rows so both the suggestions and the copy-morphology shortcut work
    // straight after a resume.
    try {
      // Group reviewed rows by BASE patent id (collapsing _arch{N} suffixes),
      // iterating in REVIEWED_ROWS order so a later patent overwrites an
      // earlier one for the same aircraft — matching registerAircraft()'s
      // "latest wins".
      var _byId = {};
      (REVIEWED_ROWS || []).forEach(function(r){
        var pid = r && r.Patent_ID ? basePatentId(r.Patent_ID) : null; if (!pid) return;
        (_byId[pid] = _byId[pid] || []).push(r);
      });
      ingestRegistryFromRows(_byId);   // (a) names → datalist (additive, non-clobbering)

      // (b) reconstruct each aircraft's morphology snapshot (G1/M1/M2/M3) from
      // its latest reviewed patent's rows, using the same extractArchSnapshots()
      // the live "Copy morphology" picker uses. It save/restores the current S
      // and FIG_* lookups, so this is side-effect-free on the resumed patent.
      Object.keys(_byId).forEach(function(pid){
        var rows = _byId[pid];
        var nameRow = rows.find(function(r){ return r.Field === 'aircraftName'; });
        var nm = nameRow && nameRow.Value != null ? String(nameRow.Value).trim() : '';
        if (!nm) return;
        var disp = normalizeAircraftName(nm);
        if (!disp || disp === NO_NAME_AIRCRAFT) return;
        var entry = AIRCRAFT_REGISTRY[disp.toLowerCase()];
        if (!entry) return;
        try {
          var snaps = extractArchSnapshots(rows);
          var primary = snaps.find(function(s){ return s.arch === 1; }) || snaps[0];
          if (primary && primary.snapshot) entry.snapshot = primary.snapshot;   // latest wins
        } catch (e) {}
      });
    } catch (e) {}
    if (BATCH) {
      buildAssigneeGroups(BATCH.byId);    // deterministic derived map — safe to recompute
      populateJumpDatalist();
      var st = document.getElementById('batch-load-status');
      if (st) st.textContent = ' Resumed session — ' + ((BATCH.ids && BATCH.ids.length) || 0)
        + ' patent(s), batch: ' + (BATCH.label || '?') + ' (load a new file to start over).';
      var nav = document.getElementById('batch-nav'); if (nav) nav.style.display = 'flex';
    }
    _sessionReady = true;
    try { if (typeof updateSaveIndicator === 'function') updateSaveIndicator(); } catch (e) {}
    render();
    if (migrateToIdb) _writeSessionNow();   // upgrade a legacy localStorage session into IDB
    done(true);
  } catch (e) {
    _sessionReady = true;
    done(false);
  }
}
// Async restore: IndexedDB first, then the legacy localStorage blob (migrating it
// into IDB), then give up. Calls done(restored) exactly once.
function restoreSession(done) {
  function fromLocalStorage(migrate) {
    var raw = null; try { raw = localStorage.getItem(SESSION_KEY); } catch (e) {}
    if (!raw) { _sessionReady = true; done(false); return; }
    var ls = null; try { ls = JSON.parse(raw); } catch (e) {}
    _applySession(ls, migrate, done);
  }
  _idbGet().then(function(snap){
    if (snap) _applySession(snap, false, done);
    else fromLocalStorage(true);          // nothing in IDB yet — migrate any legacy LS session
  }).catch(function(){
    fromLocalStorage(false);              // IDB unavailable — stay on localStorage
  });
}

// Flush on the events that precede an F5/close/tab-switch. IndexedDB writes are
// async, so these are best-effort for the final still-debounced edit — but the
// per-render debounced writes keep IDB current to within a fraction of a second,
// so at most the last <400 ms of typing is ever at risk.
function _flushSession(){ if (_persistTimer) { clearTimeout(_persistTimer); _persistTimer = null; } _writeSessionNow(); }
window.addEventListener('beforeunload', _flushSession);
window.addEventListener('pagehide', _flushSession);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') _flushSession(); });

// Bootstrap: resume a saved session if one exists, otherwise first-time render.
restoreSession(function(restored){ if (!restored) render(); });
initAutosave();   // reload/re-link the durable auto-save file handle, if one exists
</script>
