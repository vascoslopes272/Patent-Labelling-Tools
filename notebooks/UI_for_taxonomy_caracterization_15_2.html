      h += '<div class="m2-kv">Wing Chordwise Position</div><div class="m2-zone">' + m3ZoneChordOptions().map(function(o){ return oc(m3Field(tkey,'zoneChord'), o.id, o.n); }).join('') + '</div>';
      h += '<div class="m2-kv">Wing Spanwise Position</div><div class="m2-zone">' + m3ZoneSpanOptions().map(function(o){ return oc(m3Field(tkey,'zoneSpan'), o.id, o.n); }).join('') + '</div>';
    } else {
      h += '<div class="m2-kv">Airframe Mounting Zones <span class="ilbl">(select all that apply)</span></div><div class="m2-zone">' + m3ZoneOptions(bp).map(function(o){ return ocArr(m3Field(tkey,'zone'), o.id, o.n); }).join('') + '</div>';
    }
  }
  // Boom geometry now lives in the M1 "Booms / Outriggers" boom groups; the card
  // only shows which boom group(s) carry it (see m3BoomCarrier, rendered card-level).
  return h;
}

// Card-level indicator: which M1 boom group(s) carry this boom card's propulsors.
// Replaces the old per-card/per-type boomAttach/boomPos inputs now that boom
// geometry is unified into the M1 boom groups (link = boomGroups[*].cards).
function m3BoomCarrier(bp) {
  if (!S.boomsPresent) {
    return flg('info','Booms','Enable “Booms / outriggers present” in the M1 “Booms / Outriggers” section to define boom geometry, then tick this card under a boom group’s “Carries propulsion card(s)”.');
  }
  var linked = [];
  (S.boomGroups || []).forEach(function(g, i){ if ((g.cards || []).indexOf(bp.key) > -1) linked.push({g:g, i:i}); });
  if (!linked.length) {
    return flg('info','Not linked to a boom group','Boom attachment & position are defined per boom group in M1. Link a boom group to this card there: “Carries propulsion card(s)” → “' + escHtml(bp.title) + '”.');
  }
  // Total booms across all linked groups (for propulsors-per-boom derived display).
  var totalBooms = 0;
  linked.forEach(function(r){
    var g = r.g;
    if (g.count != null && g.count !== '') {
      totalBooms += g.symmetric ? (parseInt(g.count,10)||0) * 2 : (parseInt(g.count,10)||0);
    }
  });
  var propCount = m3CardCount(bp.key);

  var lines = linked.map(function(r){
    var g = r.g, n = r.i + 1;
    var parts = ['<strong>Boom Group ' + n + '</strong>'];
    if (g.attach)  parts.push('Attachment: ' + escHtml(withLabel(g.attach, BOOM_ATTACH)));
    if (g.span)    parts.push('Spanwise: '   + escHtml(withLabel(g.span,   BOOM_POS_SPAN)));
    if (g.long)    parts.push('Long.: '      + escHtml(withLabel(g.long,   BOOM_POS_LONG)));
    if (g.orient)  parts.push('Orient.: '    + escHtml(withLabel(g.orient, BOOM_ORIENT)));
    if (g.count != null && g.count !== '') {
      var cnt = parseInt(g.count,10)||0;
      var boomTotal = g.symmetric ? cnt * 2 : cnt;
      var boomDesc = g.circSymmetric ? cnt + ' booms (radial/circular)' : g.symmetric ? boomTotal + ' booms (' + cnt + '/side, symmetric)' : boomTotal + ' boom(s)';
      parts.push('Booms: ' + boomDesc);
    }
    return parts.join(' · ');
  });

  // Propulsors-per-boom summary (sanity check across all linked groups).
  if (propCount > 0 && totalBooms > 0) {
    var perBoom = propCount / totalBooms;
    var perBoomStr = (perBoom === Math.floor(perBoom))
      ? perBoom + ' propulsor' + (perBoom !== 1 ? 's' : '') + '/boom'
      : '⚠ ' + propCount + ' propulsors ÷ ' + totalBooms + ' booms — not a whole number, check counts';
    lines.push('<em>' + propCount + ' total propulsors across ' + totalBooms + ' booms → ' + perBoomStr + '</em>');
  }

  return flg('info','Carried on boom group(s)', lines.join('<br>'));
}

// Quick Count Override (v13, rule 4a) — collapses a propulsion station's
// per-type subcards and detailed fields down to just a total-count input and
// the existing edge-case notes field. Shared by every station (boom, wing,
// fuselage, core_layout, hull_array, emp) via m3Card()'s override branch below.
function m3QuickOverrideBlock(bp) {
  var on = !!S[bp.key + '_quickOverride'];
  var cleanTitle = bp.title.replace(/\s*\[.*?\]/g, '');
  var h = '<div class="m3-field" style="margin-top:10px;"><button type="button" class="btn' + (on ? ' pri' : '') + '" data-m3-quick-override="' + bp.key + '">⚡ Quick count only (override detail fields)</button></div>';
  if (on) {
    var qc = S[bp.key + '_quickCount'];
    h += '<div class="m3-field" style="margin-top:10px;"><div class="m3-label">Total propulsors at this station</div><input class="m3-num" type="number" min="0" step="1" inputmode="numeric" data-m3-quick-count="' + bp.key + '" value="' + (qc != null ? qc : '') + '" placeholder="0"></div>'
      + '<div class="m3-field" style="margin-top:10px;"><div class="m3-label">' + escHtml(cleanTitle) + ' Edge-Case Notes</div><textarea class="comments" style="min-height:48px;" data-field="' + m3Field(bp.key, 'notes') + '" placeholder="Describe briefly — e.g. \'2 ducted front + 2 open rear\'">' + escHtml(m3Get(bp.key, 'notes', '')) + '</textarea></div>';
  }
  return h;
}

function m3Card(bp) {
  if (S[bp.key + '_quickOverride']) {
    // Detailed fields skipped entirely — see m3QuickOverrideBlock() / rule 4c.
    return '<div class="m3-card"><div class="m3-head">' + bp.title + '</div><div class="m3-sub">' + bp.subtitle + '</div>'
      + (bp.isBoom ? m3BoomCarrier(bp) : '')
      + m3QuickOverrideBlock(bp)
      + '</div>';
  }
  var count = m3CardCount(bp.key), sym = m3Get(bp.key, 'sym', bp.defaultSym);
  var symLong = m3SymLong(bp.key);
  // Both symmetry checkboxes for this card, rendered as one unit so the lateral
  // and longitudinal mirror planes always appear together.
  var symCirc = m3SymCirc(bp.key);
  var symChecks = '<label class="m2-check"><input type="checkbox" data-field="' + m3Field(bp.key,'sym') + '" ' + (sym ? 'checked' : '') + '> Laterally Symmetric Pairs</label>'
    + '<label class="m2-check"><input type="checkbox" data-field="' + m3Field(bp.key,'symLong') + '" ' + (symLong ? 'checked' : '') + '> Longitudinally Symmetric (Fore/Aft)</label>'
    + '<label class="m2-check"><input type="checkbox" data-field="' + m3Field(bp.key,'symCirc') + '" ' + (symCirc ? 'checked' : '') + '> Circular / Radial Symmetry</label>';
  var notes = m3Get(bp.key, 'notes', '');
  var isRotorcraft = (S.topType === 'RC' || S.topType === 'MR');
  var nTypes = m3NTypes(bp.key);

  var h = '<div class="m3-card"><div class="m3-head">' + bp.title + '</div><div class="m3-sub">' + bp.subtitle + '</div>'
    + (bp.isBoom ? m3BoomCarrier(bp) : '')
    + '<div class="m2-tools"><div class="m2-row">';

  if (isRotorcraft) {
     // RC = one central (single/coaxial) hub: symmetry is meaningless, so no
     // checkboxes. MR = a DISTRIBUTED multirotor array (e.g. a quad is both
     // laterally and fore/aft symmetric), so it gets the same two symmetry
     // checkboxes as every other card.
     if(S.topType === 'RC') h += '<div class="flag info" style="margin-top:0;">Single/Coaxial Main Hub Prescribed</div>';
     else if (nTypes > 1) h += symChecks + '<div class="flag info" style="margin:0 0 0 12px; padding:6px 10px;">Total across types: <b>' + count + '</b></div>';   // MR multi-type: per-type counts live in the blocks below
     else h += '<div class="m2-count-wrap"><button class="m3-btn ibtn" type="button" data-m3-action="dec" data-comp="' + bp.key + '">−</button><input class="m2-count" type="number" min="0" step="1" inputmode="numeric" data-field="' + m3Field(bp.key,'count') + '" value="' + m3Count(bp.key) + '"><button class="m3-btn ibtn" type="button" data-m3-action="inc" data-comp="' + bp.key + '">+</button></div>' + symChecks;
  } else if (nTypes <= 1) {
     // Legacy single-type: count lives in the header, stored under the bare key.
     h += '<div class="m2-count-wrap"><button class="m3-btn ibtn" type="button" data-m3-action="dec" data-comp="' + bp.key + '">−</button><input class="m2-count" type="number" min="0" step="1" inputmode="numeric" data-field="' + m3Field(bp.key,'count') + '" value="' + m3Count(bp.key) + '"><button class="m3-btn ibtn" type="button" data-m3-action="inc" data-comp="' + bp.key + '">+</button></div>' + symChecks;
  } else {
     // Multi-type: per-type counts live inside each type block below, so the
     // header shows the computed total instead of an editable count.
     h += symChecks
        + '<div class="flag info" style="margin:0 0 0 12px; padding:6px 10px;">Total across types: <b>' + count + '</b></div>';
  }
  h += '</div></div>';

  // "How many distinct propeller types?" — shown for every card EXCEPT the RC
  // single/coaxial hub (physically one type). Multirotors (MR) get it too: a
  // boom/array can mix e.g. lift rotors + pusher props as separate attribute sets.
  if (!isRotorcraft || S.topType === 'MR') {
    h += '<div class="m2-tools" style="margin-top:6px;"><div class="m2-row"><div class="m2-kv" style="margin:0 8px 0 0;">Distinct propeller types here</div>'
      + '<div class="m2-count-wrap"><button class="m3-btn ibtn" type="button" data-m3-action="dec" data-comp="' + bp.key + '" data-ntypes="1">−</button>'
      + '<input class="m2-count" type="number" min="1" max="' + M3_MAX_TYPES + '" step="1" inputmode="numeric" data-field="' + m3Field(bp.key,'ntypes') + '" value="' + nTypes + '">'
      + '<button class="m3-btn ibtn" type="button" data-m3-action="inc" data-comp="' + bp.key + '" data-ntypes="1">+</button></div>'
      + '<div class="m3-sub" style="margin:0 0 0 10px;">Set &gt;1 when the same wing/zone mixes different propellers (e.g. some fixed, some tilting).</div></div></div>';
  }

  // Show the attribute section when there's a count, when RC (single hub), OR
  // whenever multiple propeller types are declared — in multi-type mode each
  // type carries its OWN count stepper inside its block, so the blocks must be
  // visible BEFORE any count is entered (otherwise there's nowhere to set them).
  if (count > 0 || S.topType === 'RC' || ((!isRotorcraft || S.topType === 'MR') && nTypes > 1)) {
    if (isRotorcraft) {
      h += physicsLock(S.topType, 'thrust kinematics and spatial localization are taxonomy-fixed for a rotorborne hub — only the blade / rotor type is recorded here (articulation is ' + (propKinLock(S.topType) || 'n/a') + ').');
      if (S.topType === 'MR' && nTypes > 1) {
        // Multirotor with several distinct propulsor types — one block per type,
        // each with its own count + blade/rotor classification + mounting zone,
        // since different propulsor types on the same card can sit in different
        // airframe locations (e.g. wing-tip lifters vs fuselage pushers).
        for (var tr = 1; tr <= nTypes; tr++) {
          var tkr = m3TypeKey(bp.key, tr);
          h += '<div class="m3-card" style="margin-top:10px; padding:12px; background:var(--bg2);"><div class="m3-head">Propeller Type ' + tr + '</div>'
             + '<div class="m2-tools"><div class="m2-row"><div class="m2-kv" style="margin:0 8px 0 0;">Count of this type</div>'
             + '<div class="m2-count-wrap"><button class="m3-btn ibtn" type="button" data-m3-action="dec" data-comp="' + tkr + '">−</button>'
             + '<input class="m2-count" type="number" min="0" step="1" inputmode="numeric" data-field="' + m3Field(tkr,'count') + '" value="' + m3Count(tkr) + '">'
             + '<button class="m3-btn ibtn" type="button" data-m3-action="inc" data-comp="' + tkr + '">+</button></div></div></div>'
             + '<div class="m2-kv">Visual Blade/Rotor Classification</div>' + grid('', BLADE_MECH.map(function(o){ return oc(m3Field(tkr,'bmech'), o.id, o.n); }))
             + (bp.zoneMode ? '<div class="m2-kv">Airframe Mounting Zones <span class="ilbl">(select all that apply)</span></div><div class="m2-zone">' + m3ZoneOptions(bp).map(function(o){ return ocArr(m3Field(tkr,'zone'), o.id, o.n); }).join('') + '</div>' : '')
             + '</div>';
        }
      } else {
        h += '<div class="m2-kv">Visual Blade/Rotor Classification</div>' + grid('', BLADE_MECH.map(function(o){ return oc(m3Field(bp.key,'bmech'), o.id, o.n); }));
      }
    } else if (nTypes <= 1) {
      // Legacy single-type: attributes stored under the bare key, count in header.
      h += m3TypeAttrs(bp, bp.key, false);
    } else {
      // Multi-type: one labelled attribute block per declared type.
      for (var ti = 1; ti <= nTypes; ti++) {
        h += '<div class="m3-card" style="margin-top:10px; padding:12px; background:var(--bg2);"><div class="m3-head">Propeller Type ' + ti + '</div>'
           + m3TypeAttrs(bp, m3TypeKey(bp.key, ti), true) + '</div>';
      }
    }

    // Rotorcraft (RC/MR single-type) doesn't go through m3TypeAttrs, so its
    // mounting zone is rendered here at the card level. MR multi-type renders zone
    // inside each per-type block above (stored under tkr, not bp.key).
    if (bp.zoneMode && isRotorcraft && !(S.topType === 'MR' && nTypes > 1)) {
        h += '<div class="m2-kv">Airframe Mounting Zones <span class="ilbl">(select all that apply)</span></div><div class="m2-zone">' + m3ZoneOptions(bp).map(function(o){ return ocArr(m3Field(bp.key,'zone'), o.id, o.n); }).join('') + '</div>';
    }
  }

  var cleanTitle = bp.title.replace(/\s*\[.*?\]/g, '');
  h += '<div class="m3-field" style="margin-top:12px; padding-top:12px; border-top:1px dashed var(--border2);"><div class="m3-label" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">' + escHtml(cleanTitle) + ' Edge-Case Notes <button type="button" class="btn" data-m3-quick-override="' + bp.key + '" style="padding:2px 8px; font-size:11px; font-weight:400;">⚡ Quick count only (override detail fields)</button></div><textarea class="comments" style="min-height:48px;" data-field="' + m3Field(bp.key, 'notes') + '" placeholder="Log ' + escHtml(cleanTitle.toLowerCase()) + ' propulsive edge cases...">' + escHtml(notes) + '</textarea></div>';
  h += '</div>';
  return h;
}

function m3Ready(){
  if (S.topType === 'RC') {
    // Quick Count Override (rule 4c): the bare-hub RC short-circuit normally reads
    // bmech directly, but that field is hidden while core_layout is overridden.
    if (S.core_layout_quickOverride) return S.core_layout_quickCount != null && S.core_layout_quickCount !== '';
    return !!m3Get('core_layout', 'bmech');
  }
  var cards = m3Blueprints(), anyCount = false;
  for (var i = 0; i < cards.length; i++) {
    var bp = cards[i];
    if (S[bp.key + '_quickOverride']) {
      // Quick Count Override (rule 4c): detailed fields are skipped entirely for
      // this station — only the total count matters (mandatory-ness is itemized
      // separately in nextBlockers so the reviewer sees which station is missing it).
      if (S[bp.key + '_quickCount'] != null && S[bp.key + '_quickCount'] !== '') anyCount = true;
      continue;
    }
    var count = m3CardCount(bp.key);
    if (count > 0) anyCount = true;
    if (count > 0) {
      // (Symmetric components no longer require an even count — any count is valid.)
      var isRC = (S.topType === 'RC' || S.topType === 'MR');
      if (isRC) {
        // Rotorcraft / multirotor cards render ONLY the blade/rotor type and a
        // card-level mounting zone (chord/orient/rmech are never shown for them),
        // so validate exactly those — requiring the un-rendered fields made MR
        // impossible to complete (Next never enabled). RC also reaches here for
        // an empennage card; the bare-hub RC core_layout still short-circuits above.
        var nTr = m3NTypes(bp.key);
        if (S.topType === 'MR' && nTr > 1) {
          // Multi-type multirotor: each declared type needs its own blade type + zone.
          for (var tt = 1; tt <= nTr; tt++) {
            var ttk = m3TypeKey(bp.key, tt);
            if (!m3Get(ttk, 'bmech')) return false;
            if (bp.zoneMode && !(m3Get(ttk, 'zone') || []).length) return false;
          }
        } else {
          if (!m3Get(bp.key, 'bmech')) return false;
          if (bp.zoneMode && !(m3Get(bp.key, 'zone') || []).length) return false;
        }
      } else {
        // Each declared propeller type must have its core attributes set, AND
        // (now) its own mounting-zone position. For legacy single-type cards the
        // type-key IS the bare card key.
        var nT = m3NTypes(bp.key);
        for (var t = 1; t <= nT; t++) {
          var tk = nT <= 1 ? bp.key : m3TypeKey(bp.key, t);
          if (!m3Get(tk, 'chord') || !m3Get(tk, 'orient') || !m3Get(tk, 'bmech') || !m3Get(tk, 'rmech')) return false;
          // Propulsor Articulation (2026-07-02 completeness enforcement): locked
          // by the physics matrix for most topologies (the render shows it
          // pre-selected+disabled and buildMorphologyObj exports the lock), but
          // FREE on TP & CVT — where it was never required, so those two could
          // export a null articulation. Only enforce when unlocked.
          if (!propKinLock(S.topType) && !m3Get(tk, 'propKin')) return false;
          if (bp.zoneMode) {
            if (bp.key.indexOf('wing') > -1) {
              if (!m3Get(tk, 'zoneChord') || !m3Get(tk, 'zoneSpan')) return false;
            } else {
              if (!(m3Get(tk, 'zone') || []).length) return false;
            }
          }
        }
      }
    }
  }
  return anyCount;
}

function m1FootprintArea() { var len = parseFloat(S.footLen), wid = parseFloat(S.footWid); if (!isFinite(len) || !isFinite(wid)) return ''; return (len * wid).toFixed(2); }
function labelFor(list, id) { var item = list.find(function(x){ return x.id === id; }); return item ? item.n : id; }
function escHtml(txt) { return String(txt || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
// Canonicalise an aircraft/prototype name so entries differing only by
// capitalization (e.g. "joby s4" vs "JOBY S4" vs "Joby S4") collapse to one
// consistent display form. Title-cases every word so casing variants always
// agree; alphanumeric designators (tokens containing a digit, e.g. S4, X2,
// 216, EH216) are uppercased since their canonical form is upper-case.
function normalizeAircraftName(name) {
  var s = String(name || '').trim().replace(/\s+/g, ' ');
  if (!s) return '';
  return s.split(' ').map(function(w){
    if (/\d/.test(w)) return w.toUpperCase();   // designators: S4, X2, 216, EH216…
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
}
function wingField(base, idx) { return base + idx; }

function oc(field,val,name,desc,oid,dis){
  var sel=S[field]===val, enc=encodeURIComponent(val), tt=(desc||name).replace(/"/g, '&quot;');
  return '<div class="opt'+(sel?' sel':'')+(dis?' dis':'')+'" data-field="'+field+'" data-val="'+enc+'" title="'+tt+'">'
    +(oid?'<div class="o-id">'+oid+'</div>':'')+'<div class="o-name">'+name+'</div>'+(desc?'<div class="o-desc">'+desc+'</div>':'')+'</div>';
}
function ocArr(field,val,name,desc,oid,dis) {
  var arr=S[field]||[], sel=arr.indexOf(val)>-1, enc=encodeURIComponent(val);
  return '<div class="opt'+(sel?' sel':'')+(dis?' dis':'')+'" data-arrfield="'+field+'" data-val="'+enc+'"><div class="o-name">'+name+'</div></div>';
}

function ocFig(key, val, name, desc, oid, dis) {
  var fNum = (S.t2figNum||'').trim();
  var current = figGet(fNum, key);
  var sel = current === val, enc = encodeURIComponent(val), tt = (desc||name).replace(/"/g, '&quot;');
  return '<div class="opt'+(sel?' sel':'')+(dis?' dis':'')+'" data-figfield="'+key+'" data-val="'+enc+'" title="'+tt+'">'
       + (oid?'<div class="o-id">'+oid+'</div>':'')+'<div class="o-name">'+name+'</div>'+(desc?'<div class="o-desc">'+desc+'</div>':'')+'</div>';
}
// v15.2: reusable "Other" free-text note for a per-figure categorical field —
// mirrors the wizard's existing categorical-Other pattern (a sibling note
// field, mandatory when "Other" is picked; see t1DisapproveOther/wPlanOth
// for the non-per-figure precedent). noteKey rides the existing generic
// data-fig-text handler (same one stateNote already uses), so no new JS
// wiring is needed beyond FIG_LABEL_KEYS/export/ingest housekeeping.
function figOtherNoteInput(fNum, curVal, noteKey, placeholder) {
  if (curVal !== 'Other') return '';
  return '<div style="margin-top:6px;"><textarea class="m3-num" data-fig-text="' + noteKey + '" placeholder="' + placeholder + '" style="width:100%;min-height:40px;padding:8px;resize:vertical;font-size:13px;">'
       + escHtml(figGet(fNum, noteKey, '')) + '</textarea></div>';
}
function ocArrFig(key, val, name, desc, oid, dis) {
  var fNum = (S.t2figNum||'').trim();
  var arr = figGet(fNum, key, []);
  var sel = arr.indexOf(val) > -1, enc = encodeURIComponent(val);
  return '<div class="opt'+(sel?' sel':'')+(dis?' dis':'')+'" data-figarrfield="'+key+'" data-val="'+enc+'"><div class="o-name">'+name+'</div></div>';
}

function dupTypeCard(t) {
  var sel = S.duplicateType === t.id;
  return '<div class="opt'+(sel?' sel':'')+'" data-dup-type="'+t.id+'"><div class="o-id">Type '+t.id+'</div><div class="o-name">'+t.n+'</div><div class="o-desc">'+t.d+'</div></div>';
}

function qualityChip(q) {
  var fNum = (S.t2figNum||'1').trim();
  var current = figGet(fNum, 'qualityFlag', 'clean');
  var sel = current === q.id;
  return '<div class="opt'+(sel?' sel':'')+'" data-fig-quality="'+q.id+'" title="'+escHtml(q.d)+'"><div class="o-name">'+q.n+'</div></div>';
}

function t2AllFigNums() {
  var nums = Object.keys(S.figData);
  var re = /FIG\.?\s*(\d+[A-Za-z]?)/gi, m;
  while ((m = re.exec(T1_META.descriptionOfDrawings))) {
    var n = m[1];
    if (nums.indexOf(n) === -1) nums.push(n);
  }
  nums = nums.filter(function(v,i,a){ return a.indexOf(v)===i; });
  nums.sort(function(a,b){
    var na = parseInt(a,10), nb = parseInt(b,10);
    if (na !== nb) return na-nb;
    return a.localeCompare(b);
  });
  return nums;
}

// Real, numbered FIG. entries from the patent's own description of drawings —
// the existing taxonomy framework that unlabeled Fu_ images get assigned into.
// Excludes Fu_ placeholder keys so the dropdown never offers another unlabeled
// figure as a target.
function t2RealFigNums() {
  return t2AllFigNums().filter(function(n){ return !/^Fu/i.test(n); });
}

// Merge an unlabeled Fu_ figure's data into an existing real FIG. entry
// (Part 6: no free-text labeling field — reassignment reuses the structured
// taxonomy that's already there). Existing target values win on conflict;
// the Fu_ entry's values only fill gaps. Updates t2figNum/mainFigure if they
// pointed at the now-removed Fu_ key.
function reassignFigure(sourceFig, targetFig) {
  if (!sourceFig || !targetFig || sourceFig === targetFig) return;
  var src = S.figData[sourceFig];
  if (src) {
    if (!S.figData[targetFig]) S.figData[targetFig] = {};
    var dst = S.figData[targetFig];
    Object.keys(src).forEach(function(k){ if (dst[k] == null) dst[k] = src[k]; });
    delete S.figData[sourceFig];
  }
  if (S.t2figNum === sourceFig) S.t2figNum = targetFig;
  // The per-figure isMain flag travels with figData (merged above), so no
  // separate main-figure fix-up is needed when reassigning.
}

function figGridCard(fNum) {
  var status = figGet(fNum,'status',null);
  var dotColor = status==='approved' ? 'var(--ok)' : status==='disapproved' ? 'var(--danger)' : 'var(--text3)';
  var qFlag = figGet(fNum,'qualityFlag',null);
  var qBadge = (qFlag && qFlag !== 'clean') ? '<span style="font-size:9px;font-family:var(--mono);text-transform:uppercase;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bdr);border-radius:3px;padding:1px 5px;">'+escHtml(qFlag)+'</span>' : '';
  var dupOfPatent = figGet(fNum,'dupOfPatent',null);
  var dupBadge = dupOfPatent ? '<span title="Same image as ' + escHtml(dupOfPatent) + (figGet(fNum,'dupOfFig',null) ? (' FIG.' + escHtml(figGet(fNum,'dupOfFig',null))) : '') + '" style="font-size:9px;font-family:var(--mono);text-transform:uppercase;background:var(--accent-bg,#eef);color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:1px 5px;">DUP IMG</span>' : '';
  var per = figGet(fNum,'per','—'), sym = figGet(fNum,'sym','—'), acSty = figGet(fNum,'acSty','—');
  var active = (S.t2figNum === fNum);
  var realPath = realFigImage(fNum);
  var placeholder = 'https://placehold.co/160x110/E8E7E0/5A5955?text=FIG.+' + escHtml(fNum);
  var showText = figGet(fNum,'gridShowText',false);
  var isUnlabeled = /^Fu/i.test(fNum);

  // Approve/Disapprove visual feedback (per-image green/red border glow). The
  // border reflects ONLY the approve/disapprove status — NOT selection. Clicking
  // the card body just selects the figure (loads the detail panel); it must not
  // recolor the card. Selection is shown by a subtle outline ring instead, so a
  // body-click never looks like an approval action.
  var border = status==='approved'
      ? 'border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-bdr),0 0 12px rgba(26,127,78,.35);'
    : status==='disapproved'
      ? 'border-color:var(--danger);box-shadow:0 0 0 2px var(--danger),0 0 12px rgba(192,57,43,.32);'
    : 'border-color:var(--border);';
  // Selection ring: a thin neutral outline (not a border-color change) so the
  // active card is findable without implying approve/disapprove.
  if (active) border += 'outline:2px solid var(--accent);outline-offset:1px;';

  // Image area: real crop with an onerror fallback to the placeholder, OR a
  // text panel when the user toggled "Text" or no real image exists at all
  // (missing/broken source). The text panel surfaces the same labels so the
  // figure stays reviewable even with no usable image.
  var textPanel =
      '<div style="width:100%;height:110px;border-radius:4px;background:var(--bg2);border:1px dashed var(--border2);'
    + 'display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px;box-sizing:border-box;overflow:hidden;">'
    + '<div style="font-size:11px;font-family:var(--mono);font-weight:600;color:var(--text2);">FIG. '+escHtml(fNum)+'</div>'
    + '<div style="font-size:10px;color:var(--text3);">'+escHtml(per)+' &middot; '+escHtml(sym)+'</div>'
    + '<div style="font-size:10px;color:var(--text3);">'+escHtml(acSty)+'</div>'
    + (realPath ? '' : '<div style="font-size:9px;color:var(--warn);margin-top:2px;">no image on disk</div>')
    + '</div>';
  var imageArea = (showText || !realPath)
    ? textPanel
    : '<img src="'+realPath+'" onerror="this.onerror=null;this.src=\''+placeholder+'\';this.dataset.broken=\'1\';" style="width:100%;border-radius:4px;display:block;'+(dupOfPatent?'opacity:0.7;':'')+'">';

  return '<div class="m3-card" style="padding:8px;cursor:pointer;'+border+'" data-fig-card="'+escHtml(fNum)+'">'
    + '<div style="position:relative;">'+imageArea
    + '<span style="position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:'+dotColor+';border:1px solid #fff;"></span></div>'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:4px;"><span style="font-size:11px;font-family:var(--mono);font-weight:600;">FIG. '+escHtml(fNum)+'</span>'+qBadge+dupBadge+'</div>'
    + '<div style="font-size:10px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+escHtml(per)+' &middot; '+escHtml(sym)+'</div>'
    + '<div style="font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+escHtml(acSty)+'</div>'
    // Per-image Approve / Disapprove + Text toggle. Buttons carry data-grid-*
    // attributes handled before the card-select branch so a click here toggles
    // status (and re-applies the glow) instead of just selecting the figure.
    + '<div style="display:flex;gap:4px;margin-top:7px;">'
      + '<button type="button" data-grid-approve="'+escHtml(fNum)+'" title="Approve image" style="flex:1;padding:3px 0;font-size:11px;border-radius:4px;cursor:pointer;border:1px solid '+(status==='approved'?'var(--ok)':'var(--border)')+';background:'+(status==='approved'?'var(--ok)':'var(--surface)')+';color:'+(status==='approved'?'#fff':'var(--ok)')+';">✓</button>'
      + '<button type="button" data-grid-disapprove="'+escHtml(fNum)+'" title="Disapprove image" style="flex:1;padding:3px 0;font-size:11px;border-radius:4px;cursor:pointer;border:1px solid '+(status==='disapproved'?'var(--danger)':'var(--border)')+';background:'+(status==='disapproved'?'var(--danger)':'var(--surface)')+';color:'+(status==='disapproved'?'#fff':'var(--danger)')+';">✗</button>'
      + '<button type="button" data-grid-text-toggle="'+escHtml(fNum)+'" title="Toggle image / text labels" style="flex:0 0 auto;padding:3px 8px;font-size:10px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);">'+(showText?'🖼':'🅣')+'</button>'
    + '</div>'
    // Part 6: unlabeled Fu_ images get assigned into an existing FIG. from this
    // patent's own description of drawings — no free-text labeling field.
    + (isUnlabeled
        ? '<select data-fig-reassign="'+escHtml(fNum)+'" style="width:100%;margin-top:6px;font-size:10px;padding:3px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text2);" onclick="event.stopPropagation();">'
          + '<option value="">Assign to FIG…</option>'
          + t2RealFigNums().map(function(n){ return '<option value="'+escHtml(n)+'">FIG. '+escHtml(n)+'</option>'; }).join('')
          + '</select>'
        : '')
    + '</div>';
}

// Per-section human-uncertainty flag (v13) — sits next to a section's notes area
// (commentsSection() for T1/G1/M1/M2/M3, or otherCommentaryPage()'s free-text box
// for an isOtherArch() M1/M2/M3 page). Checking it requires a short "Why?" note —
// enforced in nextBlockers() (see the t1/gate/m1/m2/m3 blocks), UNGATED by the
// Quick Count Override collapse — this flag stays visible/checkable either way.
// State lives in S[sectionKey+'_humanUncertain'] / S[sectionKey+'_uncertainNote'].
function humanUncertainToggle(sectionKey) {
  var on = !!S[sectionKey + '_humanUncertain'];
  var h = '<div class="m3-card" style="margin-bottom:12px;">'
    + '<label class="m2-check" style="font-size:13px; font-weight:500; color:var(--warn); cursor:pointer;">'

// ── Shared categorical-"Other" mandatory note (v15.3) ───────────────────────
// The codebook requires a note wherever 'Other' is chosen, because categorical
// dimensions never carry free text directly. Nine dimensions were still missing
// one (Boom Attachment / Longitudinal / Spanwise / Orientation, Wing Role,
// Empennage Type, Wing Architecture, Fuselage Shape, Propulsor Articulation), so
// rather than nine one-off fields these three helpers do it for any of them:
//   otherNoteInput(field, placeholder [, bgIdx])  renders the note box
//   otherBlocker(field, label [, bgIdx])          gates the Next button
// mirroring how humanUncertainToggle()/uncertainBlocker() already behave, and
// reusing the same note-box styling (.m3-num).
// The note lives in <field>+'Oth': a flat S key normally (fusShape → fusShapeOth,
// m3_wing1_propKin → m3_wing1_propKinOth), or a sibling key ON the boom group
// object when bgIdx is given (attach → S.boomGroups[i].attachOth), since boom
// fields are per-group, not flat. Both ids 'Other' and 'Oth' count as Other —
// the option lists use both spellings and neither is worth renaming.
// (The four T2 rendering notes, the figure edge note and the wing planform note
// pre-date this and keep their own existing fields — see figOtherNoteInput()
// and wPlanOth — so no saved file changes shape.)
function isOtherVal(v){ return v === 'Other' || v === 'Oth'; }
function otherNoteKey(field){ return field + 'Oth'; }
function otherNoteOwner(bgIdx){
  return (bgIdx == null) ? S : ((S.boomGroups || [])[bgIdx] || null);
}
function otherNoteInput(field, placeholder, bgIdx){
  var own = otherNoteOwner(bgIdx);
  if (!own || !isOtherVal(own[field])) return '';
  var k = otherNoteKey(field);
  var bgAttrs = (bgIdx == null)
    ? ' data-other-note="' + k + '"'
    : ' data-bg-idx="' + bgIdx + '" data-bg-note="' + k + '"';
  return '<div class="m3-field" style="margin-top:8px;"><div class="m3-label">Specify "Other" <span style="font-weight:400; color:var(--danger);">(required)</span></div>'
    + '<input type="text" class="m3-num"' + bgAttrs + ' style="width:100%;" placeholder="' + escHtml(placeholder || 'Describe it...') + '" value="' + escHtml(own[k] || '') + '"></div>';
}
function otherBlocker(field, label, bgIdx){
  var own = otherNoteOwner(bgIdx);
  if (own && isOtherVal(own[field]) && !(own[otherNoteKey(field)] || '').trim()) {
    return label + ' "Other" detail';
  }
  return null;
}

// Shared "Why?" mandatory-note check for humanUncertainToggle() — returns a
// blocker message when the section is flagged uncertain but the note is blank,
// else null. Used unconditionally at the top of every nextBlockers() section
// block (BEFORE any isOtherArch()/quickOverride early return), since the
// uncertainty toggle stays visible/checkable in every page variant.
function uncertainBlocker(sectionKey, label) {
  if (S[sectionKey + '_humanUncertain'] && !(S[sectionKey + '_uncertainNote'] || '').trim()) {
    return label + ': explain why you’re uncertain (the "Why?" field)';
  }
  return null;
}

// Same pattern for quickOverrideToggle()'s "Brief Note" (2026-07-02): a Quick
// Count Override bypasses a whole section's detail fields, so the note saying
// WHY/what was there is the only record left — it was never enforced, letting
// the override silently export with an empty note. Checked BEFORE each
// section's quickOverride early return in nextBlockers().
function quickNoteBlocker(sectionKey, label) {
  if (S[sectionKey + '_quickOverride'] && !(S[sectionKey + '_quickNote'] || '').trim()) {
    return label + ' Quick Override: fill in the Brief Note (why are details bypassed?)';
  }
  return null;
}

// Audit B-06 Fix: Strip kind codes properly
function normId(id) { 
  var stripped = id.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  return stripped.replace(/[ab]\d+$/, '');
}
function renderCitationsWithLinks(citesArray) {
  if (!citesArray || citesArray.length === 0) return 'None';
  return citesArray.map(function(c) {
    var match = MASTER_DATASET_IDS.find(function(m) { return normId(m) === normId(c); });
    if (match) return '<a href="#" class="cite-link" title="Open Patent in Dataset">' + escHtml(c) + '</a>';
    return escHtml(c);
  }).join(', ');
}

function renderThroughput() {
  var tp = document.getElementById('throughput');
  if(!tp) return;
  // When a batch .xlsx is loaded the patent count is authoritative: it is the
  // number of distinct Patent_IDs actually in the file. Force the tracker to it
  // (instead of the hardcoded 1635 default) and lock the total so the top
  // counter can never drift out of sync with the batch navigator below.
  if (BATCH) {
    THROUGHPUT.patCur = String(BATCH.idx + 1);
    THROUGHPUT.patTot = String(BATCH.ids.length);
  }
  var lock = BATCH ? ' max="'+escHtml(THROUGHPUT.patTot)+'"' : '';
  var totAttr = BATCH ? ' readonly title="Locked to the '+escHtml(THROUGHPUT.patTot)+' patents in the loaded .xlsx"' : '';
  tp.innerHTML = 'Patent <input type="number" data-field="patCur" value="'+escHtml(THROUGHPUT.patCur)+'" min="1"'+lock+'> of '
    + '<input type="number" data-field="patTot" value="'+escHtml(THROUGHPUT.patTot)+'" min="1"'+totAttr+'>';
}

function figIsMapped(fNum) {
  // Audit G-08 info: Improved regex to catch sub-figures could be applied here if needed,
  // but for basic _Fu detection, this simple base check suffices.
  var baseFNum = fNum.replace(/_Fu/i, '').replace(/[A-Z]$/i, '');
  return new RegExp('FIG\\.?\\s*' + baseFNum + '\\b', 'i').test(T1_META.descriptionOfDrawings);
}

// Return this figure's line(s) from the Brief Description of the Drawings, or
// null if the figure has no matching FIG. entry (e.g. an unlabeled _Fu crop).
// Used to show the description directly below the big image in pageT2().
function figDescriptionLine(fNum) {
  var baseFNum = String(fNum||'').replace(/_Fu/i, '').replace(/[A-Z]$/i, '').trim();
  if (!baseFNum) return null;
  var lines = String(T1_META.descriptionOfDrawings||'').split('\n');
  var re = new RegExp('FIG\\.?\\s*' + baseFNum + '\\b', 'i');
  var hits = lines.filter(function(line){ return re.test(line); });
  return hits.length ? hits.join(' ').trim() : null;
}

  // "Analytical Bounds Matrix" card (Innovation Scope / Technological Field /

      }).join('')
    + '</div>'
    + '<textarea class="comments" data-field="comments" placeholder="Log design tracking ambiguities or structural exceptions here...">' + escHtml(S.comments) + '</textarea></div>';

  return h;

function pageT2(){

    h += '<div class="m3-card" style="margin-bottom:8px; padding:12px;"><div class="m3-head">D. Image Quality Flag</div>'

    // Rendered as a clickable pill (not a small checkbox) so this toggle is hard

        + '<input type="checkbox" id="t2-has-legends"' + (hasLeg ? ' checked' : '') + ' data-fig-bool="hasLegends" style="position:absolute; opacity:0; width:0; height:0;">'
        + (hasLeg ? '✓ ' : '')
        + 'Contains callouts / legends / text overlays</label>';

    h += '</div>';

    // Per-figure "Aircraft State in this View" — many patents draw the SAME aircraft
    // in several configurations (a hover view AND a cruise view). This records which
    // configuration THIS specific drawing shows. Structured toggles + a free-text
    // box; all per-figure (figData), persisted + exported like the other T2 fields.
    // v14 (C3/PR-04,05): choices depend on the figure's architecture (T2 is
    // visited BEFORE G1, so most of the time topTypeOfArch() is still null here —
    // treated the same as CONVERTIBLE: show the 4-option UI provisionally. The
    // moment the reviewer picks a topType at G1, the g1-subbtn click handler
    // reconciles every figure of that architecture — forcing HoverCruise if it
    // turned out FIXED, or clearing a stale HoverCruise if it turned out

    h += '<div class="m3-card" style="margin-bottom:8px; padding:12px;"><div class="m3-head">Aircraft State in this View</div>'
       + '<div class="m3-sub" style="margin-bottom:6px;">Describe the configuration shown in <b>THIS drawing</b>, not the aircraft in general — e.g. hover with the wing/rotors tilted up, or cruise with everything horizontal. The same aircraft often appears in several states across a patent’s figures, so set this per image.</div>'
       + (function(){
           var _arch1 = figArchOf(fNum), _tt = topTypeOfArch(_arch1), _fixed = (_tt != null) && !isConvertibleArch(_tt);
           if (_fixed) {
             // Auto-set + lock, no question asked. Only fills a truly UNSET value
             // (never overwrites a real saved raw value, legacy or otherwise —
             // see the ingest-preservation note on AC_STATE above) — covers a
             // figure that got added/reassigned to this architecture AFTER the
             // G1 click handler's sweep already ran for the rest.
             if (figGet(fNum, 'acState') == null) figSet(fNum, 'acState', 'HoverCruise');
             return '<div class="m2-kv">Flight configuration shown</div>'
                  + '<div class="opt sel dis" data-figfield="acState" data-val="HoverCruise" title="Fixed architectures never change shape; hover and cruise are the same drawing."><div class="o-name">Invariant</div></div>';
           }
           var _acOpts = [{id:'Hover',n:'Hover (VTOL)'},{id:'Transition',n:'Transition'},{id:'Cruise',n:'Cruise / Forward'},{id:'Other',n:'Other'}];
           var _rawAc = figGet(fNum, 'acState'), _dispAc = ['Ground','Unclear','NonApplicable'].indexOf(_rawAc) > -1 ? 'Other' : _rawAc;
           var _acTip = 'Decide by the MECHANISM ANGLE drawn — mechanism state wins even if the aircraft is drawn on the ground. Other = figure shows no flight configuration (exploded, unclear, N/A).';
           return '<div class="m2-kv">Flight configuration shown</div>'

                  }));
         })()
       + '<textarea class="m3-num" data-fig-text="stateNote" placeholder="Anything else about the state in this image (gear down, doors open, blades folded, mid-transition angle…)" style="width:100%;min-height:48px;margin-top:8px;padding:8px;resize:vertical;font-size:13px;">' + escHtml(figGet(fNum, "stateNote", "")) + '</textarea>'
       + '</div>';

    // Per-figure commentary — replaces the global commentsSection() in T2 only;
    // notes and edge-case tags are stored on figData[fNum] so they travel with
    // this specific figure instead of the whole patent.
    h += '<div class="m3-card" style="margin-bottom:8px;padding:12px;">'
       + '<div class="m3-head">Figure Notes</div>'
       + '<textarea class="m3-num" data-fig-comment="true" placeholder="Notes for this figure..."'
       + ' style="width:100%;min-height:60px;padding:8px;resize:vertical;font-size:13px;">'
       + escHtml(figGet(fNum, "comment", "")) + '</textarea>'
       + '<div style="margin-top:8px;display:flex;gap:8px;">'
       + '<input type="text" id="t2-edge-tag-input" class="m3-num" list="edge-token-options" autocomplete="off"'
       + ' placeholder="New or existing edge-case token..." style="flex:1;padding:6px 10px;min-height:0;">'
       + '<datalist id="edge-token-options">'
       + EDGE_TOKENS.map(function(t){ return '<option value="'+escHtml(t)+'"></option>'; }).join('')
       + '</datalist>'
       + '<button type="button" class="btn" id="btn-add-edge-tag" style="padding:6px 12px;">+ Tag</button>'
       + '</div>'
       // Parity with Structural Elements: surface every session edge-case token
       // (EDGE_TOKENS) as one-click chips so the reviewer never has to retype a tag
       // they created earlier. Applied tags are highlighted; clicking a chip appends
       // it to this figure's edgeTags (no-op if already applied). The text input
       // above still CREATES new tokens (btn-add-edge-tag pushes into EDGE_TOKENS).
       + (EDGE_TOKENS.length > 0
          ? '<div style="margin-top:8px;">'
            + '<div class="m3-sub" style="margin-bottom:4px;">Edge-case tokens (click to apply):</div>'
            + '<div style="display:flex;flex-wrap:wrap;gap:4px;">'
            + EDGE_TOKENS.map(function(t){
                var applied = figGet(fNum,"edgeTags",[]).indexOf(t) > -1;
                return '<span class="crumb' + (applied ? ' hi' : '') + '" style="cursor:pointer;" data-add-edge-tag="'+escHtml(t)+'">'
                       + escHtml(t) + '</span>';
              }).join('')
            + '</div></div>'
          : '')
       + (figGet(fNum,"edgeTags",[]).length > 0
          ? '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;">'
            + figGet(fNum,"edgeTags",[]).map(function(t){
                return '<span class="crumb" style="cursor:pointer;" data-remove-tag="'+escHtml(t)+'">'
                       + escHtml(t) + ' ×</span>';
              }).join("") + "</div>"
          : "")
       + "</div>";

    h += archDinoUnderstandingCard(fNum);

    // ── Patent-level (GLOBAL) image-semantics review ──────────────────────────
    // "Images don't reflect the aircraft semantics" (imgNotReflect) + the
    // follow-up apparent-architecture selector (imgApparentArch) were removed
    // from this page in v13 — deferred to text-based verification pipeline.
    // Both keys still exist on S and are always exported at their v10 defaults
    // (see fresh()); the Patent Image Notes card below is unaffected.
    h += '<div class="m3-card" style="margin-bottom:8px; padding:12px;">'
       + '<div class="m3-head">Patent Image Notes (whole patent)</div>'
       + '<div class="m3-sub" style="margin-bottom:6px;">Global notes about this patent’s imagery (not tied to one figure).</div>'
       + '<textarea class="m3-num" data-field="patentImageComments" placeholder="Overall observations about the patent’s drawings..." style="width:100%;min-height:60px;padding:8px;resize:vertical;font-size:13px;">'
       + escHtml(S.patentImageComments || '') + '</textarea></div>';

    // Image-selection reminder (guidance only — no data captured). Sits at
    // the end of the per-figure column as the "last comment" the reviewer
    // reads. v15 (C4): visible text de-branded from "DINOv2" wording.
    h += '<div class="flag info" style="margin-bottom:8px;"><span class="f-lbl">💡 Picking representative images</span>'
       + 'Aim for ~3–4 representative drawings of this aircraft across the patent. Every drawing has a flaw (odd angle, occlusion, callout clutter, partial view), so a few complementary views describe the 3-D shape far better than any single “best” image.</div>';
    h += '</div>';  // close COL 4
  } else {
    h += '<div class="t2-col t2-col-tags"><div class="flag skip"><span class="f-lbl">No Figure Selected</span>Select a figure card above to begin labeling.</div></div>';
    h += '<div class="t2-col t2-col-tags"></div>';
  }

  h += '</div>';  // close .t2-grid4
  return h;
}

// Per-ARCHITECTURE (not per-image, not per-patent) card: how usable the
// figures TAGGED TO fNum's architecture collectively are as 3-D shape cues
// for downstream recognition. Lives on T2 (next to the per-figure tag
// groups, where the reviewer is already looking at the figures) but the
// value is keyed by figArchOf(fNum), not by fNum itself — every figure
// sharing that architecture tag shows/sets the SAME rating. Stored in
// S.archDinoUnderstanding[archNum] (internal id unchanged, v15 C4 only
// reworded the visible text), independent of figData (per-figure) and of
// archProfiles (the G1/M1/M2/M3 morphology snapshot) — see the
// data-arch-dino click handler.
function archDinoUnderstandingCard(fNum) {
  var arch = figArchOf(fNum);
  var cur  = (S.archDinoUnderstanding || {})[arch];
  return '<div class="m3-card" style="margin-bottom:8px; padding:12px;">'
       + '<div class="m3-head">Projected Recognition Sufficiency — Architecture ' + arch + '</div>'
       + '<div class="m3-sub" style="margin-bottom:6px;">Rates how much of Architecture ' + arch + '\'s recognizability comes from the figures alone, as a whole — not just this one image.</div>'
       + grid('n', DINO_UNDERSTANDING.map(function(o){
           var sel = cur === o.id, tt = (o.d||o.n).replace(/"/g, '&quot;');
           return '<div class="opt'+(sel?' sel':'')+'" data-arch-dino="'+o.id+'" title="'+tt+'"><div class="o-name">'+o.n+'</div></div>';
         }))

}

  }));
}

              } else if (i === 1 && S.topType === 'TW') {

       }
    }
  }
  return h+huM2+commentsSection();

function renderPreserveScroll() {
  // The page scrolls on the WINDOW (the .panel div has no overflow/fixed height,
  // so it grows with content) — #panel.scrollTop is always 0. On the T2 page the
  // (up to 4) columns (.t2-col) are their own scroll containers, so we capture/
  // restore each one by index. render() rebuilds #panel.innerHTML, so the inner
  // elements are recreated and must be re-scrolled by selector after render.
  var winY = window.scrollY || document.documentElement.scrollTop || 0;
  var cols = document.querySelectorAll('.t2-col');
  var tops = [];
  for (var i = 0; i < cols.length; i++) tops.push(cols[i].scrollTop);
  render();
  window.scrollTo(0, winY);
  var cols2 = document.querySelectorAll('.t2-col');
  for (var j = 0; j < cols2.length && j < tops.length; j++) cols2[j].scrollTop = tops[j];
}

// Task B (CHANGE 4): compact main-figure image shown on the G1/M1/M2/M3 morphology
// pages so the reviewer can see the drawing while classifying. Prefers
// S.mainFigure; falls back to the first approved figure that has an image, then to
// any figure that has an image. Returns '' (renders nothing — no broken <img>)
// when no usable image exists. The panel is CSS-positioned (.morph-mainfig): fixed
// in the right margin on wide screens, static at the top on narrow ones.
function morphologyMainImage() {
  // Shown only on the morphology pages (per architecture), so prefer the main
  // figure of the CURRENT architecture; fall back to an approved/any figure that
  // belongs to this architecture, then to any figure at all.
  var curArch1 = (S.curArch || 0) + 1;
  var pick = null;
  var amf = mainFigureOfArch(curArch1);
  if (amf && realFigImage(amf)) pick = amf;
  if (!pick) {
    var nums = Object.keys(S.figData || {}).sort(function(a,b){ return (parseFloat(a)||0) - (parseFloat(b)||0); });
    var inArch = nums.filter(function(n){ return figArchOf(n) === curArch1; });
    var pools = [inArch, nums];   // this architecture first, then any figure
    for (var p = 0; p < pools.length && !pick; p++) {
      for (var i = 0; i < pools[p].length; i++) { if (figGet(pools[p][i],'status',null) === 'approved' && realFigImage(pools[p][i])) { pick = pools[p][i]; break; } }
      if (!pick) { for (var j = 0; j < pools[p].length; j++) { if (realFigImage(pools[p][j])) { pick = pools[p][j]; break; } } }
    }
  }
  if (!pick) return '';
  var url = realFigImage(pick);
  if (!url) return '';
  return '<div class="morph-mainfig">'
    + '<div class="morph-mainfig-lbl">Main figure' + (getArchCount() > 1 ? ' · Arch ' + (S.curArch + 1) : '') + ' · FIG. ' + escHtml(pick) + '</div>'
    + '<img src="' + url + '" onerror="this.parentNode.style.display=\'none\';" alt="Main figure FIG. ' + escHtml(pick) + '">'
    + '</div>';
}

function render(){
  persistSession();   // refresh-safe: snapshot the whole session on every render (debounced)
  renderStep(); renderBC(); renderThroughput(); renderCopyMorph();
  document.getElementById('hdr-id').textContent = T1_META.recordNumber || '';
  // Prefer a dedicated, capitalization-normalized aircraft/prototype name;
  // fall back to the patent title when the pipeline doesn't supply one.
  var acName = normalizeAircraftName(T1_META.aircraftName);
  document.getElementById('hdr-name').textContent =
    acName || T1_META.title || 'Unnamed';
  var sid=curSID(), p=document.getElementById('panel'), content='';
  if(sid=='t1') content=pageT1(); else if(sid=='t2') content=pageT2(); else if(sid=='gate') content=pageGate(); else if(sid=='m1') content=pageM1(); else if(sid=='m2') content=pageM2(); else if(sid=='m3') content=pageM3(); else if(sid=='done'){ p.innerHTML=pageDone(); return; }
  // Multi-architecture banner on the morphology pages (G1/M1/M2/M3): tells the
  // reviewer which architecture they're filling when the patent has more than one.
  if (['gate','m1','m2','m3'].indexOf(sid) > -1) {
    var _nA = getArchCount();
    if (_nA > 1) {
      content = '<div class="flag info" style="margin-bottom:12px; border-left:4px solid var(--accent);">'
        + '<span class="f-lbl">Architecture ' + (S.curArch + 1) + ' of ' + _nA + '</span>'
        + 'These G1/M1/M2/M3 answers apply to architecture ' + (S.curArch + 1) + '. '
        + (S.curArch < _nA - 1 ? 'After M3 you\'ll move to the next architecture.' : 'This is the last architecture — after M3 you\'ll reach the summary.')
        + '</div>' + content;
    }
    // CHANGE 4: prepend the sticky main-figure image so the drawing stays visible
    // while classifying. Out of normal flow (position:fixed) on wide screens, so it
    // does not disturb the Architecture-N-of-M banner above; renders nothing if no
    // usable image exists.
    content = morphologyMainImage() + content;
  }
  var blockers = nextBlockers();
  var blockerHint = blockers.length
    ? '<span style="font-size:11px;color:var(--warn);text-align:right;max-width:420px;">\u26a0 To continue: ' + escHtml(blockers.join('  \u00b7  ')) + '</span>'
    : '';
  p.innerHTML=content+'<div class="nav">'+(S.step>0?'<button type="button" class="btn" id="btn-back">\u2190 Back</button>':'<div></div>')+'<div class="bgrp" style="display:flex;align-items:center;gap:10px;">'+blockerHint+'<button type="button" class="btn pri" id="btn-next"'+(!canGo()?' disabled':'')+'>Next Step \u2192</button></div></div>';
}

// The G1/M1/M2/M3 morphology object for whatever architecture is CURRENTLY
// loaded into the flat S.* keys. Factored out of buildExport so it can be
// called once per architecture (after swapping that arch's profile into S).
function buildMorphologyObj() {
  return {
    topologyClass: S.topType, notPureArch: !!S.notPureArch, wingConf: S.wingConf, wCount: xlCount(S.wCount),
    // Categorical "Other" pattern (see W_PLAN): plan ALWAYS carries the option id
    // ('Oth' included) — the free text rides separately in planOtherNote, never
    // substituted into plan itself (that was the old, lossy behavior).
    wings: (['BWB','FW','LB'].indexOf(S.wingConf) > -1)
      ? (S.wPlan1 ? [{role:'Main', tilt:null, posV:null, posL:null, plan:S.wPlan1, planOtherNote:S.wPlan1==='Oth'?(S.wPlanOth1||''):''}] : [])
      : [1,2,3,4].map(function(i){ return i<=S.wCount ? {role:S['wRole'+i]||'Main', tilt:S['wTilt'+i], posV:S['wPosV'+i], posL:S['wPosL'+i], plan:S['wPlan'+i], planOtherNote:S['wPlan'+i]==='Oth'?(S['wPlanOth'+i]||''):'', roleOtherNote:isOtherVal(S['wRole'+i])?(S['wRole'+i+'Oth']||''):''} : null }).filter(Boolean),
    empType: S.empType, empTilts: !!S.empTilts, empTiltsNote: S.empTilts ? (S.empTiltsNote||'') : '', empNotes: S.empNotes,
    fusShape: S.fusShape, fusKin: S.fusKin, fusNotes: S.fusNotes, gearArch: S.gearArch, gearNotes: S.gearNotes, wingNotes: S.wingNotes,
    // Shared categorical-"Other" notes (v15.3): only carried when the field is
    // actually on 'Other'/'Oth', so a stale note from an earlier pick never
    // exports (same rule the uncertainNote/empTiltsNote fields follow).
    wingConfOtherNote: isOtherVal(S.wingConf) ? (S.wingConfOth||'') : '',
    empTypeOtherNote:  isOtherVal(S.empType)  ? (S.empTypeOth||'')  : '',
    fusShapeOtherNote: isOtherVal(S.fusShape) ? (S.fusShapeOth||'') : '',
    boomsPresent: !!S.boomsPresent,
    boomGroups: S.boomsPresent ? cloneBoomGroups(S.boomGroups).map(function(g){ return Object.assign({}, g, { count: xlCount(g.count) }); }) : [],
    boomNotes: S.boomsPresent ? (S.boomNotes||'') : '',
    boomXFormat: S.boomsPresent ? !!S.boomXFormat : false,
    footLen: S.footLen, footWid: S.footWid, footHgt: S.footHgt, footAmbiguous: S.footAmbiguous, latSym: S.latSym, longSym: S.longSym,
    // Quick Count Override (v13, rule 4e) — G1/M1/M2 are per-architecture, so
    // they ride along in the morphology object like everything else above.
    g1_quickOverride: !!S.g1_quickOverride, g1_quickNote: S.g1_quickNote || '',
    m1_quickOverride: !!S.m1_quickOverride, m1_quickNote: S.m1_quickNote || '',
    m2_quickOverride: !!S.m2_quickOverride, m2_quickNote: S.m2_quickNote || '',
    // Human-uncertainty flag (v13) — G1/M1/M2/M3 are per-architecture. Unchecked
    // always exports false/'' (rule: "Unchecked exports false and empty string").
    g1_humanUncertain: !!S.g1_humanUncertain, g1_uncertainNote: S.g1_humanUncertain ? (S.g1_uncertainNote || '') : '',
    m1_humanUncertain: !!S.m1_humanUncertain, m1_uncertainNote: S.m1_humanUncertain ? (S.m1_uncertainNote || '') : '',
    m2_humanUncertain: !!S.m2_humanUncertain, m2_uncertainNote: S.m2_humanUncertain ? (S.m2_uncertainNote || '') : '',
    m3_humanUncertain: !!S.m3_humanUncertain, m3_uncertainNote: S.m3_humanUncertain ? (S.m3_uncertainNote || '') : '',
    propulsionCards: m3Blueprints().map(function(bp){
      var nT = m3NTypes(bp.key);
      // Shared, card-level fields (the same for every propeller type on the card).
      var card = { component: bp.key, ntypes: nT, sym: m3Sym(bp.key), symLong: m3SymLong(bp.key), symCirc: m3SymCirc(bp.key), zone: (m3Get(bp.key,'zone') || []).slice(), zoneChord: m3Get(bp.key,'zoneChord'), zoneSpan: m3Get(bp.key,'zoneSpan'), notes: m3Get(bp.key,'notes'),
        // Quick Count Override (v13, rule 4b) — station-level bypass + total count.
        quickOverride: !!S[bp.key + '_quickOverride'], quickCount: (S[bp.key + '_quickCount'] != null ? S[bp.key + '_quickCount'] : null) };
      if (nT <= 1) {
        // Legacy single-type: flat per-attribute fields under the bare key, so
        // older readers and the existing export rows keep working unchanged.
        card.count  = xlCount(m3Count(bp.key));
        card.chord  = m3Get(bp.key,'chord');
        card.orient = m3Get(bp.key,'orient');
        card.bmech  = m3Get(bp.key,'bmech');
        card.rmech  = m3Get(bp.key,'rmech');
        card.propKin = (propKinLock(S.topType) || m3Get(bp.key,'propKin'));
        // v15.3: paired note for PROP_KIN's 'Other' (never set under a lock).
        card.propKinOth = (!propKinLock(S.topType) && isOtherVal(m3Get(bp.key,'propKin'))) ? (m3Get(bp.key,'propKinOth','') || '') : '';
      } else {
        // Multi-type: per-type attribute sets. Articulation (propKin) is NOT
        // physics-locked here — mixing fixed + tilting is the whole point.
        card.count = xlCount(m3CardCount(bp.key));   // total across types (for downstream counts)
        card.types = [];
        for (var t = 1; t <= nT; t++) {
          var tk = m3TypeKey(bp.key, t);
          // Mounting-zone position is now per type, so it travels inside each type.
          card.types.push({ idx: t, count: xlCount(m3Count(tk)), chord: m3Get(tk,'chord'), orient: m3Get(tk,'orient'), bmech: m3Get(tk,'bmech'), rmech: m3Get(tk,'rmech'), propKin: m3Get(tk,'propKin'), propKinOth: isOtherVal(m3Get(tk,'propKin')) ? (m3Get(tk,'propKinOth','') || '') : '', zone: (m3Get(tk,'zone') || []).slice(), zoneChord: m3Get(tk,'zoneChord'), zoneSpan: m3Get(tk,'zoneSpan') });
        }
      }
      return card;
    })
  };
}

// Build the array of per-architecture morphology objects by swapping each
// stored profile into S in turn, reading it, then restoring the active arch.
// For a single-architecture patent this is just [currentMorphology].
function buildArchitectures() {
  saveCurArchProfile();                       // make sure the active arch is captured
  var nArch = getArchCount();
  var savedActive = captureAircraftSnapshot(); // remember what's currently in S
  var out = [];
  for (var ai = 0; ai < nArch; ai++) {
    // Fall back to the active morphology if a profile slot was never visited
    // (e.g. same-name-aircraft auto-jump), so we never emit a wiped architecture.
    applyAircraftSnapshot(S.archProfiles[ai] || savedActive);
    var morph = buildMorphologyObj();
    // dinoUnderstanding lives outside the morphology snapshot (it's set from
    // T2, keyed by architecture NUMBER, not swapped via archProfiles) — attach
    // it here by the same 1-based number recordToRows uses for the _arch{N} suffix.
    morph.dinoUnderstanding = (S.archDinoUnderstanding || {})[ai + 1] || null;
    out.push(morph);
  }
  applyAircraftSnapshot(savedActive);          // restore the active arch into S
  return out;
}

function buildExport() {
  var _dupId = (S.duplicateId || '').trim();
  var dupCommitted = !!S.isDuplicate && (
    S.duplicateType === '1'
      ? (_dupId !== '' && S.duplicateCopiedId === _dupId)   // type-1: must have Copied this id
      : true                                                 // type 2/3 (+ legacy 4): no copy action, flag is enough
  );
  var rec = {
    recordId: T1_META.recordNumber, familyId: T1_META.familyId,
    aircraftName: T1_META.aircraftName || '',
    assignee: T1_META.assignee, pubYear: T1_META.pubYear, appYear: T1_META.appYear,
    isApproved: S.isApproved, disapproveReason: S.t1DisapproveReason, disapproveOther: S.t1DisapproveOther,
    // A patent duplicate is only EXPORTED once the reviewer committed it via Copy:
    // type-1 (Same Aircraft) requires "Copy M1–M3" to have run for THIS exact id
    // (S.duplicateCopiedId), so merely ticking the flag without copying saves as
    // NOT a duplicate. Types 2–4 have no copy action, so they save on the flag.
    isDuplicate: dupCommitted, duplicateOf: dupCommitted ? S.duplicateId : '', duplicateType: dupCommitted ? S.duplicateType : null,
    archCount: xlCount(getArchCount()), scope: S.t1Scope, techField: S.t1Field, innovTarget: S.t1Target,
    figures: Object.keys(S.figData).reduce(function(acc, fNum){
      var fd = S.figData[fNum] || {};
      // Single source of truth for every per-figure default the UI shows as
      // "selected" without the reviewer ever clicking it (qualityFlag defaults
      // to "Clean" in qualityChip(), arch defaults to "1" in figArchOf()) —
      // resolved HERE, once, so every consumer of record.figures (recordToRows,
      // any future reader) sees the real displayed value instead of having to
      // duplicate the same fallback and risk drifting out of sync (the bug that
      // silently dropped "Clean" from the export).
      // Disapproved figures are exempt from the "arch" default: recordToRows()
      // deliberately keeps disapproved-image rows lean (only status + arch IF
      // it was actually tagged), so forcing a "1" here would add a spurious
      // arch row to every discarded figure.
      acc[fNum] = Object.assign({}, fd, {
        rotation_deg: fd.t2_rotation || 0,
        qualityFlag: fd.qualityFlag != null ? fd.qualityFlag : 'clean',
        arch: (fd.arch != null || fd.status === 'disapproved') ? fd.arch : '1',
      });
      return acc;
    }, {}), mainFigure: mainFigureOfArch(1),   // legacy META field = architecture 1's main (per-figure isMain carries the rest)
    // architectures[]: one morphology per architecture. The flat morphology
    // fields below mirror architectures[0] for backward-compatibility with any
    // consumer that still reads record.topologyClass etc. directly.
    architectures: buildArchitectures(),
    labelToken: buildLbl(), comments: S.comments,
    t1EdgeTags: Array.isArray(S.t1EdgeTags) ? S.t1EdgeTags.slice() : [],
    // Patent-level image-semantics review (T2 col 4, global).
    imgNotReflect: !!S.imgNotReflect, imgApparentArch: S.imgApparentArch || '', patentImageComments: S.patentImageComments || '',
    // Quick Count Override (v13, rule 4e) — T1 is patent-level, not per-architecture.
    t1_quickOverride: !!S.t1_quickOverride, t1_quickNote: S.t1_quickNote || '',
    // Human-uncertainty flag (v13) — T1 is patent-level. Unchecked always exports
    // false/'' (rule: "Unchecked exports false and empty string").
    t1_humanUncertain: !!S.t1_humanUncertain, t1_uncertainNote: S.t1_humanUncertain ? (S.t1_uncertainNote || '') : '',
    codebook_version: CODEBOOK_VERSION,
    timestamp: new Date().toISOString()
  };
  var first = rec.architectures[0] || {};
  Object.keys(first).forEach(function(k){ rec[k] = first[k]; });
  return rec;
}

function ingestAI(data) {
  // T1
  if (data.T1) {
    var t1 = data.T1;

    if (t1.disapprove_other)    S.t1DisapproveOther  = t1.disapprove_other;
    if (t1.isDuplicate != null) S.isDuplicate        = !!t1.isDuplicate;
    if (t1.duplicateId)         S.duplicateId        = t1.duplicateId;
    if (t1.duplicateType)       S.duplicateType      = t1.duplicateType;

    // Copy — mark it copied so re-exporting this patent keeps it (buildExport
    // gates on this). Bug fix: an ML duplicate SUGGESTION (Source e.g. "sbert",
    // "patseer_family" — see MACHINE_SOURCES) must NOT pre-satisfy this gate; that
    // silently exported the pipeline's guess as a reviewer-committed duplicate
    // without the reviewer ever pressing "Copy M1–M3".
    if (t1.isDuplicate && t1.duplicateId && !MACHINE_SOURCES[t1.isDuplicateSource]) {
      S.duplicateCopiedId = t1.duplicateId;

    if (t1.t1Field)             S.t1Field            = t1.t1Field;
    if (t1.t1Target)            S.t1Target           = t1.t1Target;
    if (t1.innovTarget && !t1.t1Target) S.t1Target   = t1.innovTarget; // fallback key

    // to 1/0 instead of parseInt's silent NaN→0; the "|| 1" floor (archCount
    // can never legitimately be 0) is unchanged from before.
    if (t1.arch_count  != null) S.archCount          = xlCount(t1.arch_count) || 1;
    if (t1.aircraftName)        T1_META.aircraftName = t1.aircraftName;
    // Quick Count Override (v13, rule 4e) — T1 is patent-level.
    if (t1.quickOverride != null) S.t1_quickOverride = !!t1.quickOverride;
    if (t1.quickNote     != null) S.t1_quickNote     = t1.quickNote;
    // Human-uncertainty flag (v13) — T1 is patent-level.
    if (t1.humanUncertain != null) S.t1_humanUncertain = !!t1.humanUncertain;
    if (t1.uncertainNote  != null) S.t1_uncertainNote  = t1.uncertainNote;
    // T1 name gate round-trip: a HUMAN-reviewed record with a verdict but no
    // aircraftName means the reviewer already passed T1 having picked
    // "(No-name aircraft)" (the pick stores an empty name and isn't exported as
    // its own field) — re-infer the confirmation so reloading doesn't re-block
    // a patent that was already legitimately advanced past T1. ML pre-label
    // files never satisfy isHumanReviewed (MACHINE_SOURCES gate), so a fresh
    // load still requires the explicit click.
    if (data.isHumanReviewed && t1.approved != null && !t1.aircraftName) S.t1NoNameConfirmed = true;

  if (data.G1 && data.G1.notPureArch != null) S.notPureArch = !!data.G1.notPureArch;
  // Quick Count Override (v13, rule 4e).
  if (data.G1 && data.G1.quickOverride != null) S.g1_quickOverride = !!data.G1.quickOverride;
  if (data.G1 && data.G1.quickNote     != null) S.g1_quickNote     = data.G1.quickNote;
  // Human-uncertainty flag (v13).
  if (data.G1 && data.G1.humanUncertain != null) S.g1_humanUncertain = !!data.G1.humanUncertain;
  if (data.G1 && data.G1.uncertainNote  != null) S.g1_uncertainNote  = data.G1.uncertainNote;
  if (data.G1 && data.G1.topType) {
    S.topType = data.G1.topType;

    if (S.topType === 'TB' || S.topType === 'PTC') {

    if (m1.fusKin)         S.fusKin   = m1.fusKin;

    if (m1.wingConfOtherNote != null) S.wingConfOth = m1.wingConfOtherNote;
    if (m1.empTypeOtherNote  != null) S.empTypeOth  = m1.empTypeOtherNote;
    if (m1.fusShapeOtherNote != null) S.fusShapeOth = m1.fusShapeOtherNote;
    if (m1.wingNotes != null) S.wingNotes = m1.wingNotes;
    if (m1.empNotes  != null) S.empNotes  = m1.empNotes;
    if (m1.fusNotes  != null) S.fusNotes  = m1.fusNotes;
    if (m1.gearNotes != null) S.gearNotes = m1.gearNotes;
    // M1 structural booms / outriggers.
    if (m1.boomsPresent != null) S.boomsPresent = xlBool(m1.boomsPresent);
  if (m1.boomNotes != null)    S.boomNotes    = m1.boomNotes;
  if (m1.boomXFormat != null)  S.boomXFormat  = xlBool(m1.boomXFormat);
    if (Array.isArray(m1.boomGroups)) S.boomGroups = cloneBoomGroups(m1.boomGroups);
    if (S.boomsPresent && !(S.boomGroups || []).length) S.boomGroups = [];

    if (m1.m1_quickOverride != null) S.m1_quickOverride = xlBool(m1.m1_quickOverride);
    if (m1.m1_quickNote     != null) S.m1_quickNote     = m1.m1_quickNote;
    if (m1.m2_quickOverride != null) S.m2_quickOverride = xlBool(m1.m2_quickOverride);
    if (m1.m2_quickNote     != null) S.m2_quickNote     = m1.m2_quickNote;
    // Human-uncertainty flag (v13) — m1_*/m2_*/m3_* ride on this same merged M1 object.
    if (m1.m1_humanUncertain != null) S.m1_humanUncertain = xlBool(m1.m1_humanUncertain);
    if (m1.m1_uncertainNote  != null) S.m1_uncertainNote  = m1.m1_uncertainNote;
    if (m1.m2_humanUncertain != null) S.m2_humanUncertain = xlBool(m1.m2_humanUncertain);
    if (m1.m2_uncertainNote  != null) S.m2_uncertainNote  = m1.m2_uncertainNote;
    if (m1.m3_humanUncertain != null) S.m3_humanUncertain = xlBool(m1.m3_humanUncertain);

    // one. ingestPatentRows() (the reviewed-file round-trip) handles it
    // separately via rowsForArch()'s M1.dinoUnderstanding — see below.
    // v14 (C4): the old TW/TB/RC empKin architecture locks are REMOVED here —

      // is a b/w solid-white line drawing, so pre-filling those defaults saves the

      if (fig.isMain != null) figSet(figNum, 'isMain', xlBool(fig.isMain));
      // A dupOf that was SAVED (by a human) was committed via Copy — restore
      // dupConfirmed so it keeps exporting (recordToRows gates the dupOf row on
      // this — a human-saved file only ever carries this row when it was
      // already confirmed). Bug fix: an ML dup SUGGESTION (Source e.g. "siglip"
      // — see MACHINE_SOURCES) must NOT auto-confirm; that silently exported the
      // pipeline's guess as a reviewer-committed duplicate (and copied its T2
      // labels onto other figures) without any "Copy labels" click ever happening.
      if ((fig.dupOfPatent != null || fig.dupOfFig != null) && !MACHINE_SOURCES[fig.__dupSource]) {

      // (the overwhelmingly common case), ignoring SigLIP's parts guess — same

      if (!figReviewed) {

      } else if (Array.isArray(fig.parts) && fig.parts.length > 0) {

        // Single-select default: SigLIP over-tags parts, so collapse a multi-tag guess
        // to ONE on load — only the human may assign >1, via the "Allow multiple"
        // button (now persisted as partsMulti). Prefer "Whole Vehicle Layout" (the
        // common case: the figure shows the whole architecture), else the first tag.
        if (!figGet(figNum, 'partsMulti', false) && _parts.length > 1) {
          _parts = _parts.indexOf('Whole Vehicle Layout') > -1 ? ['Whole Vehicle Layout'] : [_parts[0]];
        }
        figSet(figNum, 'parts', _parts);

      // human's real value), distinct from the ML rotation_deg_suggested below.
      if (Array.isArray(fig.edgeTags) && fig.edgeTags.length > 0) {
        figSet(figNum, 'edgeTags', fig.edgeTags);
      }

        figSet(figNum, 't2_rotation', parseInt(fig.rotation_deg, 10) || 0);
      }

      // stored here; pageT2() applies it to t2_rotation on first view only,
      // so it never clobbers a rotation the human has already set.
      if (fig.rotation_deg_suggested != null) {
        figSet(figNum, 'rotation_deg_suggested', parseInt(fig.rotation_deg_suggested, 10) || 0);
      }

      // carries it (reviewed exports do; ML pre-labels never do — so a fresh ML
      // load still leaves the human to confirm each figure).
    });

    // another figure in THIS patent, copy that original's T2 labels in (same
    // image ⇒ same image-level labels), editable. Cross-patent originals are
    // handled when the reviewer (re)flags them or once that patent is in the
    // session registry.
    Object.keys(S.figData).forEach(function(figNum){
      var dop = figGet(figNum,'dupOfPatent',''), dof = figGet(figNum,'dupOfFig','');
      var samePatent = !dop || String(dop).trim() === String(T1_META.recordNumber).trim();

      });

      // instead of leaving a raw boolean in state (parseInt(true,10) is NaN).
      if (card.count != null) { S['m3_' + key + '_count'] = xlCount(card.count); }
      // Quick Count Override (v13, rule 4b) — NOT m3_-prefixed (see M3_QUICK_KEY_RE).
      if (card.quickOverride != null) S[key + '_quickOverride'] = xlBool(card.quickOverride);
      if (card.quickCount != null) { var _qc = parseInt(card.quickCount, 10); S[key + '_quickCount'] = isNaN(_qc) ? null : _qc; }
      // Migrate an OLD single boomPos value (pre-split) into the new two-axis
      // fields so previously-saved reviewed files still show their boom position.
      if (card.boomPos != null && card.boomPosLong == null && card.boomPosSpan == null) {
        var _bp = String(card.boomPos);
        if (['Fore','Mid','Aft'].indexOf(_bp) > -1)        S['m3_' + key + '_boomPosLong'] = _bp;
        else if (_bp === 'Inboard' || _bp === 'Outboard')  S['m3_' + key + '_boomPosSpan'] = _bp;
        else if (_bp === 'Spanning')                       S['m3_' + key + '_boomPosSpan'] = 'Spanning';
      }
      // Symmetric-pairs flag is a boolean — coerce so "true"/"false" strings
      // from a round-tripped xlsx don't read as truthy non-empty strings.
      if (card.sym != null) { S['m3_' + key + '_sym'] = xlBool(card.sym); }
      if (card.symLong != null) { S['m3_' + key + '_symLong'] = xlBool(card.symLong); }
      if (card.symCirc != null) { S['m3_' + key + '_symCirc'] = xlBool(card.symCirc); }

      var _pk = propKinLock(S.topType);
      var nT = parseInt(card.ntypes, 10) || (Array.isArray(card.types) ? card.types.length : 1);
      if (Array.isArray(card.types) && card.types.length) {
        // Multi-type: write each type's attributes under the "<key>__t<n>" sub-key.
        // propKin is NOT physics-locked here (mixed fixed/tilting is the point).
        S['m3_' + key + '_ntypes'] = Math.min(M3_MAX_TYPES, Math.max(1, nT));
        card.types.forEach(function(ty) {
          var tk = key + '__t' + ty.idx;
          ['chord','orient','bmech','rmech','propKin','propKinOth','zone','zoneChord','zoneSpan','boomAttach','boomPosLong','boomPosSpan'].forEach(function(f) {
            if (ty[f] != null) { S['m3_' + tk + '_' + f] = Array.isArray(ty[f]) ? ty[f].slice() : ty[f]; }
          });
          // Count normalization (rule 1) — see the card-level count above.
          if (ty.count != null) { S['m3_' + tk + '_count'] = xlCount(ty.count); }
          if (['SLC','SRW'].indexOf(S.topType) > -1 && S['m3_' + tk + '_orient'] === 'Mixed') { S['m3_' + tk + '_orient'] = null; }
        });
      } else {
        // Legacy single-type: flat per-attribute fields under the bare key.
        S['m3_' + key + '_ntypes'] = 1;
        ['chord','orient','bmech','rmech','propKin','propKinOth'].forEach(function(f) {
          if (card[f] != null) { S['m3_' + key + '_' + f] = card[f]; }
        });
        // SLC/SRW: strip Mixed (tilting/vectoring) if a stored/AI value sneaks in —
        // independent fixed lift+cruise / stopped-rotor never vectors.
        if (['SLC','SRW'].indexOf(S.topType) > -1 && S['m3_' + key + '_orient'] === 'Mixed') { S['m3_' + key + '_orient'] = null; }
        // propKin lock per the physics matrix — force the architecture's fixed value
        // over any stored/AI value (TW/DS/SLC/SRW/MR/TB/RC→Fixed; TP & CVT free).
        // TW wing orient is intentionally NOT forced anymore so a saved Mixed survives.
        if (_pk) { S['m3_' + key + '_propKin'] = _pk; }
      }
    });
  }
  // Confidence summary in status bar
  var confs = [];
  if (data.T1 && data.T1.confidence != null) confs.push(data.T1.confidence);
  if (data.G1 && data.G1.confidence != null) confs.push(data.G1.confidence);
  if (data.M1 && data.M1.confidence != null) confs.push(data.M1.confidence);
  if (data.overall_confidence != null) confs.push(data.overall_confidence);
  var avgConf = confs.length ? (confs.reduce(function(a,b){return a+b;},0)/confs.length) : null;
  var confPct = avgConf != null ? Math.round(avgConf * 100) + '%' : '';
  var confColor = avgConf >= 0.85 ? 'var(--ok)' : avgConf >= 0.60 ? 'var(--warn)' : 'var(--danger)';
  // The single-patent "AI Pre-Label" status bar was removed from the header, so
  // this is now a no-op when that element is absent (ingestAI still runs for every
  // batch patent via ingestPatentRows — must not throw on the missing node).
  var _aiStatus = document.getElementById('ai-load-status');
  if (_aiStatus) _aiStatus.innerHTML =
    ' Pre-labels loaded &nbsp;&nbsp; AI confidence: <b style="color:' + confColor + '">' + confPct + '</b>' +
    (data.G1 && data.G1.reasoning ? ' &nbsp;&nbsp; <i style="color:var(--text3);">' + data.G1.reasoning + '</i>' : '');
  render();
}

// --- BATCH LOADER (ml_predict_labels_<batch>.xlsx — one row per leaf field, all patents
// stacked in a single "Review" sheet; see src/excel_schema.py COLUMNS) ──────
// Lets a reviewer load one consolidated file for the whole batch instead of
// one ai_prelabel.json per patent, with Prev/Next stepping through patients
// and patTot auto-detected from the distinct Patent_ID count.
var BATCH = null;  // { ids: [...], byId: {pid: rows[]}, idx: 0, label: "Batch_01" }

// Per-patent filename/image-path lookup keyed by fNum — rebuilt by
// rowsToAIData() on every loadBatchPatent() call. recordToRows() needs this
// to reconstruct the "Image: <filename>" Sub_Dimension that build_patent_rows()
// (src/excel_schema.py) uses, since S.figData itself is only keyed by fNum.
var FIG_FILENAMES  = {};
var FIG_IMAGE_PATH = {};

// Manually-attached images (the "📎 Attach Image" button in pageT2, for
// figures the pipeline never matched a crop for). Browsers never expose a
// real disk path for a picked File, so this is a session-only blob: URL for
// preview — it takes priority over FIG_IMAGE_PATH in realFigImage() but is
// NOT persisted across F5/export as a usable path. FIG_FILENAMES[fNum] is
// still set to file.name so recordToRows()/export still emits a correct
// "Image: <filename>" row; a Python-side script (scripts/resolve_image_paths.py)
// fills in the real absolute Image_Path afterwards by locating that filename
// under matched/ — see [[patent-labelling-ui]] memory for the full flow.
var FIG_ATTACHED_URL = {};

// FIG_IMAGE_PATH values are absolute local filesystem paths written by
// src/excel_schema.py (e.g. "/mnt/storage_11tb/.../matched/Batch_02/<pid>/<crop>.png"),
// not URLs — convert to a file:// URL so <img src> can load them directly from
// disk when this HTML is opened via file:// in Chrome (no upload step needed).
function pathToFileURL(p) {
  if (!p || p.trim() === '') return null;
  if (/^(https?|file):\/\//i.test(p)) return p;
  var cleanPath = p.replace(/\\/g, '/');
  if (/^[a-zA-Z]:/.test(cleanPath)) {
    return 'file:///' + cleanPath;
  }
  return 'file://' + (cleanPath.startsWith('/') ? '' : '/') + cleanPath;
}
// Two reusable side-by-side viewer windows, one per "slot":
//   'epo' → the Espacenet record opened automatically by Prev/Next
//   'pdf' → the PatSeer source PDF opened by the header "Open PDF" button
// Keeping them separate lets you park the EPO record and the source PDF side by
// side on display 2 instead of one replacing the other.
var patentWindows = { epo: null, pdf: null };
var PATENT_WINDOW_NAMES = { epo: 'evtolPatentEpoViewer', pdf: 'evtolPatentPdfViewer' };

// Where the viewer windows should appear, captured via the header "Set viewer
// area" button and remembered across patents AND across F5 (it lives in
// localStorage). Returns null when never calibrated, so we fall back to a spot
// beside the wizard.
var VIEWER_GEO_KEY = 'evtolViewerGeo_v1';
function getViewerGeo() {
  try {
    var g = JSON.parse(localStorage.getItem(VIEWER_GEO_KEY));
    if (g && g.width > 120 && g.height > 120) return g;
  } catch (e) {}
  return null;
}

function openOrUpdatePatentWindow(url, slot) {
  if (!url) return;
  slot = (slot === 'pdf') ? 'pdf' : 'epo';
  var win = patentWindows[slot];
  // ── Reuse by NAME: window.open(url, <name>), no features (2026-07-03 v3) ──
  // History of this block: v1 reused the popup by assigning win.location.href
  // (cross-origin location WRITES are allowed) — but Espacenet is now behind
  // Cloudflare bot screening, and that scripted cross-origin navigation is
  // exactly what it challenges: every Prev/Next stalled on a non-resolving
  // challenge page (the __cf_chl_f_tk token in the stuck URL is the tell), so
  // the popup stayed on the LAST patent that resolved. v2 closed + reopened a
  // fresh window each time — Cloudflare passed, but every patent reset the
  // popup to a computed position, destroying the reviewer's hand-dragged
  // two-display layout (they don't use Set viewer area) and the two viewers
  // kept landing on top of each other. v3 (this): window.open(url, sameName)
  // WITHOUT a features string — the browser navigates the EXISTING named
  // window in place, KEEPING its user-dragged geometry, and unlike a
  // location.href write the open() call consumes the click's transient user
  // activation, which Cloudflare accepts as a human navigation. The
  // positioned fresh-open below only runs when no live popup exists.
  if (win && !win.closed) {
    try {
      win = window.open(url, PATENT_WINDOW_NAMES[slot]);   // navigate in place, keep position
      if (win) {
        patentWindows[slot] = win;
        try { win.focus(); } catch (e) {}
        return;
      }
    } catch (e) { /* severed reference — fall through to a fresh open */ }
  }
  // ── Fresh open (every call — see close-and-reopen note above) ─────────────
